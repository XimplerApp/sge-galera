<!DOCTYPE html>
<html>
<head>
  <title>Registro de Ensayos - Galera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- LIBRERÍA EXCEL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
    h1 {color:#38bdf8;}
    .container {max-width:1100px; margin:auto;}
    .card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}
    input, select {
      width:100%; padding:10px; margin:8px 0; border-radius:6px; border:none;
    }
    button {
      padding:10px; background:#38bdf8; border:none; border-radius:6px; cursor:pointer;
    }
    .danger {background:#ef4444;}
    .export {background:#22c55e; margin-top:10px;}
    table {width:100%; border-collapse: collapse; margin-top:20px;}
    th, td {padding:10px; border:1px solid #334155;}
    th {background:#1e293b;}
  </style>
</head>

<body>

 <div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
  <a href="resultados.html"><button>📊 Resultados</button></a>
  <a href="pipeline.html"><button>🌱 Pipeline</button></a>
  <a href="tablero.html"><button>🧠 Tablero</button></a>
  <a href="inteligencia.html"><button>🧠 Inteligencia de Mercado</button></a>
  <a href="innovacion.html"><button>🚀 Innovación</button></a>
</div>

<div class="container">

<h1>🚀 Registro de Ensayos - Galera</h1>

<div class="card">

<h2>Nuevo Ensayo</h2>

<input id="tecnico" placeholder="Técnico responsable">
<input id="region" placeholder="Región">
<input id="cultivo" placeholder="Cultivo">
<input id="objetivo" placeholder="Objetivo">

<input id="ciclo" placeholder="Ciclo agrícola">

<select id="sistema">
  <option>Campo abierto</option>
  <option>Invernadero</option>
</select>

<input id="suelo" placeholder="Tipo de suelo">
<input id="riego" placeholder="Sistema de riego">

<label>Fecha siembra</label>
<input type="date" id="siembra">

<label>Fecha cosecha</label>
<input type="date" id="cosecha">

<input id="variedadTratada" placeholder="Variedad tratada">
<input id="variedadControl" placeholder="Variedad control">
<input id="proveedor" placeholder="Proveedor">

<input id="superficie" placeholder="Superficie">
<input id="productor" placeholder="Productor">

<select id="estado">
  <option>Planeado</option>
  <option>Activo</option>
  <option>Terminado</option>
</select>

<button onclick="guardar()">Guardar Ensayo</button>

</div>

<div class="card">

<h2>Ensayos Registrados</h2>

<button class="export" onclick="exportarExcel()">📊 Exportar a Excel</button>

<table>
<thead>
<tr>
<th>ID</th>
<th>Cultivo</th>
<th>Variedad</th>
<th>Región</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<script>

let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];

function guardar(){

  let ensayo = {
    id: Date.now(),
    tecnico: tecnico.value,
    region: region.value,
    cultivo: cultivo.value,
    objetivo: objetivo.value,
    ciclo: ciclo.value,
    sistema: sistema.value,
    suelo: suelo.value,
    riego: riego.value,
    fecha_siembra: siembra.value,
    fecha_cosecha: cosecha.value,
    variedad_tratada: variedadTratada.value,
    variedad_control: variedadControl.value,
    proveedor_control: proveedor.value,
    superficie: superficie.value,
    productor: productor.value,
    estado: estado.value
  };

  ensayos.push(ensayo);
  localStorage.setItem("ensayos", JSON.stringify(ensayos));

  render();
}

function eliminar(id){
  ensayos = ensayos.filter(e => e.id !== id);
  localStorage.setItem("ensayos", JSON.stringify(ensayos));
  render();
}

function render(){

  let tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  ensayos.forEach(e => {
    tabla.innerHTML += `
      <tr>
        <td>${e.id}</td>
        <td>${e.cultivo}</td>
        <td>${e.variedad_tratada}</td>
        <td>${e.region}</td>
        <td>${e.estado}</td>
        <td>
          <button class="danger" onclick="eliminar(${e.id})">Eliminar</button>
        </td>
      </tr>
    `;
  });
}

function exportarExcel(){

  let data = ensayos.map(e => ({
    "ID Ensayo": e.id,
    "Técnico": e.tecnico,
    "Región": e.region,
    "Cultivo": e.cultivo,
    "Objetivo": e.objetivo,
    "Ciclo": e.ciclo,
    "Sistema": e.sistema,
    "Suelo": e.suelo,
    "Riego": e.riego,
    "Fecha Siembra": e.fecha_siembra,
    "Fecha Cosecha": e.fecha_cosecha,
    "Variedad Tratada": e.variedad_tratada,
    "Variedad Control": e.variedad_control,
    "Proveedor": e.proveedor_control,
    "Superficie": e.superficie,
    "Productor": e.productor,
    "Estado": e.estado
  }));

  let ws = XLSX.utils.json_to_sheet(data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Ensayos");

  XLSX.writeFile(wb, "Ensayos_Galera.xlsx");
}

render();

</script>

</body>
</html>
