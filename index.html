ntFilters();\n\n    return ensayos.filter(e => {\n      if(f.region && e.region !== f.region) return false;\n      if(f.cultivo && e.cultivo !== f.cultivo) return false;\n      if(f.estado && e.estado !== f.estado) return false;\n      if(f.variedad && e.variedad_tratada !== f.variedad) return false;\n      return true;\n    });\n  }\n\n  function cargarFiltros(){\n    const regiones = [...new Set(ensayos.map(e => e.region).filter(Boolean))].sort();\n    const cultivos = [...new Set(ensayos.map(e => e.cultivo).filter(Boolean))].sort();\n    const estados = [...new Set(ensayos.map(e => e.estado).filter(Boolean))].sort();\n    const variedades = [...new Set(ensayos.map(e => e.variedad_tratada).filter(Boolean))].sort();\n\n    document.getElementById(\"filtroRegion\").innerHTML =\n      `<option value=\"\">Todas</option>` +\n      regiones.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n\n    document.getElementById(\"filtroCultivo\").innerHTML =\n      `<option value=\"\">Todos</option>` +\n      cultivos.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n\n    document.getElementById(\"filtroEstado\").innerHTML =\n      `<option value=\"\">Todos</option>` +\n      estados.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n\n    document.getElementById(\"filtroVariedad\").innerHTML =\n      `<option value=\"\">Todas</option>` +\n      variedades.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n  }\n\n  function limpiarFiltros(){\n    document.getElementById(\"filtroRegion\").value = \"\";\n    document.getElementById(\"filtroCultivo\").value = \"\";\n    document.getElementById(\"filtroEstado\").value = \"\";\n    document.getElementById(\"filtroVariedad\").value = \"\";\n    aplicarFiltros();\n  }\n\n  function getROIClass(roi){\n    if(roi >= 0.30) return \"green\";\n    if(roi >= 0) return \"yellow\";\n    return \"red\";\n  }\n\n  function regionReferenceCoords(region){\n    const txt = String(region || \"\").toLowerCase();\n\n    const catalog = [\n      { keys:[\"culiacan\",\"culiacán\",\"sinaloa\",\"noroeste\"], coords:[24.8091,-107.3940] },\n      { keys:[\"sonora\",\"hermosillo\"], coords:[29.0729,-110.9559] },\n      { keys:[\"baja\",\"tijuana\",\"mexicali\"], coords:[32.5149,-117.0382] },\n      { keys:[\"bajio\",\"bajío\",\"guanajuato\",\"queretaro\",\"querétaro\",\"irapuato\",\"celaya\"], coords:[20.6767,-101.3563] },\n      { keys:[\"jalisco\",\"occidente\",\"guadalajara\"], coords:[20.6597,-103.3496] },\n      { keys:[\"chihuahua\",\"coahuila\",\"durango\",\"norte\"], coords:[28.6353,-106.0889] },\n      { keys:[\"nuevo leon\",\"nuevo león\",\"monterrey\",\"tamaulipas\"], coords:[25.6866,-100.3161] },\n      { keys:[\"centro\",\"cdmx\",\"ciudad de mexico\",\"ciudad de méxico\",\"estado de mexico\",\"estado de méxico\",\"puebla\",\"hidalgo\",\"morelos\",\"tlaxcala\"], coords:[19.4326,-99.1332] },\n      { keys:[\"veracruz\",\"golfo\"], coords:[19.1738,-96.1342] },\n      { keys:[\"oaxaca\",\"chiapas\",\"sureste\",\"tabasco\"], coords:[17.0732,-96.7266] },\n      { keys:[\"yucatan\",\"yucatán\",\"merida\",\"mérida\",\"campeche\",\"quintana roo\"], coords:[20.9674,-89.5926] }\n    ];\n\n    for(const item of catalog){\n      if(item.keys.some(k => txt.includes(k))) return item.coords;\n    }\n\n    return [23.6345, -102.5528];\n  }\n\n  function inferredCoords(region, regionalIndex){\n    const base = regionReferenceCoords(region);\n    const stepLat = 0.18;\n    const stepLng = 0.18;\n    const x = (regionalIndex % 5) - 2;\n    const y = (Math.floor(regionalIndex / 5) % 5) - 2;\n    return [\n      base[0] + (x * stepLat),\n      base[1] + (y * stepLng)\n    ];\n  }\n\n  function aggregateVarieties(filteredEnsayos){\n    const resultadosMap = latestResultadosMap();\n    const grouped = {};\n\n    filteredEnsayos.forEach(e => {\n      const key = e.variedad_tratada || \"Sin variedad\";\n      const r = resultadosMap[String(e.id)] || null;\n      const ops = opportunitiesByEnsayo(e.id);\n\n      if(!grouped[key]){\n        grouped[key] = {\n          variedad: key,\n          ensayos: 0,\n          cultivos: new Set(),\n          regiones: new Set(),\n          ventas: 0,\n          leads: 0,\n          estimado: 0,\n          superficiePotencial: 0,\n          superficieEnsayo: 0,\n          costoSum: 0,\n          costoCount: 0,\n          roiSum: 0,\n          roiCount: 0,\n          proyeccionSum: 0,\n          proyeccionCount: 0,\n          adopcionCount: 0\n        };\n      }\n\n      const g = grouped[key];\n      g.ensayos++;\n      g.cultivos.add(e.cultivo || \"\");\n      g.regiones.add(e.region || \"\");\n\n      const ventas = ops.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n      const leads = ops.reduce((a,b) => a + Number(b.leads || 0), 0);\n      const estimado = ops.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);\n      const supPot = ops.reduce((a,b) => a + Number(b.superficiePotencial || b.area || 0), 0);\n\n      g.ventas += ventas;\n      g.leads += leads;\n      g.estimado += estimado;\n      g.superficiePotencial += supPot;\n      g.superficieEnsayo += parseSurfaceHa(e.superficie);\n\n      if(ventas > 0) g.adopcionCount++;\n\n      if(r){\n        const costo = Number(r.costoTotal || 0);\n        const roi = Number(r.roi || 0);\n        const proy = Number(r.proyeccionPotencial || r.margenEnsayo || r.margen || 0);\n\n        if(!isNaN(costo) && costo > 0){\n          g.costoSum += costo;\n          g.costoCount++;\n        }\n        if(!isNaN(roi)){\n          g.roiSum += roi;\n          g.roiCount++;\n        }\n        if(!isNaN(proy) && proy > 0){\n          g.proyeccionSum += proy;\n          g.proyeccionCount++;\n        }\n      }\n    });\n\n    const arr = Object.values(grouped).map(g => {\n      const roiProm = g.roiCount ? g.roiSum / g.roiCount : 0;\n      const adopcionPct = g.ensayos ? (g.adopcionCount / g.ensayos) * 100 : 0;\n      const conversionValor = g.estimado > 0 ? (g.ventas / g.estimado) * 100 : 0;\n      const leadsPorEnsayo = g.ensayos ? g.leads / g.ensayos : 0;\n      const costoProm = g.costoCount ? g.costoSum / g.costoCount : 0;\n\n      const economicBase = g.proyeccionCount\n        ? (g.proyeccionSum / g.proyeccionCount)\n        : g.ventas;\n\n      const impactPerHa = (g.superficiePotencial > 0)\n        ? (economicBase / g.superficiePotencial)\n        : ((g.superficieEnsayo > 0) ? (economicBase / g.superficieEnsayo) : economicBase);\n\n      const reachRaw = leadsPorEnsayo;\n      const impactRaw = impactPerHa;\n      const confidenceRaw = (Math.max(roiProm, 0) * 100 * 0.7) + ((Math.min(g.ensayos, 4) / 4) * 30);\n      const effortRaw = costoProm;\n\n      return {\n        ...g,\n        roiProm,\n        adopcionPct,\n        conversionValor,\n        leadsPorEnsayo,\n        costoProm,\n        impactPerHa,\n        reachRaw,\n        impactRaw,\n        confidenceRaw,\n        effortRaw\n      };\n    });\n\n    function normalize(values, value, invert=false){\n      const cleaned = values.filter(v => isFinite(v));\n      if(!cleaned.length) return 3;\n      const min = Math.min(...cleaned);\n      const max = Math.max(...cleaned);\n      if(max === min) return 3;\n      const ratio = invert ? (max - value) / (max - min) : (value - min) / (max - min);\n      return 1 + (4 * ratio);\n    }\n\n    const reachValues = arr.map(x => x.reachRaw);\n    const impactValues = arr.map(x => x.impactRaw);\n    const confidenceValues = arr.map(x => x.confidenceRaw);\n    const effortValues = arr.map(x => x.effortRaw);\n\n    arr.forEach(x => {\n      x.reachScore = normalize(reachValues, x.reachRaw, false);\n      x.impactScore = normalize(impactValues, x.impactRaw, false);\n      x.confidenceScore = normalize(confidenceValues, x.confidenceRaw, false);\n      x.effortScore = normalize(effortValues, x.effortRaw, true);\n      x.priorityScore = (x.reachScore * x.impactScore * x.confidenceScore) / x.effortScore;\n    });\n\n    return arr.sort((a,b) => b.priorityScore - a.priorityScore);\n  }\n\n  function renderResumen(){\n    const lista = getFilteredEnsayos();\n    const resultadosMap = latestResultadosMap();\n    const bitacoraMap = latestBitacoraMap();\n\n    const ensayosConResultado = lista.filter(e => resultadosMap[String(e.id)]).length;\n    const ensayosConVenta = lista.filter(e => {\n      return opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0) > 0;\n    }).length;\n\n    const totalVentas = lista.reduce((acc,e) => {\n      return acc + opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n    }, 0);\n\n    const totalLeads = lista.reduce((acc,e) => {\n      return acc + opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.leads || 0), 0);\n    }, 0);\n\n    const roiValues = lista\n      .map(e => resultadosMap[String(e.id)]?.roi)\n      .filter(v => typeof v === \"number\");\n\n    const roiProm = roiValues.length\n      ? roiValues.reduce((a,b) => a + b, 0) / roiValues.length\n      : 0;\n\n    const geoReal = lista.filter(e => bitacoraMap[String(e.id)]).length;\n    const geoInferida = Math.max(lista.length - geoReal, 0);\n\n    document.getElementById(\"resumenEstrategico\").innerHTML = `\n      <div class=\"mini\">\n        <span>Ensayos filtrados</span>\n        <b>${lista.length}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Con resultado</span>\n        <b>${ensayosConResultado}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Con venta cerrada</span>\n        <b>${ensayosConVenta}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Leads acumulados</span>\n        <b>${num(totalLeads)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Ventas cerradas</span>\n        <b>${money(totalVentas)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>ROI promedio</span>\n        <b>${pct(roiProm * 100)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Marcadores con geo real</span>\n        <b>${geoReal}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Marcadores inferidos</span>\n        <b>${geoInferida}</b>\n      </div>\n    `;\n  }\n\n  function renderMap(){\n    markerLayer.clearLayers();\n\n    const lista = getFilteredEnsayos();\n    const resultadosMap = latestResultadosMap();\n    const bitacoraMap = latestBitacoraMap();\n\n    const bounds = [];\n    const usageByRegion = {};\n\n    lista.forEach(e => {\n      const b = bitacoraMap[String(e.id)];\n      const r = resultadosMap[String(e.id)] || {};\n      const ops = opportunitiesByEnsayo(e.id);\n      const leads = ops.reduce((a,x) => a + Number(x.leads || 0), 0);\n      const ventas = ops.reduce((a,x) => a + Number(x.ventaCerrada || 0), 0);\n      const roi = Number(r.roi || 0);\n\n      let lat, lng, geoSource;\n\n      if(b){\n        lat = b.lat;\n        lng = b.lng;\n        geoSource = \"Geo real de bitácora\";\n      } else {\n        const regionKey = e.region || \"Sin región\";\n        usageByRegion[regionKey] = (usageByRegion[regionKey] || 0);\n        const coords = inferredCoords(regionKey, usageByRegion[regionKey]);\n        usageByRegion[regionKey]++;\n        lat = coords[0];\n        lng = coords[1];\n        geoSource = \"Ubicación inferida por región\";\n      }\n\n      const popup = `\n        <div class=\"popup\">\n          <b>${e.variedad_tratada || \"Sin variedad\"}</b><br>\n          Ensayo: ${e.id}<br>\n          Cultivo: ${e.cultivo || \"N/D\"}<br>\n          Región: ${e.region || \"N/D\"}<br>\n          Estado: ${e.estado || \"N/D\"}<br>\n          ROI: ${pct(roi * 100)}<br>\n          Leads: ${num(leads)}<br>\n          Venta cerrada: ${money(ventas)}<br>\n          Productor: ${e.productor || \"N/D\"}<br>\n          Ubicación: ${geoSource}\n        </div>\n      `;\n\n      let markerColor = \"red\";\n      if(roi >= 0.3) markerColor = \"green\";\n      else if(roi >= 0) markerColor = \"orange\";\n\n      const borderColor = geoSource.includes(\"real\") ? \"#ffffff\" : \"#94a3b8\";\n\n      const icon = L.divIcon({\n        className: \"custom-div-icon\",\n        html: `<div style=\"background:${markerColor};width:14px;height:14px;border-radius:50%;border:2px solid ${borderColor};opacity:${geoSource.includes(\"real\") ? 1 : 0.85};\"></div>`,\n        iconSize: [14,14],\n        iconAnchor: [7,7]\n      });\n\n      L.marker([lat, lng], { icon })\n        .addTo(markerLayer)\n        .bindPopup(popup);\n\n      bounds.push([lat, lng]);\n    });\n\n    if(bounds.length){\n      map.fitBounds(bounds, { padding:[30,30] });\n    }else{\n      map.setView([23.6, -102.5], 5);\n    }\n  }\n\n  function renderTablaRegion(){\n    const lista = getFilteredEnsayos();\n    const resultadosMap = latestResultadosMap();\n\n    let html = `\n      <tr>\n        <th>ID</th>\n        <th>Región</th>\n        <th>Cultivo</th>\n        <th>Variedad</th>\n        <th>Estado</th>\n        <th>ROI</th>\n        <th>Leads</th>\n        <th>Venta cerrada</th>\n        <th>Evaluación</th>\n      </tr>\n    `;\n\n    if(!lista.length){\n      html += `\n        <tr>\n          <td colspan=\"9\" class=\"empty\">No hay ensayos para los filtros seleccionados.</td>\n        </tr>\n      `;\n      document.getElementById(\"tablaRegion\").innerHTML = html;\n      return;\n    }\n\n    lista\n      .slice()\n      .sort((a,b) => {\n        if((a.region || \"\") < (b.region || \"\")) return -1;\n        if((a.region || \"\") > (b.region || \"\")) return 1;\n        return 0;\n      })\n      .forEach(e => {\n        const r = resultadosMap[String(e.id)] || {};\n        const roi = Number(r.roi || 0);\n        const roiClass = getROIClass(roi);\n        const ops = opportunitiesByEnsayo(e.id);\n        const leads = ops.reduce((a,x) => a + Number(x.leads || 0), 0);\n        const ventas = ops.reduce((a,x) => a + Number(x.ventaCerrada || 0), 0);\n\n        html += `\n          <tr>\n            <td>${e.id}</td>\n            <td>${e.region || \"\"}</td>\n            <td>${e.cultivo || \"\"}</td>\n            <td>${e.variedad_tratada || \"\"}</td>\n            <td>${e.estado || \"\"}</td>\n            <td class=\"${roiClass}\"><b>${pct(roi * 100)}</b></td>\n            <td>${num(leads)}</td>\n            <td>${money(ventas)}</td>\n            <td>${r.evaluacion || \"Sin evaluar\"}</td>\n          </tr>\n        `;\n      });\n\n    document.getElementById(\"tablaRegion\").innerHTML = html;\n  }\n\n  function renderRanking(){\n    const lista = getFilteredEnsayos();\n    const variedades = aggregateVarieties(lista);\n\n    let html = `\n      <tr>\n        <th>Variedad</th>\n        <th>Cultivos</th>\n        <th>Ensayos</th>\n        <th>ROI promedio</th>\n        <th>Leads/ensayo</th>\n        <th>Ventas</th>\n        <th>Adopción</th>\n        <th>Prioridad</th>\n      </tr>\n    `;\n\n    if(!variedades.length){\n      html += `\n        <tr>\n          <td colspan=\"8\" class=\"empty\">No hay información suficiente para ranking.</td>\n        </tr>\n      `;\n      document.getElementById(\"ranking\").innerHTML = html;\n      return;\n    }\n\n    variedades.forEach(item => {\n      const nivel = item.adopcionPct > 60 ? \"Alta\" : item.adopcionPct > 30 ? \"Media\" : \"Baja\";\n      const roiClass = getROIClass(item.roiProm);\n      const scoreClass = item.priorityScore >= 12 ? \"green\" : item.priorityScore >= 7 ? \"yellow\" : \"red\";\n\n      html += `\n        <tr>\n          <td><b>${item.variedad}</b></td>\n          <td>${[...item.cultivos].filter(Boolean).join(\", \") || \"N/D\"}</td>\n          <td>${item.ensayos}</td>\n          <td class=\"${roiClass}\"><b>${pct(item.roiProm * 100)}</b></td>\n          <td>${num(item.leadsPorEnsayo)}</td>\n          <td>${money(item.ventas)}</td>\n          <td>${nivel} (${pct(item.adopcionPct)})</td>\n          <td class=\"${scoreClass}\"><b>${num(item.priorityScore)}</b></td>\n        </tr>\n      `;\n    });\n\n    document.getElementById(\"ranking\").innerHTML = html;\n  }\n\n  function renderRICE(){\n    const lista = getFilteredEnsayos();\n    const variedades = aggregateVarieties(lista);\n\n    if(!variedades.length){\n      document.getElementById(\"rice\").innerHTML = `<p class=\"empty\">No hay información suficiente para calcular prioridad comparable.</p>`;\n      return;\n    }\n\n    const bloques = variedades.map(v => {\n      let decision = \"\";\n      let texto = \"\";\n      let color = \"\";\n\n      if(v.priorityScore >= 12){\n        decision = \"🚀 ESCALAR\";\n        texto = \"Prioridad alta. Buen balance entre alcance, impacto, confianza y esfuerzo.\";\n        color = \"green\";\n      } else if(v.priorityScore >= 7){\n        decision = \"⚙️ OPTIMIZAR\";\n        texto = \"Potencial interesante, pero aún conviene reforzar evidencia o eficiencia.\";\n        color = \"yellow\";\n      } else {\n        decision = \"⛔ REVISAR\";\n        texto = \"Prioridad baja hoy. Requiere replantear enfoque o detener inversión adicional.\";\n        color = \"red\";\n      }\n\n      return `\n        <div class=\"list-block\">\n          <div class=\"kpi\"><b>${v.variedad}</b></div>\n          <div class=\"kpi\">Reach normalizado (leads/ensayo): <b>${num(v.reachScore)}</b> <span class=\"badge\">Raw: ${num(v.leadsPorEnsayo)}</span></div>\n          <div class=\"kpi\">Impact normalizado (impacto/ha): <b>${num(v.impactScore)}</b> <span class=\"badge\">Raw: ${money(v.impactPerHa)}</span></div>\n          <div class=\"kpi\">Confidence normalizado (ROI + evidencia): <b>${num(v.confidenceScore)}</b> <span class=\"badge\">ROI: ${pct(v.roiProm * 100)}</span></div>\n          <div class=\"kpi\">Effort normalizado (costo promedio): <b>${num(v.effortScore)}</b> <span class=\"badge\">Raw: ${money(v.costoProm)}</span></div>\n          <div class=\"kpi ${color}\">Score RICE normalizado: <b>${num(v.priorityScore)}</b> | ${decision}</div>\n          <div class=\"kpi muted\">${texto}</div>\n        </div>\n      `;\n    }).join(\"\");\n\n    document.getElementById(\"rice\").innerHTML = bloques;\n  }\n\n  function aplicarFiltros(){\n    renderResumen();\n    renderMap();\n    renderTablaRegion();\n    renderRanking();\n    renderRICE();\n  }\n\n  cargarFiltros();\n  aplicarFiltros();", "functions": ["aggregateVarieties", "aplicarFiltros", "cargarFiltros", "ensayoLabel", "formatDate", "getCurrentFilters", "getData", "getFilteredEnsayos", "getROIClass", "inferredCoords", "latestBitacoraMap", "latestResultadosMap", "limpiarFiltros", "normalize", "opportunitiesByEnsayo", "parseSurfaceHa", "regionReferenceCoords", "renderMap", "renderRICE", "renderRanking", "renderResumen", "renderTablaRegion"]}, "innovacion": {"html": "<div class=\"container\">\n<h1>🧬 Innovación Varietal</h1>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Filtros</h2>\n      <span class=\"badge\">Portafolio varietal y radar</span>\n    </div>\n\n    <div class=\"grid\">\n      <div>\n        <label>Cultivo</label>\n        <select id=\"filtroCultivo\"></select>\n      </div>\n      <div>\n        <label>Región</label>\n        <select id=\"filtroRegion\"></select>\n      </div>\n      <div>\n        <label>Estado del ensayo</label>\n        <select id=\"filtroEstado\"></select>\n      </div>\n      <div>\n        <label>Variedad</label>\n        <select id=\"filtroVariedad\"></select>\n      </div>\n    </div>\n\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.aplicarFiltros()\">Aplicar filtros</button>\n      <button class=\"secondary\" onclick=\"SGE.current.limpiarFiltros()\">Limpiar filtros</button>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Pesos del Score Varietal</h2>\n      <span class=\"badge\">Configurables por estrategia del ciclo</span>\n    </div>\n\n    <div class=\"grid\">\n      <div class=\"weight-box\">\n        <label>Preset estratégico</label>\n        <select id=\"presetPesos\">\n          <option value=\"balanceado\">Balanceado</option>\n          <option value=\"rendimiento\">Enfoque Rendimiento</option>\n          <option value=\"comercial\">Enfoque Comercial</option>\n          <option value=\"sanidad\">Enfoque Sanidad</option>\n          <option value=\"adopcion\">Enfoque Adopción</option>\n        </select>\n      </div>\n\n      <div class=\"weight-box\">\n        <label>Rendimiento / Benchmark (%)</label>\n        <input id=\"pesoRendimiento\" type=\"number\" min=\"0\" step=\"1\">\n      </div>\n\n      <div class=\"weight-box\">\n        <label>ROI (%)</label>\n        <input id=\"pesoROI\" type=\"number\" min=\"0\" step=\"1\">\n      </div>\n\n      <div class=\"weight-box\">\n        <label>Conversión (%)</label>\n        <input id=\"pesoConversion\" type=\"number\" min=\"0\" step=\"1\">\n      </div>\n\n      <div class=\"weight-box\">\n        <label>Adopción (%)</label>\n        <input id=\"pesoAdopcion\" type=\"number\" min=\"0\" step=\"1\">\n      </div>\n\n      <div class=\"weight-box\">\n        <label>Sanidad (%)</label>\n        <input id=\"pesoSanidad\" type=\"number\" min=\"0\" step=\"1\">\n      </div>\n\n      <div class=\"weight-box\">\n        <label>Tracción (%)</label>\n        <input id=\"pesoTraccion\" type=\"number\" min=\"0\" step=\"1\">\n      </div>\n    </div>\n\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.aplicarPreset()\">Aplicar preset</button>\n      <button onclick=\"SGE.current.guardarPesos()\">Guardar pesos</button>\n      <button class=\"secondary\" onclick=\"SGE.current.restablecerPesos()\">Restablecer</button>\n    </div>\n\n    <div class=\"weight-note\" id=\"pesoInfo\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Resumen Ejecutivo</h2>\n      <span class=\"badge\">Portafolio activo</span>\n    </div>\n    <div class=\"grid\" id=\"resumenEjecutivo\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Radar de Innovación Varietal</h2>\n      <span class=\"badge\">Escala 1 a 5</span>\n    </div>\n\n    <div class=\"grid\" style=\"margin-bottom:14px;\">\n      <div>\n        <label>Variedad para visualizar</label>\n        <select id=\"radarVariedad\"></select>\n      </div>\n    </div>\n\n    <div class=\"radar-wrap\">\n      <div class=\"radar-panel\">\n        <div id=\"radarContainer\"></div>\n      </div>\n      <div class=\"radar-panel\">\n        <h3 id=\"radarTitulo\">Detalle varietal</h3>\n        <div id=\"radarInsights\"></div>\n        <div class=\"legend\" id=\"radarLegend\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Portafolio Varietal</h2>\n      <span class=\"badge\">Score, benchmark y recomendación</span>\n    </div>\n    <table id=\"tablaPortafolio\"></table>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Decisiones Recomendadas</h2>\n      <span class=\"badge\">Priorización ejecutiva</span>\n    </div>\n    <div id=\"panelDecisiones\"></div>\n  </div>\n\n</div>", "script": "function getData(key){\n    try{\n      return JSON.parse(localStorage.getItem(key)) || [];\n    }catch(e){\n      return [];\n    }\n  }\n\n  function saveData(key, data){\n    localStorage.setItem(key, JSON.stringify(data));\n  }\n\n  const money = n => \"$\" + new Intl.NumberFormat(\"es-MX\", {\n    minimumFractionDigits:2,\n    maximumFractionDigits:2\n  }).format(Number(n || 0));\n\n  const pct = n => new Intl.NumberFormat(\"es-MX\", {\n    minimumFractionDigits:2,\n    maximumFractionDigits:2\n  }).format(Number(n || 0)) + \"%\";\n\n  const num = n => new Intl.NumberFormat(\"es-MX\", {\n    minimumFractionDigits:2,\n    maximumFractionDigits:2\n  }).format(Number(n || 0));\n\n  let ensayos = getData(\"ensayos\");\n  let resultados = getData(\"resultados\");\n  let oportunidades = getData(\"oportunidades\");\n\n  const DEFAULT_PESOS = {\n    rendimiento: 25,\n    roi: 20,\n    conversion: 15,\n    adopcion: 15,\n    sanidad: 10,\n    traccion: 15\n  };\n\n  const PRESETS = {\n    balanceado: {\n      rendimiento: 25,\n      roi: 20,\n      conversion: 15,\n      adopcion: 15,\n      sanidad: 10,\n      traccion: 15\n    },\n    rendimiento: {\n      rendimiento: 35,\n      roi: 20,\n      conversion: 10,\n      adopcion: 10,\n      sanidad: 15,\n      traccion: 10\n    },\n    comercial: {\n      rendimiento: 15,\n      roi: 25,\n      conversion: 25,\n      adopcion: 15,\n      sanidad: 5,\n      traccion: 15\n    },\n    sanidad: {\n      rendimiento: 20,\n      roi: 15,\n      conversion: 10,\n      adopcion: 10,\n      sanidad: 30,\n      traccion: 15\n    },\n    adopcion: {\n      rendimiento: 15,\n      roi: 15,\n      conversion: 15,\n      adopcion: 30,\n      sanidad: 10,\n      traccion: 15\n    }\n  };\n\n  function latestResultadosMap(){\n    const mapObj = {};\n    resultados.forEach(r => {\n      const key = String(r.ensayo_id);\n      if(!mapObj[key]){\n        mapObj[key] = r;\n      }else{\n        const a = String(r.fechaActualizacionISO || r.fechaISO || r.id || \"\");\n        const b = String(mapObj[key].fechaActualizacionISO || mapObj[key].fechaISO || mapObj[key].id || \"\");\n        if(a > b){\n          mapObj[key] = r;\n        }\n      }\n    });\n    return mapObj;\n  }\n\n  function opportunitiesByEnsayo(ensayoId){\n    return oportunidades.filter(o => String(o.ensayo) === String(ensayoId));\n  }\n\n  function getCurrentFilters(){\n    return {\n      cultivo: document.getElementById(\"filtroCultivo\").value,\n      region: document.getElementById(\"filtroRegion\").value,\n      estado: document.getElementById(\"filtroEstado\").value,\n      variedad: document.getElementById(\"filtroVariedad\").value\n    };\n  }\n\n  function getFilteredEnsayos(){\n    const f = getCurrentFilters();\n\n    return ensayos.filter(e => {\n      if(f.cultivo && e.cultivo !== f.cultivo) return false;\n      if(f.region && e.region !== f.region) return false;\n      if(f.estado && e.estado !== f.estado) return false;\n      if(f.variedad && e.variedad_tratada !== f.variedad) return false;\n      return true;\n    });\n  }\n\n  function cargarFiltros(){\n    const cultivos = [...new Set(ensayos.map(e => e.cultivo).filter(Boolean))].sort();\n    const regiones = [...new Set(ensayos.map(e => e.region).filter(Boolean))].sort();\n    const estados = [...new Set(ensayos.map(e => e.estado).filter(Boolean))].sort();\n    const variedades = [...new Set(ensayos.map(e => e.variedad_tratada).filter(Boolean))].sort();\n\n    document.getElementById(\"filtroCultivo\").innerHTML =\n      `<option value=\"\">Todos</option>` +\n      cultivos.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n\n    document.getElementById(\"filtroRegion\").innerHTML =\n      `<option value=\"\">Todas</option>` +\n      regiones.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n\n    document.getElementById(\"filtroEstado\").innerHTML =\n      `<option value=\"\">Todos</option>` +\n      estados.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n\n    document.getElementById(\"filtroVariedad\").innerHTML =\n      `<option value=\"\">Todas</option>` +\n      variedades.map(v => `<option value=\"${v}\">${v}</option>`).join(\"\");\n  }\n\n  function limpiarFiltros(){\n    document.getElementById(\"filtroCultivo\").value = \"\";\n    document.getElementById(\"filtroRegion\").value = \"\";\n    document.getElementById(\"filtroEstado\").value = \"\";\n    document.getElementById(\"filtroVariedad\").value = \"\";\n    aplicarFiltros();\n  }\n\n  function loadPesos(){\n    const saved = getData(\"innovacion_pesos\");\n    const pesos = {\n      ...DEFAULT_PESOS,\n      ...saved\n    };\n\n    document.getElementById(\"pesoRendimiento\").value = pesos.rendimiento;\n    document.getElementById(\"pesoROI\").value = pesos.roi;\n    document.getElementById(\"pesoConversion\").value = pesos.conversion;\n    document.getElementById(\"pesoAdopcion\").value = pesos.adopcion;\n    document.getElementById(\"pesoSanidad\").value = pesos.sanidad;\n    document.getElementById(\"pesoTraccion\").value = pesos.traccion;\n\n    updatePesoInfo();\n  }\n\n  function getPesos(){\n    return {\n      rendimiento: Number(document.getElementById(\"pesoRendimiento\").value || 0),\n      roi: Number(document.getElementById(\"pesoROI\").value || 0),\n      conversion: Number(document.getElementById(\"pesoConversion\").value || 0),\n      adopcion: Number(document.getElementById(\"pesoAdopcion\").value || 0),\n      sanidad: Number(document.getElementById(\"pesoSanidad\").value || 0),\n      traccion: Number(document.getElementById(\"pesoTraccion\").value || 0)\n    };\n  }\n\n  function getPesosNormalizados(){\n    const p = getPesos();\n    const total = p.rendimiento + p.roi + p.conversion + p.adopcion + p.sanidad + p.traccion;\n\n    if(total <= 0){\n      return {\n        rendimiento: 0.25,\n        roi: 0.20,\n        conversion: 0.15,\n        adopcion: 0.15,\n        sanidad: 0.10,\n        traccion: 0.15\n      };\n    }\n\n    return {\n      rendimiento: p.rendimiento / total,\n      roi: p.roi / total,\n      conversion: p.conversion / total,\n      adopcion: p.adopcion / total,\n      sanidad: p.sanidad / total,\n      traccion: p.traccion / total\n    };\n  }\n\n  function updatePesoInfo(){\n    const p = getPesos();\n    const total = p.rendimiento + p.roi + p.conversion + p.adopcion + p.sanidad + p.traccion;\n    document.getElementById(\"pesoInfo\").innerText =\n      `Total actual: ${total}%. Si no suma 100, el sistema lo normaliza automáticamente para calcular el score.`;\n  }\n\n  function guardarPesos(){\n    const p = getPesos();\n    saveData(\"innovacion_pesos\", p);\n    updatePesoInfo();\n    aplicarFiltros();\n  }\n\n  function restablecerPesos(){\n    saveData(\"innovacion_pesos\", DEFAULT_PESOS);\n    loadPesos();\n    aplicarFiltros();\n  }\n\n  function aplicarPreset(){\n    const preset = document.getElementById(\"presetPesos\").value;\n    const p = PRESETS[preset] || DEFAULT_PESOS;\n\n    document.getElementById(\"pesoRendimiento\").value = p.rendimiento;\n    document.getElementById(\"pesoROI\").value = p.roi;\n    document.getElementById(\"pesoConversion\").value = p.conversion;\n    document.getElementById(\"pesoAdopcion\").value = p.adopcion;\n    document.getElementById(\"pesoSanidad\").value = p.sanidad;\n    document.getElementById(\"pesoTraccion\").value = p.traccion;\n\n    updatePesoInfo();\n    aplicarFiltros();\n  }\n\n  function scoreByThreshold(value, thresholds){\n    for(let i = 0; i < thresholds.length; i++){\n      if(value >= thresholds[i].min) return thresholds[i].score;\n    }\n    return 1;\n  }\n\n  function inverseScoreByThreshold(value, thresholds){\n    for(let i = 0; i < thresholds.length; i++){\n      if(value <= thresholds[i].max) return thresholds[i].score;\n    }\n    return 1;\n  }\n\n  function classifyVariety(v){\n    if(v.scoreFinal >= 4 && v.roiProm >= 0.3 && v.adopcionPct >= 25){\n      return {\n        label: \"⭐ Escalar\",\n        className: \"green\",\n        text: \"Variedad sólida en benchmark, retorno y adopción. Prioridad alta para expansión.\"\n      };\n    }\n\n    if(v.scoreFinal >= 3.2 && v.roiProm >= 0.1){\n      return {\n        label: \"🚀 Promesa\",\n        className: \"yellow\",\n        text: \"Buen potencial técnico-comercial. Conviene reforzar evidencia o ampliar validación.\"\n      };\n    }\n\n    if(v.scoreFinal >= 2.4){\n      return {\n        label: \"🧪 Experimental\",\n        className: \"yellow\",\n        text: \"Aún necesita mejor benchmark, tracción o conversión antes de escalar.\"\n      };\n    }\n\n    return {\n      label: \"⛔ Revisar\",\n      className: \"red\",\n      text: \"Desempeño limitado. Conviene replantear la estrategia o reducir prioridad.\"\n      };\n  }\n\n  function aggregateVarieties(){\n    const lista = getFilteredEnsayos();\n    const resultadosMap = latestResultadosMap();\n    const pesos = getPesosNormalizados();\n    const variedades = {};\n\n    lista.forEach(e => {\n      const key = e.variedad_tratada || \"Sin variedad\";\n      const r = resultadosMap[String(e.id)] || null;\n      const ops = opportunitiesByEnsayo(e.id);\n\n      if(!variedades[key]){\n        variedades[key] = {\n          variedad: key,\n          ensayos: 0,\n          cultivos: new Set(),\n          regiones: new Set(),\n          competidores: new Set(),\n          roiSum: 0,\n          roiCount: 0,\n          mejoraSum: 0,\n          mejoraCount: 0,\n          tratadoSum: 0,\n          tratadoCount: 0,\n          controlSum: 0,\n          controlCount: 0,\n          plagaSum: 0,\n          plagaCount: 0,\n          calidadCount: 0,\n          leads: 0,\n          ventas: 0,\n          estimado: 0,\n          adopcionCount: 0,\n          recompraCount: 0\n        };\n      }\n\n      const v = variedades[key];\n      v.ensayos++;\n      v.cultivos.add(e.cultivo || \"\");\n      v.regiones.add(e.region || \"\");\n      if(e.variedad_control) v.competidores.add(e.variedad_control);\n\n      if(r){\n        if(typeof r.roi === \"number\"){\n          v.roiSum += Number(r.roi || 0);\n          v.roiCount++;\n        }\n        if(typeof r.porcentaje === \"number\"){\n          v.mejoraSum += Number(r.porcentaje || 0);\n          v.mejoraCount++;\n        }\n        if(typeof r.rendTratado === \"number\"){\n          v.tratadoSum += Number(r.rendTratado || 0);\n          v.tratadoCount++;\n        }\n        if(typeof r.rendControl === \"number\"){\n          v.controlSum += Number(r.rendControl || 0);\n          v.controlCount++;\n        }\n        if(typeof r.incidenciaPlaga === \"number\"){\n          v.plagaSum += Number(r.incidenciaPlaga || 0);\n          v.plagaCount++;\n        }\n        if(r.calidadComercial && String(r.calidadComercial).trim()){\n          v.calidadCount++;\n        }\n      }\n\n      const leads = ops.reduce((a,b) => a + Number(b.leads || 0), 0);\n      const ventas = ops.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n      const estimado = ops.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);\n      const recompra = ops.some(o => o.recompra === \"Sí\") ? 1 : 0;\n\n      v.leads += leads;\n      v.ventas += ventas;\n      v.estimado += estimado;\n      v.recompraCount += recompra;\n      if(ventas > 0) v.adopcionCount++;\n    });\n\n    return Object.values(variedades).map(v => {\n      const roiProm = v.roiCount ? v.roiSum / v.roiCount : 0;\n      const mejoraProm = v.mejoraCount ? v.mejoraSum / v.mejoraCount : 0;\n      const rendTratadoProm = v.tratadoCount ? v.tratadoSum / v.tratadoCount : 0;\n      const rendControlProm = v.controlCount ? v.controlSum / v.controlCount : 0;\n      const incidenciaProm = v.plagaCount ? v.plagaSum / v.plagaCount : null;\n      const adopcionPct = v.ensayos ? (v.adopcionCount / v.ensayos) * 100 : 0;\n      const conversionValor = v.estimado > 0 ? (v.ventas / v.estimado) * 100 : 0;\n      const leadsPorEnsayo = v.ensayos ? v.leads / v.ensayos : 0;\n\n      const rendimientoScore = scoreByThreshold(mejoraProm, [\n        { min: 20, score: 5 },\n        { min: 15, score: 4 },\n        { min: 8, score: 3 },\n        { min: 0.01, score: 2 }\n      ]);\n\n      const roiScore = scoreByThreshold(roiProm, [\n        { min: 0.60, score: 5 },\n        { min: 0.30, score: 4 },\n        { min: 0.10, score: 3 },\n        { min: 0.00, score: 2 }\n      ]);\n\n      const conversionScore = scoreByThreshold(conversionValor, [\n        { min: 50, score: 5 },\n        { min: 30, score: 4 },\n        { min: 15, score: 3 },\n        { min: 0.01, score: 2 }\n      ]);\n\n      const adopcionScore = scoreByThreshold(adopcionPct, [\n        { min: 60, score: 5 },\n        { min: 40, score: 4 },\n        { min: 25, score: 3 },\n        { min: 10, score: 2 }\n      ]);\n\n      const sanidadScore = incidenciaProm === null ? 3 : inverseScoreByThreshold(incidenciaProm, [\n        { max: 3, score: 5 },\n        { max: 6, score: 4 },\n        { max: 10, score: 3 },\n        { max: 15, score: 2 }\n      ]);\n\n      const traccionScore = scoreByThreshold(leadsPorEnsayo, [\n        { min: 8, score: 5 },\n        { min: 5, score: 4 },\n        { min: 3, score: 3 },\n        { min: 1, score: 2 }\n      ]);\n\n      const scoreFinal =\n        (rendimientoScore * pesos.rendimiento) +\n        (roiScore * pesos.roi) +\n        (conversionScore * pesos.conversion) +\n        (adopcionScore * pesos.adopcion) +\n        (sanidadScore * pesos.sanidad) +\n        (traccionScore * pesos.traccion);\n\n      const status = classifyVariety({\n        scoreFinal,\n        roiProm,\n        adopcionPct\n      });\n\n      return {\n        ...v,\n        roiProm,\n        mejoraProm,\n        rendTratadoProm,\n        rendControlProm,\n        incidenciaProm,\n        adopcionPct,\n        conversionValor,\n        leadsPorEnsayo,\n        rendimientoScore,\n        roiScore,\n        conversionScore,\n        adopcionScore,\n        sanidadScore,\n        traccionScore,\n        scoreFinal,\n        status,\n        competidorTexto: [...v.competidores].filter(Boolean).join(\", \") || \"N/D\"\n      };\n    }).sort((a,b) => b.scoreFinal - a.scoreFinal);\n  }\n\n  function renderResumen(){\n    const variedades = aggregateVarieties();\n\n    const estrellas = variedades.filter(v => v.status.label.includes(\"Escalar\")).length;\n    const promesas = variedades.filter(v => v.status.label.includes(\"Promesa\")).length;\n    const pipelineEstimado = variedades.reduce((a,b) => a + Number(b.estimado || 0), 0);\n    const ventas = variedades.reduce((a,b) => a + Number(b.ventas || 0), 0);\n    const scoreProm = variedades.length ? variedades.reduce((a,b) => a + Number(b.scoreFinal || 0), 0) / variedades.length : 0;\n    const roiProm = variedades.length ? variedades.reduce((a,b) => a + Number(b.roiProm || 0), 0) / variedades.length : 0;\n    const benchmarkProm = variedades.length ? variedades.reduce((a,b) => a + Number(b.mejoraProm || 0), 0) / variedades.length : 0;\n\n    document.getElementById(\"resumenEjecutivo\").innerHTML = `\n      <div class=\"mini\">\n        <span>Variedades evaluadas</span>\n        <b>${variedades.length}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Variedades estrella</span>\n        <b>${estrellas}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Variedades promesa</span>\n        <b>${promesas}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Pipeline estimado</span>\n        <b>${money(pipelineEstimado)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Ventas derivadas</span>\n        <b>${money(ventas)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Score promedio</span>\n        <b>${num(scoreProm)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>ROI promedio portafolio</span>\n        <b>${pct(roiProm * 100)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Benchmark promedio vs control</span>\n        <b>${pct(benchmarkProm)}</b>\n      </div>\n    `;\n  }\n\n  function renderTablaPortafolio(){\n    const variedades = aggregateVarieties();\n\n    let html = `\n      <tr>\n        <th>Variedad</th>\n        <th>Competidor benchmark</th>\n        <th>Cultivos</th>\n        <th>Regiones</th>\n        <th>Ensayos</th>\n        <th>Mejora vs control</th>\n        <th>ROI</th>\n        <th>Ventas</th>\n        <th>Adopción</th>\n        <th>Score</th>\n        <th>Decisión</th>\n      </tr>\n    `;\n\n    if(!variedades.length){\n      html += `\n        <tr>\n          <td colspan=\"11\" class=\"empty\">No hay información suficiente para el portafolio varietal.</td>\n        </tr>\n      `;\n      document.getElementById(\"tablaPortafolio\").innerHTML = html;\n      return;\n    }\n\n    variedades.forEach(v => {\n      html
