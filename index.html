  /* ============================================================
     MÓDULO 🌱 PIPELINE
     ============================================================ */
  function initPipeline() {
    const $ = id => document.getElementById(id);

      function getData(key){
        try { return JSON.parse(localStorage.getItem(key)) || []; }
        catch(e){ return []; }
      }

      function saveData(key, data){
        localStorage.setItem(key, JSON.stringify(data));
      }

      function ensayoLabel(e){
        return `${e.id} | ${e.cultivo || ""} | ${e.variedad_tratada || ""} | ${e.productor || ""}`;
      }

      function formatMoney(n){
        return "$" + new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(n || 0));
      }

      function formatPct(n){
        return new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(n || 0)) + "%";
      }

      function formatNum(n){
        return new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(n || 0));
      }

      function formatDate(iso){
        if(!iso) return "";
        const d = new Date(iso + "T00:00:00");
        if(isNaN(d)) return iso;
        return d.toLocaleDateString("es-MX");
      }

      function parseNumber(value){
        if(value === null || value === undefined) return 0;
        const clean = String(value).trim().replace(/,/g, "");
        const num = parseFloat(clean);
        return isNaN(num) ? 0 : num;
      }

      function todayISO(){
        return new Date().toISOString().slice(0,10);
      }

      function isSeguimientoVencido(o){
        const hoy = todayISO();
        const etapa = String(o.etapa || "");
        const cerrada = Number(o.ventaCerrada || 0) > 0;
        if(!o.proximaFechaSeguimiento) return false;
        if(cerrada || etapa === "Venta" || etapa === "Recompra") return false;
        return o.proximaFechaSeguimiento < hoy;
      }

      let ensayos = getData("ensayos");
      let oportunidades = getData("oportunidades");
      let editId = null;

      function cargarEnsayos(){
        ensayos = getData("ensayos");

        $("idEnsayo").innerHTML = "";
        $("filtroEnsayo").innerHTML = `<option value="">Todos los ensayos</option>`;

        ensayos.forEach(e => {
          $("idEnsayo").innerHTML += `<option value="${e.id}">${ensayoLabel(e)}</option>`;
          $("filtroEnsayo").innerHTML += `<option value="${e.id}">${ensayoLabel(e)}</option>`;
        });
      }

      function limpiarFormulario(){
        editId = null;
        $("modo").innerText = "Nueva Oportunidad Comercial";
        $("btnCancelar").style.display = "none";

        $("fechaRegistro").value = todayISO();
        $("interesado").value = "Sí";
        $("productorNuevo").value = "";
        $("etapa").value = "Lead";
        $("area").value = "";
        $("superficiePotencial").value = "";
        $("leads").value = "";
        $("ventaEstimada").value = "";
        $("ventaCerrada").value = "";
        $("fechaVentaCerrada").value = "";
        $("proximaFechaSeguimiento").value = "";
        $("recompra").value = "No";
        $("responsableComercial").value = "";
        $("proximoPaso").value = "";
        $("zonaOportunidad").value = "";
        $("perfilProductorIdeal").value = "";
        $("argumentoTecnicoClave").value = "";
        $("motivoNoConversion").value = "";
      }

      function cancelarEdicion(){
        limpiarFormulario();
      }

      function guardar(){
        if(!$("idEnsayo").value){
          alert("Selecciona un ensayo.");
          return;
        }

        const fechaRegistro = $("fechaRegistro").value || todayISO();
        const ventaCerradaVal = parseNumber($("ventaCerrada").value);
        let fechaVenta = $("fechaVentaCerrada").value;
        const etapa = $("etapa").value;
        const proximaFechaSeguimiento = $("proximaFechaSeguimiento").value;
        const proximoPaso = $("proximoPaso").value.trim();

        if((etapa !== "Venta" && etapa !== "Recompra") && !proximaFechaSeguimiento){
          alert("Captura la próxima fecha de seguimiento para que la oportunidad no se enfríe.");
          return;
        }

        if((etapa !== "Venta" && etapa !== "Recompra") && !proximoPaso){
          alert("Captura el próximo paso comercial.");
          return;
        }

        if(ventaCerradaVal > 0 && !fechaVenta){
          fechaVenta = fechaRegistro;
        }

        const nowIso = new Date().toISOString();

        const data = {
          id: editId || Date.now(),
          ensayo: $("idEnsayo").value,
          fechaRegistro,
          fechaRegistroISO: editId
            ? (oportunidades.find(o => o.id === editId)?.fechaRegistroISO || nowIso)
            : nowIso,
          fechaActualizacionISO: nowIso,
          interesado: $("interesado").value,
          productorNuevo: $("productorNuevo").value.trim(),
          etapa,
          area: parseNumber($("area").value),
          superficiePotencial: parseNumber($("superficiePotencial").value),
          leads: parseNumber($("leads").value),
          ventaEstimada: parseNumber($("ventaEstimada").value),
          ventaCerrada: ventaCerradaVal,
          fechaVentaCerrada: fechaVenta || "",
          proximaFechaSeguimiento: proximaFechaSeguimiento || "",
          recompra: $("recompra").value,
          responsableComercial: $("responsableComercial").value.trim(),
          proximoPaso
        };

        if(editId){
          oportunidades = oportunidades.map(o => o.id === editId ? data : o);
        } else {
          oportunidades.push(data);
        }

        saveData("oportunidades", oportunidades);
        limpiarFormulario();
        render();
      }

      function editar(id){
        const o = oportunidades.find(x => x.id === id);
        if(!o) return;

        editId = id;
        $("modo").innerText = "Editar Oportunidad Comercial";
        $("btnCancelar").style.display = "inline-block";

        $("idEnsayo").value = o.ensayo;
        $("fechaRegistro").value = o.fechaRegistro || todayISO();
        $("interesado").value = o.interesado || "Sí";
        $("productorNuevo").value = o.productorNuevo || "";
        $("etapa").value = o.etapa || "Lead";
        $("area").value = o.area ?? "";
        $("superficiePotencial").value = o.superficiePotencial ?? "";
        $("leads").value = o.leads ?? "";
        $("ventaEstimada").value = o.ventaEstimada ?? "";
        $("ventaCerrada").value = o.ventaCerrada ?? "";
        $("fechaVentaCerrada").value = o.fechaVentaCerrada || "";
        $("proximaFechaSeguimiento").value = o.proximaFechaSeguimiento || "";
        $("recompra").value = o.recompra || "No";
        $("responsableComercial").value = o.responsableComercial || "";
        $("proximoPaso").value = o.siguiente_paso_comercial || o.proximoPaso || "";
        $("zonaOportunidad").value = o.zona_oportunidad || "";
        $("perfilProductorIdeal").value = o.perfil_productor_ideal || "";
        $("argumentoTecnicoClave").value = o.argumento_tecnico_clave || "";
        $("motivoNoConversion").value = o.motivo_no_conversion || "";

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function eliminar(id){
        if(!confirm("¿Eliminar esta oportunidad?")) return;
        oportunidades = oportunidades.filter(o => o.id !== id);
        saveData("oportunidades", oportunidades);
        render();
      }

      function getFilteredList(){
        const filtro = $("filtroEnsayo").value;
        let lista = oportunidades.slice();

        if(filtro){
          lista = lista.filter(o => String(o.ensayo) === String(filtro));
        }

        return lista;
      }

      function renderAlertasPerdidos(){
        ensayos = getData("ensayos");
        oportunidades = getData("oportunidades");

        const perdidos = ensayos.filter(e =>
          e.estado === "Terminado" &&
          !oportunidades.some(o => String(o.ensayo) === String(e.id))
        );

        if(!perdidos.length){
          $("alertasPerdidos").innerHTML = `<p class="empty">No hay ensayos terminados sin oportunidad comercial.</p>`;
          return;
        }

        $("alertasPerdidos").innerHTML = perdidos.map(e => `
          <div class="list-block">

      function calcularDashboard(){
        const lista = getFilteredList();

        const productores = lista.filter(o => o.interesado === "Sí").length;

        const areaTotal = lista.reduce((a,b) => a + Number(b.area || 0), 0);
        const superficiePotencialTotal = lista.reduce((a,b) => a + Number(b.superficiePotencial || 0), 0);
        const estimado = lista.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);
        const ventas = lista.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);

        const conversionValor = estimado > 0 ? (ventas / estimado) * 100 : 0;
        const oportunidadesConVenta = lista.filter(o => Number(o.ventaCerrada || 0) > 0).length;
        const conversionRegistros = lista.length ? (oportunidadesConVenta / lista.length) * 100 : 0;
        const recompraCount = lista.filter(o => o.recompra === "Sí").length;
        const seguimientoVencido = lista.filter(isSeguimientoVencido).length;

        const claseValor = conversionValor >= 25 ? "green" : conversionValor >= 10 ? "yellow" : "red";
        const claseRegistros = conversionRegistros >= 25 ? "green" : conversionRegistros >= 10 ? "yellow" : "red";

          <div class="mini"><span>Conversión valor</span><b>${formatPct(conversionValor)}</b></div>
          <div class="mini"><span>Seguimientos vencidos</span><b>${seguimientoVencido}</b></div>

        return {

  /* ============================================================
     MÓDULO 🧠 TABLERO
     ============================================================ */
  function initTablero() {
    function getData(key){
        try{
          return JSON.parse(localStorage.getItem(key)) || [];
        }catch(e){
          return [];
        }
      }

      const money = n => "$" + new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0));

      const pct = n => new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0)) + "%";

      const num = n => new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0));

      function formatDate(iso){
        if(!iso) return "N/D";
        const d = new Date(iso + "T00:00:00");
        if(isNaN(d)) return iso;
        return d.toLocaleDateString("es-MX");
      }

      function ensayoLabel(e){
        return `${e.id} | ${e.cultivo || ""} | ${e.variedad_tratada || ""} | ${e.productor || ""}`;
      }

      let ensayos = getData("ensayos");
      let resultados = getData("resultados");
      let oportunidades = getData("oportunidades");

      function latestResultadosMap(){
        const mapObj = {};
        resultados.forEach(r => {
          const key = String(r.ensayo_id);
          if(!mapObj[key]){
            mapObj[key] = r;
          }else{
            const a = String(r.fechaActualizacionISO || r.fechaISO || r.id || "");
            const b = String(mapObj[key].fechaActualizacionISO || mapObj[key].fechaISO || mapObj[key].id || "");
            if(a > b){
              mapObj[key] = r;
            }
          }
        });
        return mapObj;
      }

      function opportunitiesByEnsayo(ensayoId){
        return oportunidades.filter(o => String(o.ensayo) === String(ensayoId));
      }

      function closedSalesByEnsayo(ensayoId){
        return oportunidades.filter(o =>
          String(o.ensayo) === String(ensayoId) &&
          Number(o.ventaCerrada || 0) > 0
        );
      }

      function earliestClosedSaleDate(ensayoId){
        const lista = closedSalesByEnsayo(ensayoId)
          .map(o => o.fechaVentaCerrada || o.fechaRegistro || "")
          .filter(Boolean)
          .sort();
        return lista[0] || "";
      }

      function daysBetween(startISO, endISO){
        if(!startISO || !endISO) return null;
        const start = new Date(startISO + "T00:00:00");
        const end = new Date(endISO + "T00:00:00");
        if(isNaN(start) || isNaN(end)) return null;
        const diff = Math.round((end - start) / (1000 * 60 * 60 * 24));
        return diff >= 0 ? diff : null;
      }

      function statusClassByPercent(value, good, warn){
        if(value >= good) return "green";
        if(value >= warn) return "yellow";
        return "red";
      }

      function statusClassByInverse(value, good, warn){
        if(value <= good) return "green";
        if(value <= warn) return "yellow";
        return "red";
      }

      function getCycleOrder(){
        const ciclos = {};

        ensayos.forEach(e => {
          const ciclo = e.ciclo || "Sin ciclo";
          const fecha = e.fecha_siembra || "1900-01-01";
          if(!ciclos[ciclo] || fecha > ciclos[ciclo]){
            ciclos[ciclo] = fecha;
          }
        });

        return Object.entries(ciclos)
          .sort((a,b) => String(b[1]).localeCompare(String(a[1])))
          .map(x => x[0]);
      }

      function buildCycleMetrics(ciclo){
        const resultadosMap = latestResultadosMap();
        const ensayosCiclo = ensayos.filter(e => (e.ciclo || "Sin ciclo") === ciclo);

        const total = ensayosCiclo.length;

        const conVenta = ensayosCiclo.filter(e => {
          return opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0) > 0;
        }).length;

        const conversion = total ? (conVenta / total) * 100 : 0;

        const ventas = ensayosCiclo.reduce((acc,e) => {
          return acc + opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
        }, 0);

        const roiValues = ensayosCiclo
          .map(e => resultadosMap[String(e.id)]?.roi)
          .filter(v => typeof v === "number");

        const roiProm = roiValues.length
          ? roiValues.reduce((a,b) => a + b, 0) / roiValues.length
          : 0;

        return {
          ciclo,
          total,
          conVenta,
          conversion,
          ventas,
          roiProm
        };
      }

      function renderResumenEjecutivo(){
        const resultadosMap = latestResultadosMap();

        const totalEnsayos = ensayos.length;
        const activos = ensayos.filter(e => e.estado === "Activo").length;
        const terminados = ensayos.filter(e => e.estado === "Terminado").length;

        const totalVentas = oportunidades.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
        const totalLeads = oportunidades.reduce((a,b) => a + Number(b.leads || 0), 0);
        const evaluacionesImportadas = resultados.filter(r => r.importado_desde_galera).length;
        const scoreTecValues = resultados.map(r => Number(r.score_tecnico_comercial || 0)).filter(v => v > 0);
        const scoreTecProm = scoreTecValues.length ? scoreTecValues.reduce((a,b)=>a+b,0) / scoreTecValues.length : 0;

        const roiValues = Object.values(resultadosMap)
          .map(r => Number(r.roi || 0));

        const roiProm = roiValues.length
          ? roiValues.reduce((a,b) => a + b, 0) / roiValues.length
          : 0;

        document.getElementById("resumenEjecutivo").innerHTML = `
          <div class="mini">
            <span>Total ensayos</span>
            <b>${totalEnsayos}</b>
          </div>
          <div class="mini">
            <span>Ensayos activos</span>
            <b>${activos}</b>
          </div>
          <div class="mini">
            <span>Ensayos terminados</span>
            <b>${terminados}</b>
          </div>
          <div class="mini">
            <span>Leads acumulados</span>
            <b>${num(totalLeads)}</b>
          </div>
          <div class="mini">
            <span>Ventas cerradas</span>
            <b>${money(totalVentas)}</b>
          </div>
          <div class="mini">
            <span>ROI promedio</span>
            <b>${pct(roiProm * 100)}</b>
          </div>
          <div class="mini">
            <span>Evaluaciones importadas Galera</span>
            <b>${evaluacionesImportadas}</b>
          </div>
          <div class="mini">
            <span>Score técnico Galera</span>
            <b>${scoreTecProm ? num(scoreTecProm) + " / 5" : "N/D"}</b>
          </div>
        `;
      }

      function renderTecnicos(){
        const resultadosMap = latestResultadosMap();

        const total = ensayos.length;
        const planeados = ensayos.filter(e => e.estado === "Planeado").length;
        const activos = ensayos.filter(e => e.estado === "Activo").length;
        const terminados = ensayos.filter(e => e.estado === "Terminado").length;
        const activosPct = total ? (activos / total) * 100 : 0;

        const rendTratadoValues = Object.values(resultadosMap)
          .map(r => Number(r.rendTratado || 0))
          .filter(v => !isNaN(v));

        const mejoraValues = Object.values(resultadosMap)
          .map(r => Number(r.porcentaje || 0))
          .filter(v => !isNaN(v));

        const rendProm = rendTratadoValues.length
          ? rendTratadoValues.reduce((a,b) => a + b, 0) / rendTratadoValues.length
          : 0;

        const mejoraProm = mejoraValues.length
          ? mejoraValues.reduce((a,b) => a + b, 0) / mejoraValues.length
          : 0;

        const activosClass = statusClassByPercent(activosPct, 60, 30);
        const mejoraClass = mejoraProm >= 15 ? "green" : mejoraProm >= 5 ? "yellow" : "red";

        document.getElementById("kpiTecnico").innerHTML = `
          <div class="kpi ${activosClass}">📌 % Ensayos activos: <b>${pct(activosPct)}</b></div>
          <div class="kpi">🗂 Planeados / Activos / Terminados: <b>${planeados} / ${activos} / ${terminados}</b></div>
          <div class="kpi">🌾 Rendimiento promedio tratado: <b>${num(rendProm)} ton/ha</b></div>
          <div class="kpi ${mejoraClass}">📈 Mejora promedio vs control: <b>${pct(mejoraProm)}</b></div>
        `;
      }

      function renderComerciales(){
        const ensayosTot = ensayos.length || 0;

        const ensayosConVenta = ensayos.filter(e => {
          const totalVenta = opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
          return totalVenta > 0;
        }).length;

        const conversion = ensayosTot ? (ensayosConVenta / ensayosTot) * 100 : 0;

        const totalLeads = oportunidades.reduce((a,b) => a + Number(b.leads || 0), 0);
        const leadsPorEnsayo = ensayosTot ? totalLeads / ensayosTot : 0;

        const ventaEstimada = oportunidades.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);
        const ventaCerrada = oportunidades.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
        const conversionValor = ventaEstimada > 0 ? (ventaCerrada / ventaEstimada) * 100 : 0;

        const tiempos = ensayos
          .map(e => {
            const cierre = earliestClosedSaleDate(e.id);
            return daysBetween(e.fecha_siembra, cierre);
          })
          .filter(v => v !== null);

        const tiempoProm = tiempos.length
          ? tiempos.reduce((a,b) => a + b, 0) / tiempos.length
          : 0;

        const convClass = statusClassByPercent(conversion, 25, 10);
        const convValorClass = statusClassByPercent(conversionValor, 25, 10);
        const tiempoClass = tiempos.length ? statusClassByInverse(tiempoProm, 90, 180) : "muted";

        document.getElementById("kpiComercial").innerHTML = `
          <div class="kpi ${convClass}">📈 Tasa de conversión ensayo → venta: <b>${pct(conversion)}</b></div>
          <div class="kpi">📊 Leads por ensayo: <b>${num(leadsPorEnsayo)}</b></div>
          <div class="kpi">🧾 Venta estimada acumulada: <b>${money(ventaEstimada)}</b></div>
          <div class="kpi">💵 Venta cerrada acumulada: <b>${money(ventaCerrada)}</b></div>
          <div class="kpi ${convValorClass}">🔁 Conversión por valor: <b>${pct(conversionValor)}</b></div>
          <div class="kpi ${tiempoClass}">⏱ Tiempo promedio ensayo → cierre: <b>${tiempos.length ? num(tiempoProm) + " días" : "Sin datos suficientes"}</b></div>
        `;
      }

      function renderEstrategicos(){
        const resultadosMap = latestResultadosMap();

        const ensayosSinPipeline = ensayos.filter(e => opportunitiesByEnsayo(e.id).length === 0);

  function initInteligencia() {
    function getData(key){
        try{
          return JSON.parse(localStorage.getItem(key)) || [];
        }catch(e){
          return [];
        }
      }

      const money = n => "$" + new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0));

      const pct = n => new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0)) + "%";

      const num = n => new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0));

      function formatDate(iso){
        if(!iso) return "";
        const d = new Date(iso + "T00:00:00");
        if(isNaN(d)) return iso;
        return d.toLocaleDateString("es-MX");
      }

      function parseSurfaceHa(value){
        if(value === null || value === undefined) return 0;
        const txt = String(value).toLowerCase().replace(/,/g, "");
        const match = txt.match(/(\d+(\.\d+)?)/);
        return match ? parseFloat(match[1]) : 0;
      }

      function ensayoLabel(e){
        return `${e.id} | ${e.cultivo || ""} | ${e.variedad_tratada || ""} | ${e.productor || ""}`;
      }

      let ensayos = getData("ensayos");
      let resultados = getData("resultados");
      let oportunidades = getData("oportunidades");
      let bitacora = getData("bitacora");

      const map = L.map("map").setView([23.6, -102.5], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19
      }).addTo(map);

      let markerLayer = L.layerGroup().addTo(map);

      function hasValidLatLng(lat, lng){
        lat = Number(lat);
        lng = Number(lng);
        return isFinite(lat) && isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
      }

      function latestResultadosMap(){
        const mapObj = {};
        resultados.forEach(r => {
          const key = String(r.ensayo_id);
          if(!mapObj[key]){
            mapObj[key] = r;
          }else{
            const a = String(r.fechaActualizacionISO || r.fechaISO || r.id || "");
            const b = String(mapObj[key].fechaActualizacionISO || mapObj[key].fechaISO || mapObj[key].id || "");
            if(a > b){
              mapObj[key] = r;
            }
          }
        });
        return mapObj;
      }

      function latestBitacoraMap(){
        const mapObj = {};
        bitacora.forEach(b => {
          const key = String(b.ensayo_id);
          if(typeof b.lat !== "number" || typeof b.lng !== "number") return;

          if(!mapObj[key]){
            mapObj[key] = b;
          }else{
            const a = String(b.fechaActualizacionISO || b.fechaISO || b.id || "");
            const c = String(mapObj[key].fechaActualizacionISO || mapObj[key].fechaISO || mapObj[key].id || "");
            if(a > c){
              mapObj[key] = b;
            }
          }
        });
        return mapObj;
      }

      function opportunitiesByEnsayo(ensayoId){
        return oportunidades.filter(o => String(o.ensayo) === String(ensayoId));

      function getCurrentFilters(){
        return {
          region: document.getElementById("filtroRegion").value,

          estado: document.getElementById("filtroEstado").value,
          variedad: document.getElementById("filtroVariedad").value
        };
      }

      function getFilteredEnsayos(){
        const f = getCurrentFilters();

        return ensayos.filter(e => {
          if(f.region && e.region !== f.region) return false;
          if(f.cultivo && e.cultivo !== f.cultivo) return false;
          if(f.estado && e.estado !== f.estado) return false;
          if(f.variedad){
            const hasEnsayoVariety = e.variedad_tratada === f.variedad;
            const hasResultVariety = resultados.some(r => String(r.ensayo_id) === String(e.id) && (r.variedad_evaluada || "") === f.variedad);
            if(!hasEnsayoVariety && !hasResultVariety) return false;
          }
          return true;
        });
      }

      function cargarFiltros(){

      function getROIClass(roi){

      function regionReferenceCoords(region){
        const txt = String(region || "").toLowerCase();

        const catalog = [
          { keys:["santa cruz de juventino rosas","juventino rosas","juventino"], coords:[20.6440,-100.9940] },
          { keys:["corregidora","el pueblito"], coords:[20.5480,-100.4400] },
          { keys:["loreto","zacatecas / loreto"], coords:[22.2700,-101.9880] },
          { keys:["asientos"], coords:[22.2380,-102.0890] },
          { keys:["culiacan","culiacán","sinaloa","noroeste"], coords:[24.8091,-107.3940] },
          { keys:["sonora","hermosillo"], coords:[29.0729,-110.9559] },
          { keys:["baja","tijuana","mexicali"], coords:[32.5149,-117.0382] },
          { keys:["bajio","bajío","guanajuato","queretaro","querétaro","irapuato","celaya"], coords:[20.6767,-101.3563] },
          { keys:["jalisco","occidente","guadalajara"], coords:[20.6597,-103.3496] },
          { keys:["chihuahua","coahuila","durango","norte"], coords:[28.6353,-106.0889] },
          { keys:["nuevo leon","nuevo león","monterrey","tamaulipas"], coords:[25.6866,-100.3161] },
          { keys:["centro","cdmx","ciudad de mexico","ciudad de méxico","estado de mexico","estado de méxico","puebla","hidalgo","morelos","tlaxcala"], coords:[19.4326,-99.1332] },
          { keys:["veracruz","golfo"], coords:[19.1738,-96.1342] },
          { keys:["oaxaca","chiapas","sureste","tabasco"], coords:[17.0732,-96.7266] },
          { keys:["yucatan","yucatán","merida","mérida","campeche","quintana roo"], coords:[20.9674,-89.5926] }
        ];

        for(const item of catalog){
          if(item.keys.some(k => txt.includes(k))) return item.coords;
        }

        return [23.6345, -102.5528];
      }

      function inferredCoords(region, regionalIndex){
        const base = regionReferenceCoords(region);
        const stepLat = 0.18;
        const stepLng = 0.18;
        const x = (regionalIndex % 5) - 2;
        const y = (Math.floor(regionalIndex / 5) % 5) - 2;
        return [
          base[0] + (x * stepLat),
          base[1] + (y * stepLng)
        ];
      }

      function aggregateVarieties(filteredEnsayos){
        const grouped = {};
        const ensayoMap = {};
        filteredEnsayos.forEach(e => ensayoMap[String(e.id)] = e);

        const resultRows = resultados.filter(r => ensayoMap[String(r.ensayo_id)]);
        const conResultado = new Set(resultRows.map(r => String(r.ensayo_id)));
        const rows = resultRows.concat(
          filteredEnsayos.filter(e => !conResultado.has(String(e.id))).map(e => ({
            ensayo_id:e.id,
            variedad_evaluada:e.variedad_tratada,
            roi:0,
            costoTotal:0,
            proyeccionPotencial:0
          }))
        );

        rows.forEach(r => {
          const e = ensayoMap[String(r.ensayo_id)] || {};
          const key = r.variedad_evaluada || e.variedad_tratada || "Sin variedad";
          const ops = opportunitiesByEnsayo(e.id);

          if(!grouped[key]){
            grouped[key] = {
              variedad: key,
              ensayos: 0,
              cultivos: new Set(),
              regiones: new Set(),
              ventas: 0,
              leads: 0,
              estimado: 0,
              superficiePotencial: 0,
              superficieEnsayo: 0,
              costoSum: 0,
              costoCount: 0,
              roiSum: 0,
              roiCount: 0,
              proyeccionSum: 0,
              proyeccionCount: 0,
              adopcionCount: 0,
              scoreTecSum: 0,
              scoreTecCount: 0,
              estatus: new Set()
            };
          }

          const g = grouped[key];
          g.ensayos++;
          g.cultivos.add(e.cultivo || "");
          g.regiones.add(e.region || "");
          if(r.estatus_final_galera) g.estatus.add(r.estatus_final_galera);

          const ventas = ops.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
          const leads = ops.reduce((a,b) => a + Number(b.leads || 0), 0);
          const estimado = ops.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);
          const supPot = ops.reduce((a,b) => a + Number(b.superficiePotencial || b.area || 0), 0);

          g.ventas += ventas;
          g.leads += leads;
          g.estimado += estimado;
          g.superficiePotencial += supPot;
          g.superficieEnsayo += parseSurfaceHa(e.superficie);

          if(ventas > 0) g.adopcionCount++;

          const costo = Number(r.costoTotal || 0);
          const roi = Number(r.roi || 0);
          const proy = Number(r.proyeccionPotencial || r.margenEnsayo || r.margen || 0);

          if(!isNaN(costo) && costo > 0){
            g.costoSum += costo;
            g.costoCount++;
          }
          if(!isNaN(roi)){
            g.roiSum += roi;
            g.roiCount++;
          }
          if(!isNaN(proy) && proy > 0){
            g.proyeccionSum += proy;
            g.proyeccionCount++;
          }
          if(Number(r.score_tecnico_comercial || 0) > 0){
            g.scoreTecSum += Number(r.score_tecnico_comercial || 0);
            g.scoreTecCount++;
          }
        });

        const arr = Object.values(grouped).map(g => {
          const roiProm = g.roiCount ? g.roiSum / g.roiCount : 0;
          const adopcionPct = g.ensayos ? (g.adopcionCount / g.ensayos) * 100 : 0;
          const conversionValor = g.estimado > 0 ? (g.ventas / g.estimado) * 100 : 0;
          const leadsPorEnsayo = g.ensayos ? g.leads / g.ensayos : 0;
          const costoProm = g.costoCount ? g.costoSum / g.costoCount : 0;
          const scoreTecnicoProm = g.scoreTecCount ? g.scoreTecSum / g.scoreTecCount : 0;

          const economicBase = g.proyeccionCount
            ? (g.proyeccionSum / g.proyeccionCount)
            : g.ventas;

          const impactPerHa = (g.superficiePotencial > 0)
            ? (economicBase / g.superficiePotencial)
            : ((g.superficieEnsayo > 0) ? (economicBase / g.superficieEnsayo) : economicBase);

          const reachRaw = leadsPorEnsayo;
          const impactRaw = impactPerHa;
          const confidenceRaw = (Math.max(roiProm, 0) * 100 * 0.7) + ((Math.min(g.ensayos, 4) / 4) * 30) + (scoreTecnicoProm ? scoreTecnicoProm * 5 : 0);
          const effortRaw = costoProm;

          return {
            ...g,
            roiProm,
            adopcionPct,
            conversionValor,
            leadsPorEnsayo,
            costoProm,
            scoreTecnicoProm,
            impactPerHa,
            reachRaw,
            impactRaw,
            confidenceRaw,
            effortRaw,
            estatusTexto: [...g.estatus].filter(Boolean).join(", ") || "N/D"
          };
        });

        function normalize(values, value, invert=false){
          const cleaned = values.filter(v => isFinite(v));
          if(!cleaned.length) return 3;
          const min = Math.min(...cleaned);
          const max = Math.max(...cleaned);
          if(max === min) return 3;
          const ratio = invert ? (max - value) / (max - min) : (value - min) / (max - min);
          return 1 + (4 * ratio);
        }

        const reachValues = arr.map(x => x.reachRaw);
        const impactValues = arr.map(x => x.impactRaw);
        const confidenceValues = arr.map(x => x.confidenceRaw);
        const effortValues = arr.map(x => x.effortRaw);

        arr.forEach(x => {
          x.reachScore = normalize(reachValues, x.reachRaw, false);
          x.impactScore = normalize(impactValues, x.impactRaw, false);
          x.confidenceScore = normalize(confidenceValues, x.confidenceRaw, false);
          x.effortScore = normalize(effortValues, x.effortRaw || 0, true);
          const effort = Math.max(x.effortScore, 0.5);
          x.riceScore = (x.reachScore * x.impactScore * x.confidenceScore) / effort;
        });

        return arr.sort((a,b) => b.riceScore - a.riceScore);
      }

      function renderResumen(){
        const lista = getFilteredEnsayos();
        const resultadosMap = latestResultadosMap();
        const bitacoraMap = latestBitacoraMap();

        const ensayosConResultado = lista.filter(e => resultadosMap[String(e.id)]).length;
        const ensayosConVenta = lista.filter(e => {
          return opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0) > 0;
        }).length;

        const totalVentas = lista.reduce((acc,e) => {
          return acc + opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
        }, 0);

        const totalLeads = lista.reduce((acc,e) => {
          return acc + opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.leads || 0), 0);
        }, 0);

        const roiValues = lista
          .map(e => resultadosMap[String(e.id)]?.roi)
          .filter(v => typeof v === "number");

        const roiProm = roiValues.length
          ? roiValues.reduce((a,b) => a + b, 0) / roiValues.length

        const geoReal = lista.filter(e => bitacoraMap[String(e.id)]).length;

      function renderMap(){
        markerLayer.clearLayers();

        const lista = getFilteredEnsayos();
        const resultadosMap = latestResultadosMap();
        const bitacoraMap = latestBitacoraMap();

        const bounds = [];
        const usageByRegion = {};

        lista.forEach(e => {
          const b = bitacoraMap[String(e.id)];
          const r = resultadosMap[String(e.id)] || {};
          const ops = opportunitiesByEnsayo(e.id);
          const leads = ops.reduce((a,x) => a + Number(x.leads || 0), 0);
          const ventas = ops.reduce((a,x) => a + Number(x.ventaCerrada || 0), 0);
          const roi = Number(r.roi || 0);

          let lat, lng, geoSource, geoDetail;

          if(b && hasValidLatLng(b.lat, b.lng)){
            lat = Number(b.lat);
            lng = Number(b.lng);
            geoSource = b.gps_source || "Geo real de bitácora";
            geoDetail = b.ubicacion || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          } else if(hasValidLatLng(e.lat, e.lng)){
            lat = Number(e.lat);
            lng = Number(e.lng);
            geoSource = e.gps_source || "GPS importado del Excel";
            geoDetail = e.ubicacion || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          } else if(hasValidLatLng(r.lat, r.lng)){
            lat = Number(r.lat);
            lng = Number(r.lng);
            geoSource = r.gps_source || "GPS de resultado importado";
            geoDetail = r.ubicacion || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          } else {
            const regionKey = [e.estado_geografico, e.municipio].filter(Boolean).join(" / ") || e.region || "Sin región";
            usageByRegion[regionKey] = (usageByRegion[regionKey] || 0);
            const coords = inferredCoords(regionKey, usageByRegion[regionKey]);
            usageByRegion[regionKey]++;
            lat = coords[0];
            lng = coords[1];
            geoSource = "Ubicación aproximada por estado/municipio";
            geoDetail = "El Excel no trae coordenada GPS para este registro";
          }

          const variedades = e.variedades_evaluadas || e.variedad_tratada || r.variedad_evaluada || "Sin variedad";
          const gpsText = hasValidLatLng(lat,lng) ? `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}` : "N/D";
          const popup = `
            <div class="popup">
              <b>${variedades}</b><br>
              Ensayo: ${e.id}<br>
              Folio Galera: ${e.folio_externo_galera || r.folio_externo_galera || "N/D"}<br>
              No. Ensayo Galera: ${e.no_ensayo_externo || r.no_ensayo_externo || "N/D"}<br>
              Cultivo: ${e.cultivo || "N/D"}<br>
              Región: ${e.region || "N/D"}<br>
              Estado/Municipio: ${[e.estado_geografico, e.municipio].filter(Boolean).join(" / ") || "N/D"}<br>
              Estado: ${e.estado || "N/D"}<br>
              ROI: ${pct(roi * 100)}<br>
              Score técnico: ${r.score_tecnico_comercial ? num(r.score_tecnico_comercial) + " / 5" : "N/D"}<br>
              Estatus Galera: ${r.estatus_final_galera || "N/D"}<br>
              Leads: ${num(leads)}<br>
              Venta cerrada: ${money(ventas)}<br>
              Productor: ${e.productor || "N/D"}<br>
              GPS: ${gpsText}<br>
              Fuente: ${geoSource}<br>
              Ubicación Excel: ${geoDetail}
            </div>
          `;

          let markerColor = "red";
          if(roi >= 0.3) markerColor = "green";
          else if(roi >= 0) markerColor = "orange";

          const isReal = !geoSource.toLowerCase().includes("aproximada");
          const borderColor = isReal ? "#ffffff" : "#94a3b8";

          const icon = L.divIcon({
            className: "custom-div-icon",
            html: `<div style="background:${markerColor};width:14px;height:14px;border-radius:50%;border:2px solid ${borderColor};opacity:${isReal ? 1 : 0.75};"></div>`,
            iconSize: [14,14],
            iconAnchor: [7,7]
          });

          L.marker([lat, lng], { icon })
            .addTo(markerLayer)
            .bindPopup(popup, {maxWidth:420, autoPan:true});

          bounds.push([lat, lng]);
        });

        if(bounds.length){
          map.fitBounds(bounds, { padding:[30,30] });
        }else{
          map.setView([23.6, -102.5], 5);
        }
      }

        const lista = getFilteredEnsayos();

          document.getElementById("rice").innerHTML = `<p class="empty">No hay información suficiente para calcular prioridad comparable.</p>`;
          return;

            decision = "🚀 ESCALAR";

        }).join("");

        document.getElementById("rice").innerHTML = bloques;

  /* ============================================================
     MÓDULO 🧬 INNOVACIÓN

  function initInnovacion() {
    function getData(key){
        try{
          return JSON.parse(localStorage.getItem(key)) || [];
        }catch(e){
          return [];
        }
      }

      function saveData(key, data){
        localStorage.setItem(key, JSON.stringify(data));
      }

      const money = n => "$" + new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0));

      const pct = n => new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0)) + "%";

      const num = n => new Intl.NumberFormat("es-MX", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }).format(Number(n || 0));

      let ensayos = getData("ensayos");
      let resultados = getData("resultados");
      let oportunidades = getData("oportunidades");

      const DEFAULT_PESOS = {
        rendimiento: 25,
        roi: 20,
        conversion: 15,
        adopcion: 15,
        sanidad: 10,
        traccion: 15
      };

      const PRESETS = {
        balanceado: {
          rendimiento: 25,
          roi: 20,
          conversion: 15,
          adopcion: 15,
          sanidad: 10,
          traccion: 15
        },
        rendimiento: {
          rendimiento: 35,
          roi: 20,
          conversion: 10,
          adopcion: 10,
          sanidad: 15,
          traccion: 10
        },
        comercial: {
          rendimiento: 15,
          roi: 25,
          conversion: 25,
          adopcion: 15,
          sanidad: 5,
          traccion: 15
        },
        sanidad: {
          rendimiento: 20,
          roi: 15,
          conversion: 10,
          adopcion: 10,
          sanidad: 30,
          traccion: 15
        },
        adopcion: {
          rendimiento: 15,
          roi: 15,
          conversion: 15,
          adopcion: 30,
          sanidad: 10,
          traccion: 15
        }
      };

      function latestResultadosMap(){
        const mapObj = {};
        resultados.forEach(r => {
          const key = String(r.ensayo_id);
          if(!mapObj[key]){
            mapObj[key] = r;
          }else{
            const a = String(r.fechaActualizacionISO || r.fechaISO || r.id || "");
            const b = String(mapObj[key].fechaActualizacionISO || mapObj[key].fechaISO || mapObj[key].id || "");
            if(a > b){
              mapObj[key] = r;
            }
          }
        });
        return mapObj;
      }

      function opportunitiesByEnsayo(ensayoId){
        return oportunidades.filter(o => String(o.ensayo) === String(ensayoId));
      }

      function getCurrentFilters(){
        return {
          cultivo: document.getElementById("filtroCultivo").value,
          region: document.getElementById("filtroRegion").value,
          estado: document.getElementById("filtroEstado").value,
          variedad: document.getElementById("filtroVariedad").value
        };
      }

      function getFilteredEnsayos(){
        const f = getCurrentFilters();

        return ensayos.filter(e => {
          if(f.cultivo && e.cultivo !== f.cultivo) return false;
          if(f.region && e.region !== f.region) return false;
          if(f.estado && e.estado !== f.estado) return false;
          if(f.variedad){
            const hasEnsayoVariety = e.variedad_tratada === f.variedad;
            const hasResultVariety = resultados.some(r => String(r.ensayo_id) === String(e.id) && (r.variedad_evaluada || "") === f.variedad);
            if(!hasEnsayoVariety && !hasResultVariety) return false;
          }
          return true;
        });
      }

      function cargarFiltros(){
        const cultivos = [...new Set(ensayos.map(e => e.cultivo).filter(Boolean))].sort();
        const regiones = [...new Set(ensayos.map(e => e.region).filter(Boolean))].sort();
        const estados = [...new Set(ensayos.map(e => e.estado).filter(Boolean))].sort();
        const variedades = [...new Set(
          ensayos.map(e => e.variedad_tratada).concat(resultados.map(r => r.variedad_evaluada)).filter(Boolean)
        )].sort();

        document.getElementById("filtroCultivo").innerHTML =
          `<option value="">Todos</option>` +
          cultivos.map(v => `<option value="${v}">${v}</option>`).join("");

        document.getElementById("filtroRegion").innerHTML =
          `<option value="">Todas</option>` +
          regiones.map(v => `<option value="${v}">${v}</option>`).join("");

        document.getElementById("filtroEstado").innerHTML =
          `<option value="">Todos</option>` +
          estados.map(v => `<option value="${v}">${v}</option>`).join("");

        document.getElementById("filtroVariedad").innerHTML =
          `<option value="">Todas</option>` +
          variedades.map(v => `<option value="${v}">${v}</option>`).join("");
      }

      function limpiarFiltros(){
        document.getElementById("filtroCultivo").value = "";
        document.getElementById("filtroRegion").value = "";
        document.getElementById("filtroEstado").value = "";
        document.getElementById("filtroVariedad").value = "";
        aplicarFiltros();
      }

      function loadPesos(){
        const saved = getData("innovacion_pesos");
        const pesos = {
          ...DEFAULT_PESOS,
          ...saved
        };

        document.getElementById("pesoRendimiento").value = pesos.rendimiento;
        document.getElementById("pesoROI").value = pesos.roi;
        document.getElementById("pesoConversion").value = pesos.conversion;
        document.getElementById("pesoAdopcion").value = pesos.adopcion;
        document.getElementById("pesoSanidad").value = pesos.sanidad;
        document.getElementById("pesoTraccion").value = pesos.traccion;

        updatePesoInfo();
      }

      function getPesos(){
        return {
          rendimiento: Number(document.getElementById("pesoRendimiento").value || 0),
          roi: Number(document.getElementById("pesoROI").value || 0),
          conversion: Number(document.getElementById("pesoConversion").value || 0),
          adopcion: Number(document.getElementById("pesoAdopcion").value || 0),
          sanidad: Number(document.getElementById("pesoSanidad").value || 0),
          traccion: Number(document.getElementById("pesoTraccion").value || 0)
        };
      }

      function getPesosNormalizados(){
        const p = getPesos();
        const total = p.rendimiento + p.roi + p.conversion + p.adopcion + p.sanidad + p.traccion;

        if(total <= 0){
          return {
            rendimiento: 0.25,
            roi: 0.20,
            conversion: 0.15,
            adopcion: 0.15,
            sanidad: 0.10,
            traccion: 0.15
          };
        }

        return {
          rendimiento: p.rendimiento / total,
          roi: p.roi / total,
          conversion: p.conversion / total,
          adopcion: p.adopcion / total,
          sanidad: p.sanidad / total,
          traccion: p.traccion / total
        };
      }

      function updatePesoInfo(){
        const p = getPesos();
        const total = p.rendimiento + p.roi + p.conversion + p.adopcion + p.sanidad + p.traccion;
        document.getElementById("pesoInfo").innerText =
          `Total actual: ${total}%. Si no suma 100, el sistema lo normaliza automáticamente para calcular el score.`;
      }

      function guardarPesos(){
        const p = getPesos();
        saveData("innovacion_pesos", p);
        updatePesoInfo();
        aplicarFiltros();
      }

      function restablecerPesos(){
        saveData("innovacion_pesos", DEFAULT_PESOS);
        loadPesos();
        aplicarFiltros();
      }

      function aplicarPreset(){
        const preset = document.getElementById("presetPesos").value;
        const p = PRESETS[preset] || DEFAULT_PESOS;

        document.getElementById("pesoRendimiento").value = p.rendimiento;
        document.getElementById("pesoROI").value = p.roi;
        document.getElementById("pesoConversion").value = p.conversion;
        document.getElementById("pesoAdopcion").value = p.adopcion;
        document.getElementById("pesoSanidad").value = p.sanidad;
        document.getElementById("pesoTraccion").value = p.traccion;

        updatePesoInfo();
        aplicarFiltros();
      }

      function scoreByThreshold(value, thresholds){
        for(let i = 0; i < thresholds.length; i++){
          if(value >= thresholds[i].min) return thresholds[i].score;
        }
        return 1;
      }

      function inverseScoreByThreshold(value, thresholds){
        for(let i = 0; i < thresholds.length; i++){
          if(value <= thresholds[i].max) return thresholds[i].score;
        }
        return 1;
      }

      function classifyVariety(v){
        if(v.scoreFinal >= 4 && v.roiProm >= 0.3 && v.adopcionPct >= 25){
          return {
            label: "⭐ Escalar",
            className: "green",
            text: "Variedad sólida en benchmark, retorno y adopción. Prioridad alta para expansión."
          };
        }

        if(v.scoreFinal >= 3.2 && v.roiProm >= 0.1){
          return {
            label: "🚀 Promesa",
            className: "yellow",
            text: "Buen potencial técnico-comercial. Conviene reforzar evidencia o ampliar validación."
          };
        }

        if(v.scoreFinal >= 2.4){
          return {
            label: "🧪 Experimental",
            className: "yellow",
            text: "Aún necesita mejor benchmark, tracción o conversión antes de escalar."
          };
        }

        return {
          label: "⛔ Revisar",
          className: "red",
          text: "Desempeño limitado. Conviene replantear la estrategia o reducir prioridad."
          };
      }

      function aggregateVarieties(){
        const lista = getFilteredEnsayos();
        const pesos = getPesosNormalizados();
        const variedades = {};
        const ensayoMap = {};
        lista.forEach(e => ensayoMap[String(e.id)] = e);

        const resultRows = resultados.filter(r => ensayoMap[String(r.ensayo_id)]);
        const conResultado = new Set(resultRows.map(r => String(r.ensayo_id)));
        const rows = resultRows.concat(
          lista.filter(e => !conResultado.has(String(e.id))).map(e => ({
            ensayo_id:e.id,
            variedad_evaluada:e.variedad_tratada,
            roi:0,
            porcentaje:0,
            calidadComercial:"",
            incidenciaPlaga:null
          }))
        );

        rows.forEach(r => {
          const e = ensayoMap[String(r.ensayo_id)] || {};
          const key = r.variedad_evaluada || e.variedad_tratada || "Sin variedad";
          const ops = opportunitiesByEnsayo(e.id);

          if(!variedades[key]){
            variedades[key] = {
              variedad: key,
              ensayos: 0,
              evaluaciones: 0,
              cultivos: new Set(),
              regiones: new Set(),
              competidores: new Set(),
              roiSum: 0,
              roiCount: 0,
              mejoraSum: 0,
              mejoraCount: 0,
              tratadoSum: 0,
              tratadoCount: 0,
              controlSum: 0,
              controlCount: 0,
              plagaSum: 0,
              plagaCount: 0,
              calidadCount: 0,
              leads: 0,
              ventas: 0,
              estimado: 0,
              adopcionCount: 0,
              recompraCount: 0,
              scoreTecSum: 0,
              scoreTecCount: 0,
              sanidadTecSum: 0,
              sanidadTecCount: 0,
              estatus: new Set()
            };
          }

          const v = variedades[key];
          v.evaluaciones++;
          v.ensayos++;
          v.cultivos.add(e.cultivo || "");
          v.regiones.add(e.region || "");
          if(e.variedad_control) v.competidores.add(e.variedad_control);
          if(r.casa_comercial && r.es_control) v.competidores.add(r.casa_comercial);
          if(r.estatus_final_galera) v.estatus.add(r.estatus_final_galera);

          if(typeof r.roi === "number"){
            v.roiSum += Number(r.roi || 0);
            v.roiCount++;
          }
          if(typeof r.porcentaje === "number"){
            v.mejoraSum += Number(r.porcentaje || 0);
            v.mejoraCount++;
          }
          if(typeof r.porcentaje_peso_vs_control === "number" && !r.mejoraCount){
            v.mejoraSum += Number(r.porcentaje_peso_vs_control || 0);
            v.mejoraCount++;
          }
          if(typeof r.rendTratado === "number"){
            v.tratadoSum += Number(r.rendTratado || 0);
            v.tratadoCount++;
          }
          if(typeof r.rendControl === "number"){
            v.controlSum += Number(r.rendControl || 0);
            v.controlCount++;
          }
          if(typeof r.incidenciaPlaga === "number"){
            v.plagaSum += Number(r.incidenciaPlaga || 0);
            v.plagaCount++;
          }
          if(r.calidadComercial && String(r.calidadComercial).trim()){
            v.calidadCount++;
          }
          if(Number(r.score_tecnico_comercial || 0) > 0){
            v.scoreTecSum += Number(r.score_tecnico_comercial || 0);
            v.scoreTecCount++;
          }
          if(Number(r.score_sanidad || 0) > 0){
            v.sanidadTecSum += Number(r.score_sanidad || 0);
            v.sanidadTecCount++;
          }

          const leads = ops.reduce((a,b) => a + Number(b.leads || 0), 0);
          const ventas = ops.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);
          const estimado = ops.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);
          const recompra = ops.some(o => o.recompra === "Sí") ? 1 : 0;

          v.leads += leads;
          v.ventas += ventas;
          v.estimado += estimado;
          v.recompraCount += recompra;
          if(ventas > 0) v.adopcionCount++;
        });

        return Object.values(variedades).map(v => {
          const roiProm = v.roiCount ? v.roiSum / v.roiCount : 0;
          const mejoraProm = v.mejoraCount ? v.mejoraSum / v.mejoraCount : 0;
          const rendTratadoProm = v.tratadoCount ? v.tratadoSum / v.tratadoCount : 0;
          const rendControlProm = v.controlCount ? v.controlSum / v.controlCount : 0;
          const incidenciaProm = v.plagaCount ? v.plagaSum / v.plagaCount : null;
          const adopcionPct = v.evaluaciones ? (v.adopcionCount / v.evaluaciones) * 100 : 0;
          const conversionValor = v.estimado > 0 ? (v.ventas / v.estimado) * 100 : 0;
          const leadsPorEnsayo = v.evaluaciones ? v.leads / v.evaluaciones : 0;
          const scoreTecnicoProm = v.scoreTecCount ? v.scoreTecSum / v.scoreTecCount : 0;
          const sanidadTecnicaProm = v.sanidadTecCount ? v.sanidadTecSum / v.sanidadTecCount : 0;

          const rendimientoScore = scoreByThreshold(mejoraProm, [
            { min: 20, score: 5 },
            { min: 15, score: 4 },
            { min: 8, score: 3 },
            { min: 0.01, score: 2 }
          ]);

          const roiScore = scoreByThreshold(roiProm, [
            { min: 0.60, score: 5 },
            { min: 0.30, score: 4 },
            { min: 0.10, score: 3 },
            { min: 0.00, score: 2 }
          ]);

          const conversionScore = scoreByThreshold(conversionValor, [
            { min: 50, score: 5 },
            { min: 30, score: 4 },
            { min: 15, score: 3 },
            { min: 0.01, score: 2 }
          ]);

          const adopcionScore = scoreByThreshold(adopcionPct, [
            { min: 60, score: 5 },
            { min: 40, score: 4 },
            { min: 25, score: 3 },
            { min: 10, score: 2 }
          ]);

          const sanidadScore = scoreTecnicoProm || sanidadTecnicaProm || (incidenciaProm === null ? 3 : inverseScoreByThreshold(incidenciaProm, [
            { max: 3, score: 5 },
            { max: 6, score: 4 },
            { max: 10, score: 3 },
            { max: 15, score: 2 }
          ]));

          const traccionScore = scoreByThreshold(leadsPorEnsayo, [
            { min: 8, score: 5 },
            { min: 5, score: 4 },
            { min: 3, score: 3 },
            { min: 1, score: 2 }
          ]);

          const scoreFinal =
            (rendimientoScore * pesos.rendimiento) +
            (roiScore * pesos.roi) +
            (conversionScore * pesos.conversion) +
            (adopcionScore * pesos.adopcion) +
            (sanidadScore * pesos.sanidad) +
            (traccionScore * pesos.traccion);

          const status = classifyVariety({
            scoreFinal,
            roiProm,
            adopcionPct
          });

          return {
            ...v,
            roiProm,
            mejoraProm,
            rendTratadoProm,
            rendControlProm,
            incidenciaProm,
            adopcionPct,
            conversionValor,
            leadsPorEnsayo,
            rendimientoScore,
            roiScore,
            conversionScore,
            adopcionScore,
            sanidadScore,
            traccionScore,
            scoreFinal,
            scoreTecnicoProm,
            status,
            competidorTexto: [...v.competidores].filter(Boolean).join(", ") || "N/D",
            estatusTexto: [...v.estatus].filter(Boolean).join(", ") || "N/D"
          };
        }).sort((a,b) => b.scoreFinal - a.scoreFinal);
      }


      function renderResumen(){
        const variedades = aggregateVarieties();

        const estrellas = variedades.filter(v => v.status.label.includes("Escalar")).length;
        const promesas = variedades.filter(v => v.status.label.includes("Promesa")).length;
        const pipelineEstimado = variedades.reduce((a,b) => a + Number(b.estimado || 0), 0);
        const ventas = variedades.reduce((a,b) => a + Number(b.ventas || 0), 0);
        const scoreProm = variedades.length ? variedades.reduce((a,b) => a + Number(b.scoreFinal || 0), 0) / variedades.length : 0;
        const roiProm = variedades.length ? variedades.reduce((a,b) => a + Number(b.roiProm || 0), 0) / variedades.length : 0;
        const benchmarkProm = variedades.length ? variedades.reduce((a,b) => a + Number(b.mejoraProm || 0), 0) / variedades.length : 0;

        document.getElementById("resumenEjecutivo").innerHTML = `
          <div class="mini">
            <span>Variedades evaluadas</span>
            <b>${variedades.length}</b>
          </div>
          <div class="mini">
            <span>Variedades estrella</span>

          </div>

            <span>Variedades promesa</span>
            <b>${promesas}</b>
          </div>

            <span>Pipeline estimado</span>
            <b>${money(pipelineEstimado)}</b>
          </div>
          <div class="mini">
            <span>Ventas derivadas</span>
            <b>${money(ventas)}</b>
          </div>
          <div class="mini">
            <span>Score promedio</span>
            <b>${num(scoreProm)}</b>
          </div>
          <div class="mini">
            <span>ROI promedio portafolio</span>

      }

      function renderTablaPortafolio(){
        const variedades = aggregateVarieties();

        let html = `
          <tr>
            <th>Variedad</th>
            <th>Competidor benchmark</th>
            <th>Cultivos</th>
            <th>Regiones</th>

        `;

        if(!variedades.length){

      function polarPoint(cx, cy, radius, angleDeg){
        const rad = (angleDeg - 90) * Math.PI / 180;
        return {
          x: cx + radius * Math.cos(rad),
          y: cy + radius * Math.sin(rad)
        };
      }

      function renderRadar(){
        const variedades = aggregateVarieties();
        const select = document.getElementById("radarVariedad");

        if(!variedades.length){
          select.innerHTML = `<option value="">Sin variedades</option>`;
          document.getElementById("radarContainer").innerHTML = `<p class="empty">No hay datos para radar.</p>`;
          document.getElementById("radarInsights").innerHTML = "";
          document.getElementById("radarLegend").innerHTML = "";
          document.getElementById("radarTitulo").innerText = "Detalle varietal";
          return;
        }

        const current = select.value;
        select.innerHTML = variedades.map(v => `<option value="${v.variedad}">${v.variedad}</option>`).join("");
        select.value = variedades.some(v => v.variedad === current) ? current : variedades[0].variedad;

        const selected = variedades.find(v => v.variedad === select.value) || variedades[0];
        const pesos = getPesos();

        const labels = [
          { key:"rendimientoScore", text:"Benchmark" },
          { key:"roiScore", text:"ROI" },
          { key:"conversionScore", text:"Conversión" },
          { key:"adopcionScore", text:"Adopción" },
          { key:"sanidadScore", text:"Sanidad" },
          { key:"traccionScore", text:"Tracción" }
        ];

        const cx = 210;
        const cy = 210;
        const maxR = 130;
        const levels = 5;

        let gridPolygons = "";
        for(let level = 1; level <= levels; level++){
          const r = (maxR / levels) * level;
          const pts = labels.map((_, i) => {
            const angle = (360 / labels.length) * i;
            const p = polarPoint(cx, cy, r, angle);
            return `${p.x},${p.y}`;
          }).join(" ");
          gridPolygons += `<polygon points="${pts}" fill="none" stroke="#334155" stroke-width="1"></polygon>`;
        }

        let axes = "";
        let textLabels = "";

        labels.forEach((item, i) => {
          const angle = (360 / labels.length) * i;
          const p = polarPoint(cx, cy, maxR, angle);
          const t = polarPoint(cx, cy, maxR + 26, angle);

          axes += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#475569" stroke-width="1"></line>`;
          textLabels += `<text x="${t.x}" y="${t.y}" fill="#94a3b8" font-size="12" text-anchor="middle">${item.text}</text>`;
        });

        const valuePoints = labels.map((item, i) => {
          const angle = (360 / labels.length) * i;
          const val = selected[item.key] || 1;
          const r = (maxR / levels) * val;
          const p = polarPoint(cx, cy, r, angle);
          return `${p.x},${p.y}`;
        }).join(" ");

        const svg = `
          <svg viewBox="0 0 420 420" class="radar-svg" aria-label="Radar varietal">
            ${gridPolygons}
            ${axes}
            <polygon points="${valuePoints}" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="3"></polygon>
            <circle cx="${cx}" cy="${cy}" r="3" fill="#38bdf8"></circle>
            ${textLabels}
          </svg>
        `;

        document.getElementById("radarContainer").innerHTML = svg;
        document.getElementById("radarTitulo").innerText = `${selected.variedad} — ${selected.status.label}`;

        document.getElementById("radarInsights").innerHTML = `
          <div class="kpi">Score final: <b>${num(selected.scoreFinal)}</b></div>
          <div class="kpi">Competidor benchmark: <b>${selected.competidorTexto}</b></div>
          <div class="kpi">Mejora vs control: <b>${pct(selected.mejoraProm)}</b></div>
          <div class="kpi">ROI promedio: <b>${pct(selected.roiProm * 100)}</b></div>
          <div class="kpi">Score técnico Galera: <b>${selected.scoreTecnicoProm ? num(selected.scoreTecnicoProm) + " / 5" : "N/D"}</b></div>
          <div class="kpi">Estatus Galera: <b>${selected.estatusTexto || "N/D"}</b></div>
          <div class="kpi">Adopción: <b>${pct(selected.adopcionPct)}</b></div>
          <div class="kpi">Ventas derivadas: <b>${money(selected.ventas)}</b></div>
          <div class="kpi ${selected.status.className}"><b>${selected.status.text}</b></div>
        `;

        document.getElementById("radarLegend").innerHTML = `
          <div class="legend-item"><b>Benchmark</b><br>${num(selected.rendimientoScore)} / 5 <br><span class="muted">Peso: ${pesos.rendimiento}%</span></div>
          <div class="legend-item"><b>ROI</b><br>${num(selected.roiScore)} / 5 <br><span class="muted">Peso: ${pesos.roi}%</span></div>
          <div class="legend-item"><b>Conversión</b><br>${num(selected.conversionScore)} / 5 <br><span class="muted">Peso: ${pesos.conversion}%</span></div>
          <div class="legend-item"><b>Adopción</b><br>${num(selected.adopcionScore)} / 5 <br><span class="muted">Peso: ${pesos.adopcion}%</span></div>
          <div class="legend-item"><b>Sanidad</b><br>${num(selected.sanidadScore)} / 5 <br><span class="muted">Peso: ${pesos.sanidad}%</span></div>
          <div class="legend-item"><b>Tracción</b><br>${num(selected.traccionScore)} / 5 <br><span class="muted">Peso: ${pesos.traccion}%</span></div>
        `;
      }

      function renderDecisiones(){
        const variedades = aggregateVarieties();

        if(!variedades.length){
          document.getElementById("panelDecisiones").innerHTML = `<p class="empty">No hay recomendaciones por mostrar.</p>`;
          return;
        }

        const top = variedades.slice(0, 5);
        const bottom = variedades.slice(-3).reverse();

        let html = `<div class="grid">`;

        html += `
          <div class="list-block">
            <h3>Prioridad alta</h3>
            ${top.map(v => `
              <div class="kpi ${v.status.className}">
                <b>${v.variedad}</b> — ${v.status.label}<br>
                Benchmark: ${pct(v.mejoraProm)} | ROI: ${pct(v.roiProm * 100)} | Score: ${num(v.scoreFinal)}
              </div>
            `).join("")}
          </div>
        `;

        html += `
          <div class="list-block">
            <h3>Variedades a revisar</h3>
            ${bottom.map(v => `
              <div class="kpi ${v.status.className}">
                <b>${v.variedad}</b> — ${v.status.label}<br>
                Competidor: ${v.competidorTexto} | Benchmark: ${pct(v.mejoraProm)} | Adopción: ${pct(v.adopcionPct)}
              </div>
            `).join("")}
          </div>
        `;

        html += `</div>`;

        document.getElementById("panelDecisiones").innerHTML = html;
      }

      function aplicarFiltros(){
        updatePesoInfo();
        renderResumen();
        renderTablaPortafolio();
        renderRadar();
        renderDecisiones();
      }

      document.getElementById("radarVariedad").addEventListener("change", renderRadar);
      ["pesoRendimiento","pesoROI","pesoConversion","pesoAdopcion","pesoSanidad","pesoTraccion"].forEach(id => {
        document.getElementById(id).addEventListener("input", () => {
          updatePesoInfo();
          aplicarFiltros();
        });
      });

      cargarFiltros();
      loadPesos();
      aplicarFiltros();

    // API pública del módulo: funciones llamadas desde botones onclick.
    const __api = {};
    try { __api["aggregateVarieties"] = aggregateVarieties; } catch(error) { /* función no disponible */ }
    try { __api["aplicarFiltros"] = aplicarFiltros; } catch(error) { /* función no disponible */ }
    try { __api["aplicarPreset"] = aplicarPreset; } catch(error) { /* función no disponible */ }
    try { __api["cargarFiltros"] = cargarFiltros; } catch(error) { /* función no disponible */ }
    try { __api["classifyVariety"] = classifyVariety; } catch(error) { /* función no disponible */ }
    try { __api["getCurrentFilters"] = getCurrentFilters; } catch(error) { /* función no disponible */ }
    try { __api["getData"] = getData; } catch(error) { /* función no disponible */ }
    try { __api["getFilteredEnsayos"] = getFilteredEnsayos; } catch(error) { /* función no disponible */ }
    try { __api["getPesos"] = getPesos; } catch(error) { /* función no disponible */ }
    try { __api["getPesosNormalizados"] = getPesosNormalizados; } catch(error) { /* función no disponible */ }
    try { __api["guardarPesos"] = guardarPesos; } catch(error) { /* función no disponible */ }
    try { __api["inverseScoreByThreshold"] = inverseScoreByThreshold; } catch(error) { /* función no disponible */ }
    try { __api["latestResultadosMap"] = latestResultadosMap; } catch(error) { /* función no disponible */ }
    try { __api["limpiarFiltros"] = limpiarFiltros; } catch(error) { /* función no disponible */ }
    try { __api["loadPesos"] = loadPesos; } catch(error) { /* función no disponible */ }
    try { __api["opportunitiesByEnsayo"] = opportunitiesByEnsayo; } catch(error) { /* función no disponible */ }
    try { __api["polarPoint"] = polarPoint; } catch(error) { /* función no disponible */ }
    try { __api["renderDecisiones"] = renderDecisiones; } catch(error) { /* función no disponible */ }
    try { __api["renderRadar"] = renderRadar; } catch(error) { /* función no disponible */ }
    try { __api["renderResumen"] = renderResumen; } catch(error) { /* función no disponible */ }
    try { __api["renderTablaPortafolio"] = renderTablaPortafolio; } catch(error) { /* función no disponible */ }
    try { __api["restablecerPesos"] = restablecerPesos; } catch(error) { /* función no disponible */ }
    try { __api["saveData"] = saveData; } catch(error) { /* función no disponible */ }
    try { __api["scoreByThreshold"] = scoreByThreshold; } catch(error) { /* función no disponible */ }
    try { __api["updatePesoInfo"] = updatePesoInfo; } catch(error) { /* función no disponible */ }
    return __api;
  }

      init: initInnovacion
    }
  };

  const SGE = {
    current: {},
    renderNav() {
      const nav = document.getElementById("mainNav");
      nav.innerHTML = MODULE_ORDER
        .map(key => `<button id="nav_${key}" onclick="SGE.show('${key}')">${MODULE_DEFS[key].label}</button>`)
        .join("");
    },

    show(name) {
      const key = MODULE_DEFS[name] ? name : "ensayos";
      const def = MODULE_DEFS[key];
      const app = document.getElementById("app");
      const template = document.getElementById(def.templateId);

      app.className = "module-" + key;
      app.innerHTML = template ? template.innerHTML : "";

      MODULE_ORDER.forEach(item => {
        const button = document.getElementById("nav_" + item);
        if(button) button.classList.toggle("active", item === key);
      });

      this.current = {};

      try {
        this.current = def.init();
        window.location.hash = key;
        setTimeout(() => window.dispatchEvent(new Event("resize")), 100);
      } catch(error) {
        console.error(error);
        app.innerHTML += `
          <div class="card alert-card">
            <h2>Error al cargar módulo</h2>
            <p>${error.message}</p>
          </div>
        `;
      }
    }
  };

  window.SGE = SGE;
  SGE.renderNav();
  SGE.show((location.hash || "#ensayos").replace("#", "") || "ensayos");
  </script>
