<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SGE Galera — Sistema Integral</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
:root{
  --bg:#0f172a; --panel:#111827; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
  --primary:#38bdf8; --danger:#ef4444; --success:#22c55e; --warn:#f59e0b; --yellow:#facc15; --danger-bg:#3b0f14;
}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;margin:0;}
h1{color:var(--primary);margin-top:0} h2,h3{margin-top:0}.container{max-width:1320px;margin:auto}
.app-shell{max-width:1320px;margin:auto}.topbar{position:sticky;top:0;z-index:1000;background:rgba(15,23,42,.96);backdrop-filter:blur(8px);padding:10px 0 16px;border-bottom:1px solid rgba(51,65,85,.7);margin-bottom:20px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.brand-title{font-size:20px;font-weight:800;color:var(--primary)}.brand-sub{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0}.nav button{width:auto;background:#0b1220;color:var(--text);border:1px solid var(--line)}.nav button.active{background:var(--primary);color:#082f49;border-color:var(--primary)}
.card{background:var(--card);padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid var(--line)}.alert-card{background:var(--danger-bg);border:1px solid var(--danger)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select,button,textarea{width:100%;padding:10px;border-radius:8px;border:none}input,select,textarea{margin-top:6px;background:#fff;color:#111827}textarea{font-family:Arial,sans-serif}label{display:block;font-size:14px;color:var(--muted);margin-top:6px;margin-bottom:6px}button{background:var(--primary);cursor:pointer;font-weight:700;color:#082f49}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{width:auto}.secondary{background:#111827;color:#e2e8f0;border:1px solid var(--line)}.danger,.delete{background:var(--danger);color:#fff}.export,.save{background:var(--success);color:#fff}.edit{background:var(--warn);color:#111827}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}.mini{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:14px}.mini span,.mini div{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.mini b{display:block;font-size:22px;color:var(--primary);margin-top:4px}.kpi{font-size:18px;margin:8px 0;line-height:1.45}.green{color:var(--success)}.red{color:var(--danger)}.yellow{color:var(--yellow)}.muted{color:var(--muted)}.danger-text{color:#fecaca}.empty{color:var(--muted);font-style:italic}.nowrap{white-space:nowrap}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border:1px solid var(--line);text-align:center;vertical-align:middle}th{background:#0b1220}.table-wrap{overflow-x:auto}.result-card,.context-box,.list-block,.radar-panel,.weight-box{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#0b1220;border:1px solid var(--line);color:var(--muted);margin-left:6px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.vencido-row{background:rgba(239,68,68,.12)}hr{border:none;border-top:1px solid var(--line);margin:14px 0}
#map{height:430px;border-radius:12px;border:1px solid var(--line);margin-top:12px}.module-bitacora #map{height:320px}img{max-width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line)}.timeline-item{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}.popup{color:#111827;line-height:1.4;min-width:240px}.popup b{color:#0f172a}.radar-wrap{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:20px;align-items:start}.radar-svg{width:100%;max-width:420px;height:auto;display:block;margin:auto}.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}.legend-item{background:#111827;border:1px solid var(--line);border-radius:10px;padding:10px}.weight-note{margin-top:10px;font-size:14px;color:var(--muted)}
@media(max-width:760px){body{padding:12px}.card{padding:14px}.actions button,.nav button{width:100%}.radar-wrap{grid-template-columns:1fr}.topbar{position:static}}
</style>
</head>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <div>
        <div class="brand-title">Sistema Integral de Gestión de Ensayos Galera</div>
        <div class="brand-sub">Un solo index · Registro · Bitácora · Resultados · Pipeline · Tablero · Inteligencia · Innovación</div>
      </div>
      <div class="brand-sub">Datos locales: ensayos, bitácora, resultados, oportunidades y pesos de innovación</div>
    </div>
    <div class="nav" id="mainNav"></div>
  </div>

</div>
<script>
const MODULES = {"ensayos": {"html": "<div class=\"container\">\n<h1>🚀 Registro de Ensayos - Galera</h1>\n\n  <div class=\"card\">\n    <h2 id=\"modo\">Nuevo Ensayo</h2>\n    <div class=\"grid\">\n      <div><label>Técnico responsable</label><input id=\"tecnico\" placeholder=\"Ej. Ing. López\"></div>\n      <div><label>Región</label><input id=\"region\" placeholder=\"Ej. Bajío\"></div>\n      <div><label>Cultivo</label><input id=\"cultivo\" placeholder=\"Ej. Tomate\"></div>\n      <div><label>Objetivo</label><input id=\"objetivo\" placeholder=\"Ej. +12% vs control\"></div>\n\n      <div><label>Ciclo agrícola</label><input id=\"ciclo\" placeholder=\"Ej. Otoño-Invierno\"></div>\n      <div>\n        <label>Tipo de sistema</label>\n        <select id=\"sistema\">\n          <option value=\"Campo abierto\">Campo abierto</option>\n          <option value=\"Invernadero\">Invernadero</option>\n        </select>\n      </div>\n      <div><label>Tipo de suelo</label><input id=\"suelo\" placeholder=\"Ej. Franco arenoso\"></div>\n      <div><label>Sistema de riego</label><input id=\"riego\" placeholder=\"Ej. Goteo\"></div>\n\n      <div><label>Fecha siembra</label><input type=\"date\" id=\"siembra\"></div>\n      <div><label>Fecha estimada cosecha</label><input type=\"date\" id=\"cosecha\"></div>\n      <div><label>Variedad tratada</label><input id=\"variedadTratada\" placeholder=\"Ej. Dumas\"></div>\n      <div><label>Variedad control</label><input id=\"variedadControl\" placeholder=\"Ej. Competidor\"></div>\n\n      <div><label>Proveedor control</label><input id=\"proveedor\" placeholder=\"Ej. Proveedor X\"></div>\n      <div><label>Superficie ensayo</label><input id=\"superficie\" placeholder=\"Ej. 0.5 ha\"></div>\n      <div><label>Productor</label><input id=\"productor\" placeholder=\"Ej. Productor Gómez\"></div>\n\n      <div>\n        <label>Prioridad</label>\n        <select id=\"prioridad\">\n          <option value=\"Alta\">Alta</option>\n          <option value=\"Media\" selected>Media</option>\n          <option value=\"Baja\">Baja</option>\n        </select>\n      </div>\n\n      <div>\n        <label>Vínculo comercial explícito</label>\n        <select id=\"vinculoComercial\">\n          <option value=\"Sí\">Sí</option>\n          <option value=\"No\">No</option>\n        </select>\n      </div>\n\n      <div><label>Cliente / cuenta objetivo</label><input id=\"clienteObjetivo\" placeholder=\"Ej. Productor / distribuidor / cuenta\"></div>\n\n      <div>\n        <label>Estado</label>\n        <select id=\"estado\">\n          <option value=\"Planeado\">Planeado</option>\n          <option value=\"Activo\">Activo</option>\n          <option value=\"Terminado\">Terminado</option>\n        </select>\n      </div>\n    </div>\n\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.guardar()\">Guardar Ensayo</button>\n      <button class=\"edit\" onclick=\"SGE.current.cancelarEdicion()\" id=\"btnCancelar\" style=\"display:none;\">Cancelar edición</button>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h2>Resumen rápido</h2>\n    <div class=\"summary\" id=\"resumen\"></div>\n  </div>\n\n  <div class=\"card alert-card\">\n    <h2>🚨 Ensayos terminados sin oportunidad comercial</h2>\n    <div id=\"alertasPerdidos\"></div>\n  </div>\n\n  <div class=\"card\">\n    <h2>Ensayos Registrados</h2>\n    <div class=\"actions\">\n      <button class=\"export\" onclick=\"SGE.current.exportarExcel()\">📊 Exportar a Excel</button>\n    </div>\n\n    <table>\n      <thead>\n        <tr>\n          <th>Folio</th>\n          <th>Cultivo</th>\n          <th>Variedad</th>\n          <th>Región</th>\n          <th>Prioridad</th>\n          <th>Vínculo comercial</th>\n          <th>Estado</th>\n          <th>Fecha siembra</th>\n          <th>Acciones</th>\n        </tr>\n      </thead>\n      <tbody id=\"tabla\"></tbody>\n    </table>\n  </div>\n</div>", "script": "const $ = id => document.getElementById(id);\n\n  function getData(key){\n    try{ return JSON.parse(localStorage.getItem(key)) || []; }\n    catch(e){ return []; }\n  }\n\n  function saveData(key, data){\n    localStorage.setItem(key, JSON.stringify(data));\n  }\n\n  function formatDate(iso){\n    if(!iso) return \"\";\n    const d = new Date(iso + \"T00:00:00\");\n    if(isNaN(d)) return iso;\n    return d.toLocaleDateString(\"es-MX\");\n  }\n\n  let ensayos = getData(\"ensayos\");\n  let editId = null;\n\n  function generateEnsayoId(){\n    const year = new Date().getFullYear();\n    const regex = new RegExp(`^ENS-${year}-(\\\\d{3})$`);\n    let max = 0;\n\n    ensayos.forEach(e => {\n      const match = String(e.id || \"\").match(regex);\n      if(match){\n        max = Math.max(max, parseInt(match[1], 10));\n      }\n    });\n\n    return `ENS-${year}-${String(max + 1).padStart(3, \"0\")}`;\n  }\n\n  function limpiarFormulario(){\n    editId = null;\n    $(\"modo\").innerText = \"Nuevo Ensayo\";\n    $(\"btnCancelar\").style.display = \"none\";\n\n    [\n      \"tecnico\",\"region\",\"cultivo\",\"objetivo\",\"ciclo\",\"suelo\",\"riego\",\n      \"siembra\",\"cosecha\",\"variedadTratada\",\"variedadControl\",\"proveedor\",\n      \"superficie\",\"productor\",\"clienteObjetivo\"\n    ].forEach(id => $(id).value = \"\");\n\n    $(\"sistema\").value = \"Campo abierto\";\n    $(\"estado\").value = \"Planeado\";\n    $(\"prioridad\").value = \"Media\";\n    $(\"vinculoComercial\").value = \"Sí\";\n  }\n\n  function cancelarEdicion(){\n    limpiarFormulario();\n  }\n\n  function editar(id){\n    const e = ensayos.find(x => String(x.id) === String(id));\n    if(!e) return;\n\n    editId = String(id);\n    $(\"modo\").innerText = \"Editar Ensayo\";\n    $(\"btnCancelar\").style.display = \"inline-block\";\n\n    $(\"tecnico\").value = e.tecnico || \"\";\n    $(\"region\").value = e.region || \"\";\n    $(\"cultivo\").value = e.cultivo || \"\";\n    $(\"objetivo\").value = e.objetivo || \"\";\n    $(\"ciclo\").value = e.ciclo || \"\";\n    $(\"sistema\").value = e.sistema || \"Campo abierto\";\n    $(\"suelo\").value = e.suelo || \"\";\n    $(\"riego\").value = e.riego || \"\";\n    $(\"siembra\").value = e.fecha_siembra || \"\";\n    $(\"cosecha\").value = e.fecha_cosecha || \"\";\n    $(\"variedadTratada\").value = e.variedad_tratada || \"\";\n    $(\"variedadControl\").value = e.variedad_control || \"\";\n    $(\"proveedor\").value = e.proveedor_control || \"\";\n    $(\"superficie\").value = e.superficie || \"\";\n    $(\"productor\").value = e.productor || \"\";\n    $(\"prioridad\").value = e.prioridad || \"Media\";\n    $(\"vinculoComercial\").value = e.vinculo_comercial || \"Sí\";\n    $(\"clienteObjetivo\").value = e.cliente_objetivo || \"\";\n    $(\"estado\").value = e.estado || \"Planeado\";\n\n    window.scrollTo({top:0, behavior:\"smooth\"});\n  }\n\n  function guardar(){\n    const nowIso = new Date().toISOString();\n\n    const fechaSiembra = $(\"siembra\").value;\n    const fechaCosecha = $(\"cosecha\").value;\n\n    if(fechaSiembra && fechaCosecha && fechaCosecha <= fechaSiembra){\n      alert(\"La fecha estimada de cosecha debe ser posterior a la fecha de siembra.\");\n      return;\n    }\n\n    const vinculoComercial = $(\"vinculoComercial\").value;\n    const clienteObjetivo = $(\"clienteObjetivo\").value.trim();\n\n    if(vinculoComercial === \"Sí\" && !clienteObjetivo){\n      alert(\"Si el ensayo tiene vínculo comercial explícito, captura el cliente o cuenta objetivo.\");\n      return;\n    }\n\n    const ensayo = {\n      id: editId || generateEnsayoId(),\n      tecnico: $(\"tecnico\").value.trim(),\n      region: $(\"region\").value.trim(),\n      cultivo: $(\"cultivo\").value.trim(),\n      objetivo: $(\"objetivo\").value.trim(),\n      ciclo: $(\"ciclo\").value.trim(),\n      sistema: $(\"sistema\").value,\n      suelo: $(\"suelo\").value.trim(),\n      riego: $(\"riego\").value.trim(),\n      fecha_siembra: fechaSiembra,\n      fecha_cosecha: fechaCosecha,\n      variedad_tratada: $(\"variedadTratada\").value.trim(),\n      variedad_control: $(\"variedadControl\").value.trim(),\n      proveedor_control: $(\"proveedor\").value.trim(),\n      superficie: $(\"superficie\").value.trim(),\n      productor: $(\"productor\").value.trim(),\n      prioridad: $(\"prioridad\").value,\n      vinculo_comercial: vinculoComercial,\n      cliente_objetivo: clienteObjetivo,\n      estado: $(\"estado\").value,\n      fecha_alta_iso: editId ? (ensayos.find(x => String(x.id) === String(editId))?.fecha_alta_iso || nowIso) : nowIso,\n      fecha_actualizacion_iso: nowIso\n    };\n\n    if(!ensayo.cultivo || !ensayo.variedad_tratada || !ensayo.region){\n      alert(\"Captura al menos cultivo, variedad tratada y región.\");\n      return;\n    }\n\n    if(editId){\n      ensayos = ensayos.map(x => String(x.id) === String(editId) ? ensayo : x);\n    }else{\n      ensayos.push(ensayo);\n    }\n\n    saveData(\"ensayos\", ensayos);\n    limpiarFormulario();\n    render();\n  }\n\n  function eliminar(id){\n    if(!confirm(\"¿Eliminar este ensayo?\")) return;\n    ensayos = ensayos.filter(e => String(e.id) !== String(id));\n    saveData(\"ensayos\", ensayos);\n    render();\n  }\n\n  function renderResumen(){\n    const oportunidades = getData(\"oportunidades\");\n\n    const total = ensayos.length;\n    const planeados = ensayos.filter(e => e.estado === \"Planeado\").length;\n    const activos = ensayos.filter(e => e.estado === \"Activo\").length;\n    const terminados = ensayos.filter(e => e.estado === \"Terminado\").length;\n    const terminadosSinPipeline = ensayos.filter(e =>\n      e.estado === \"Terminado\" &&\n      !oportunidades.some(o => String(o.ensayo) === String(e.id))\n    ).length;\n\n    $(\"resumen\").innerHTML = `\n      <div class=\"mini\">Total ensayos<b>${total}</b></div>\n      <div class=\"mini\">Planeados<b>${planeados}</b></div>\n      <div class=\"mini\">Activos<b>${activos}</b></div>\n      <div class=\"mini\">Terminados<b>${terminados}</b></div>\n      <div class=\"mini\">Terminados sin pipeline<b>${terminadosSinPipeline}</b></div>\n    `;\n  }\n\n  function renderAlertasPerdidos(){\n    const oportunidades = getData(\"oportunidades\");\n\n    const perdidos = ensayos.filter(e =>\n      e.estado === \"Terminado\" &&\n      !oportunidades.some(o => String(o.ensayo) === String(e.id))\n    );\n\n    if(!perdidos.length){\n      $(\"alertasPerdidos\").innerHTML = `<p class=\"empty\">No hay ensayos terminados sin oportunidad comercial registrada.</p>`;\n      return;\n    }\n\n    $(\"alertasPerdidos\").innerHTML = perdidos.map(e => `\n      <div class=\"list-block\">\n        <div><b>${e.id}</b> — ${e.cultivo || \"\"} / ${e.variedad_tratada || \"\"}</div>\n        <div class=\"danger-text\">Región: ${e.region || \"N/D\"} | Técnico: ${e.tecnico || \"N/D\"} | Productor: ${e.productor || \"N/D\"}</div>\n        <div class=\"danger-text\">Prioridad: ${e.prioridad || \"N/D\"} | Cliente objetivo: ${e.cliente_objetivo || \"N/D\"}</div>\n      </div>\n    `).join(\"\");\n  }\n\n  function render(){\n    const tabla = $(\"tabla\");\n    tabla.innerHTML = \"\";\n\n    ensayos\n      .slice()\n      .sort((a,b) => String(b.fecha_alta_iso || \"\").localeCompare(String(a.fecha_alta_iso || \"\")))\n      .forEach(e => {\n        tabla.innerHTML += `\n          <tr>\n            <td>${e.id}</td>\n            <td>${e.cultivo || \"\"}</td>\n            <td>${e.variedad_tratada || \"\"}</td>\n            <td>${e.region || \"\"}</td>\n            <td>${e.prioridad || \"\"}</td>\n            <td>${e.vinculo_comercial || \"\"}</td>\n            <td>${e.estado || \"\"}</td>\n            <td>${formatDate(e.fecha_siembra)}</td>\n            <td>\n              <div class=\"actions\" style=\"justify-content:center;\">\n                <button class=\"edit\" onclick=\"SGE.current.editar('${String(e.id)}')\">Editar</button>\n                <button class=\"danger\" onclick=\"SGE.current.eliminar('${String(e.id)}')\">Eliminar</button>\n              </div>\n            </td>\n          </tr>\n        `;\n      });\n\n    renderResumen();\n    renderAlertasPerdidos();\n  }\n\n  function exportarExcel(){\n    const data = ensayos.map(e => ({\n      \"Folio Ensayo\": e.id,\n      \"Técnico\": e.tecnico,\n      \"Región\": e.region,\n      \"Cultivo\": e.cultivo,\n      \"Objetivo\": e.objetivo,\n      \"Ciclo\": e.ciclo,\n      \"Sistema\": e.sistema,\n      \"Suelo\": e.suelo,\n      \"Riego\": e.riego,\n      \"Fecha Siembra\": e.fecha_siembra,\n      \"Fecha Cosecha\": e.fecha_cosecha,\n      \"Variedad Tratada\": e.variedad_tratada,\n      \"Variedad Control\": e.variedad_control,\n      \"Proveedor Control\": e.proveedor_control,\n      \"Superficie\": e.superficie,\n      \"Productor\": e.productor,\n      \"Prioridad\": e.prioridad,\n      \"Vínculo Comercial\": e.vinculo_comercial,\n      \"Cliente Objetivo\": e.cliente_objetivo,\n      \"Estado\": e.estado,\n      \"Fecha Alta ISO\": e.fecha_alta_iso || \"\",\n      \"Fecha Actualización ISO\": e.fecha_actualizacion_iso || \"\"\n    }));\n\n    const ws = XLSX.utils.json_to_sheet(data);\n    const wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, ws, \"Ensayos\");\n    XLSX.writeFile(wb, \"Ensayos_Galera_Ajustado.xlsx\");\n  }\n\n  render();", "functions": ["cancelarEdicion", "editar", "eliminar", "exportarExcel", "formatDate", "generateEnsayoId", "getData", "guardar", "limpiarFormulario", "render", "renderAlertasPerdidos", "renderResumen", "saveData"]}, "bitacora": {"html": "<div class=\"container\">\n<h1>📸 Bitácora de Ensayos</h1>\n\n  <div class=\"card\">\n    <h2 id=\"modo\">Nuevo Registro</h2>\n    <div class=\"grid\">\n      <div>\n        <label>Ensayo</label>\n        <select id=\"ensayoSelect\"></select>\n      </div>\n      <div>\n        <label>Responsable</label>\n        <input id=\"responsable\" placeholder=\"Ej. Ing. López\">\n      </div>\n      <div>\n        <label>Etapa</label>\n        <select id=\"etapa\">\n          <option value=\"Siembra\">Siembra</option>\n          <option value=\"Desarrollo\">Desarrollo</option>\n          <option value=\"Cosecha\">Cosecha</option>\n        </select>\n      </div>\n      <div>\n        <label>Foto</label>\n        <input type=\"file\" id=\"foto\" accept=\"image/*\">\n      </div>\n    </div>\n\n    <label>Observación</label>\n    <textarea id=\"comentario\" rows=\"4\" placeholder=\"Describe el avance, hallazgos o incidencia observada...\"></textarea>\n\n    <label>Ubicación en mapa</label>\n    <div id=\"map\"></div>\n    <p id=\"coords\" class=\"muted\"></p>\n\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.guardarBitacora()\">Guardar registro</button>\n      <button class=\"edit\" id=\"btnCancelar\" onclick=\"SGE.current.cancelarEdicion()\" style=\"display:none;\">Cancelar edición</button>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h2>Filtrar Timeline</h2>\n    <div class=\"grid\">\n      <div>\n        <label>Ensayo</label>\n        <select id=\"filtroEnsayo\"></select>\n      </div>\n      <div>\n        <label>Etapa</label>\n        <select id=\"filtroEtapa\">\n          <option value=\"\">Todas</option>\n          <option value=\"Siembra\">Siembra</option>\n          <option value=\"Desarrollo\">Desarrollo</option>\n          <option value=\"Cosecha\">Cosecha</option>\n        </select>\n      </div>\n    </div>\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.render()\">Aplicar filtros</button>\n      <button class=\"export\" onclick=\"SGE.current.exportarExcel()\">📊 Exportar Excel</button>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h2>Timeline</h2>\n    <div id=\"timeline\"></div>\n  </div>\n</div>", "script": "const $ = id => document.getElementById(id);\n\n  function getData(key){\n    try{\n      return JSON.parse(localStorage.getItem(key)) || [];\n    }catch(e){\n      return [];\n    }\n  }\n\n  function saveData(key, data){\n    localStorage.setItem(key, JSON.stringify(data));\n  }\n\n  function formatDateTime(iso){\n    if(!iso) return \"\";\n    const d = new Date(iso);\n    if(isNaN(d)) return iso;\n    return d.toLocaleString(\"es-MX\");\n  }\n\n  let ensayos = getData(\"ensayos\");\n  let bitacora = getData(\"bitacora\");\n  let editId = null;\n  let lat = null;\n  let lng = null;\n  let marker = null;\n\n  function ensayoLabel(e){\n    return `${e.id} | ${e.cultivo || \"\"} | ${e.variedad_tratada || \"\"} | ${e.productor || \"\"}`;\n  }\n\n  function cargarEnsayos(){\n    ensayos = getData(\"ensayos\");\n\n    $(\"ensayoSelect\").innerHTML = \"\";\n    $(\"filtroEnsayo\").innerHTML = '<option value=\"\">Todos los ensayos</option>';\n\n    if(!ensayos.length){\n      $(\"ensayoSelect\").innerHTML = '<option value=\"\">No hay ensayos capturados</option>';\n      return;\n    }\n\n    ensayos.forEach(e => {\n      $(\"ensayoSelect\").innerHTML += `<option value=\"${e.id}\">${ensayoLabel(e)}</option>`;\n      $(\"filtroEnsayo\").innerHTML += `<option value=\"${e.id}\">${ensayoLabel(e)}</option>`;\n    });\n  }\n\n  const map = L.map(\"map\").setView([23.6, -102.5], 5);\n\n  L.tileLayer(\"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png\", {\n    maxZoom: 19\n  }).addTo(map);\n\n  map.on(\"click\", function(e){\n    lat = e.latlng.lat;\n    lng = e.latlng.lng;\n\n    if(marker) map.removeLayer(marker);\n    marker = L.marker([lat, lng]).addTo(map);\n\n    $(\"coords\").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;\n  });\n\n  function limpiarMapa(){\n    lat = null;\n    lng = null;\n    $(\"coords\").innerText = \"\";\n    if(marker){\n      map.removeLayer(marker);\n      marker = null;\n    }\n  }\n\n  function limpiarFormulario(){\n    editId = null;\n    $(\"modo\").innerText = \"Nuevo Registro\";\n    $(\"btnCancelar\").style.display = \"none\";\n    $(\"responsable\").value = \"\";\n    $(\"comentario\").value = \"\";\n    $(\"foto\").value = \"\";\n    $(\"etapa\").value = \"Siembra\";\n    limpiarMapa();\n  }\n\n  function cancelarEdicion(){\n    limpiarFormulario();\n  }\n\n  function guardarBitacora(){\n    if(!$(\"ensayoSelect\").value){\n      alert(\"Selecciona un ensayo.\");\n      return;\n    }\n\n    if(!$(\"responsable\").value.trim()){\n      alert(\"Captura el responsable.\");\n      return;\n    }\n\n    const file = $(\"foto\").files[0];\n\n    if(file){\n      const reader = new FileReader();\n      reader.onload = () => guardarRegistro(reader.result);\n      reader.readAsDataURL(file);\n    }else{\n      const existing = editId ? (bitacora.find(b => b.id === editId)?.foto || null) : null;\n      guardarRegistro(existing);\n    }\n  }\n\n  function guardarRegistro(fotoBase64){\n    const nowIso = new Date().toISOString();\n\n    const registro = {\n      id: editId || Date.now(),\n      ensayo_id: $(\"ensayoSelect\").value,\n      responsable: $(\"responsable\").value.trim(),\n      etapa: $(\"etapa\").value,\n      comentario: $(\"comentario\").value.trim(),\n      foto: fotoBase64 || null,\n      lat: lat,\n      lng: lng,\n      fechaISO: editId ? (bitacora.find(b => b.id === editId)?.fechaISO || nowIso) : nowIso,\n      fechaActualizacionISO: nowIso\n    };\n\n    if(editId){\n      bitacora = bitacora.map(b => b.id === editId ? registro : b);\n    }else{\n      bitacora.push(registro);\n    }\n\n    saveData(\"bitacora\", bitacora);\n    limpiarFormulario();\n    render();\n  }\n\n  function editar(id){\n    const b = bitacora.find(x => x.id === id);\n    if(!b) return;\n\n    editId = id;\n    $(\"modo\").innerText = \"Editar Registro\";\n    $(\"btnCancelar\").style.display = \"inline-block\";\n\n    $(\"ensayoSelect\").value = b.ensayo_id;\n    $(\"responsable\").value = b.responsable || \"\";\n    $(\"etapa\").value = b.etapa || \"Siembra\";\n    $(\"comentario\").value = b.comentario || \"\";\n\n    limpiarMapa();\n\n    lat = typeof b.lat === \"number\" ? b.lat : null;\n    lng = typeof b.lng === \"number\" ? b.lng : null;\n\n    if(lat !== null && lng !== null){\n      marker = L.marker([lat, lng]).addTo(map);\n      map.setView([lat, lng], 12);\n      $(\"coords\").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;\n    }\n\n    window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  function eliminar(id){\n    if(!confirm(\"¿Eliminar este registro de bitácora?\")) return;\n    bitacora = bitacora.filter(b => b.id !== id);\n    saveData(\"bitacora\", bitacora);\n    render();\n  }\n\n  function render(){\n    bitacora = getData(\"bitacora\");\n    ensayos = getData(\"ensayos\");\n\n    const ensayoFiltro = $(\"filtroEnsayo\").value;\n    const etapaFiltro = $(\"filtroEtapa\").value;\n\n    let lista = bitacora.slice();\n\n    if(ensayoFiltro){\n      lista = lista.filter(b => String(b.ensayo_id) === String(ensayoFiltro));\n    }\n\n    if(etapaFiltro){\n      lista = lista.filter(b => b.etapa === etapaFiltro);\n    }\n\n    lista.sort((a, b) => String(b.fechaISO || \"\").localeCompare(String(a.fechaISO || \"\")));\n\n    $(\"timeline\").innerHTML = lista.length ? \"\" : `<p class=\"muted\">No hay registros para los filtros seleccionados.</p>`;\n\n    lista.forEach(b => {\n      const e = ensayos.find(x => String(x.id) === String(b.ensayo_id)) || {};\n\n      $(\"timeline\").innerHTML += `\n        <div class=\"timeline-item\">\n          <h3>${ensayoLabel(e)}</h3>\n          <p><b>Responsable:</b> ${b.responsable || \"\"}</p>\n          <p><b>Etapa:</b> ${b.etapa || \"\"}</p>\n          <p><b>Fecha:</b> ${formatDateTime(b.fechaActualizacionISO || b.fechaISO)}</p>\n          <p>${b.comentario || \"\"}</p>\n          ${typeof b.lat === \"number\" && typeof b.lng === \"number\" ? `<p class=\"muted\">Lat: ${b.lat.toFixed(5)} | Lng: ${b.lng.toFixed(5)}</p>` : \"\"}\n          ${b.foto ? `<img src=\"${b.foto}\" alt=\"Foto evidencia\">` : \"\"}\n          <div class=\"actions\">\n            <button class=\"edit\" onclick=\"SGE.current.editar(${b.id})\">Editar</button>\n            <button class=\"delete\" onclick=\"SGE.current.eliminar(${b.id})\">Eliminar</button>\n          </div>\n        </div>\n      `;\n    });\n  }\n\n  function exportarExcel(){\n    const data = bitacora.map(b => {\n      const e = ensayos.find(x => String(x.id) === String(b.ensayo_id)) || {};\n      return {\n        \"ID Ensayo\": b.ensayo_id,\n        \"Cultivo\": e.cultivo || \"\",\n        \"Variedad\": e.variedad_tratada || \"\",\n        \"Productor\": e.productor || \"\",\n        \"Responsable\": b.responsable,\n        \"Etapa\": b.etapa,\n        \"Comentario\": b.comentario,\n        \"Lat\": typeof b.lat === \"number\" ? b.lat : \"\",\n        \"Lng\": typeof b.lng === \"number\" ? b.lng : \"\",\n        \"Fecha ISO\": b.fechaISO || \"\",\n        \"Última actualización ISO\": b.fechaActualizacionISO || \"\"\n      };\n    });\n\n    const ws = XLSX.utils.json_to_sheet(data);\n    const wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, ws, \"Bitacora\");\n    XLSX.writeFile(wb, \"Bitacora_Galera_Ajustada.xlsx\");\n  }\n\n  cargarEnsayos();\n  render();", "functions": ["cancelarEdicion", "cargarEnsayos", "editar", "eliminar", "ensayoLabel", "exportarExcel", "formatDateTime", "getData", "guardarBitacora", "guardarRegistro", "limpiarFormulario", "limpiarMapa", "render", "saveData"]}, "resultados": {"html": "<div class=\"container\">\n<h1>📊 Resultados de Ensayos</h1>\n\n  <div class=\"card\">\n    <h2 id=\"modo\">Nueva Evaluación</h2>\n\n    <div class=\"grid\">\n      <div>\n        <label>Ensayo</label>\n        <select id=\"ensayoSelect\"></select>\n      </div>\n      <div>\n        <label>Fecha de evaluación</label>\n        <input type=\"date\" id=\"fechaEvaluacion\">\n      </div>\n    </div>\n\n    <div id=\"contextoEnsayo\" class=\"context-box\"></div>\n\n    <h3 style=\"margin-top:20px;\">Resultados Técnicos</h3>\n    <div class=\"grid\">\n      <div>\n        <label>Rendimiento Control (ton/ha)</label>\n        <input id=\"rendControl\" placeholder=\"Ej. 5.2\">\n      </div>\n      <div>\n        <label>Rendimiento Tratado (ton/ha)</label>\n        <input id=\"rendTratado\" placeholder=\"Ej. 6.1\">\n      </div>\n      <div>\n        <label>Calidad comercial</label>\n        <input id=\"calidadComercial\" placeholder=\"Ej. Calibre exportable alto\">\n      </div>\n      <div>\n        <label>Incidencia de plaga (%)</label>\n        <input id=\"incidenciaPlaga\" placeholder=\"Ej. 4\">\n      </div>\n    </div>\n\n    <h3 style=\"margin-top:20px;\">Costos del Ensayo</h3>\n    <div class=\"grid\">\n      <div>\n        <label>Semillas $</label>\n        <input id=\"semillas\" placeholder=\"Ej. 3500\">\n      </div>\n      <div>\n        <label>Insumos $</label>\n        <input id=\"insumos\" placeholder=\"Ej. 2200\">\n      </div>\n      <div>\n        <label>Material $</label>\n        <input id=\"material\" placeholder=\"Ej. 800\">\n      </div>\n      <div>\n        <label>Horas técnico</label>\n        <input id=\"horas\" placeholder=\"Ej. 12\">\n      </div>\n      <div>\n        <label>Costo por hora $</label>\n        <input id=\"costoHora\" placeholder=\"Ej. 250\">\n      </div>\n      <div>\n        <label>Traslados $</label>\n        <input id=\"traslados\" placeholder=\"Ej. 900\">\n      </div>\n      <div>\n        <label>Otros $</label>\n        <input id=\"otros\" placeholder=\"Ej. 450\">\n      </div>\n    </div>\n\n    <h3 style=\"margin-top:20px;\">Mercado</h3>\n    <div class=\"grid\">\n      <div>\n        <label>Precio por kg $</label>\n        <input id=\"precio\" placeholder=\"Ej. 16.5\">\n      </div>\n      <div>\n        <label>Costo de producción por kg $</label>\n        <input id=\"costoProduccion\" placeholder=\"Ej. 10.2\">\n      </div>\n    </div>\n\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.calcular()\">Calcular + Evaluar</button>\n      <button class=\"save\" onclick=\"SGE.current.guardar()\">Guardar evaluación</button>\n      <button class=\"edit\" id=\"btnCancelar\" onclick=\"SGE.current.cancelarEdicion()\" style=\"display:none;\">Cancelar edición</button>\n      <button class=\"export\" onclick=\"SGE.current.exportarExcel()\">📊 Exportar Excel</button>\n    </div>\n\n    <div id=\"kpis\" style=\"margin-top:18px;\"></div>\n  </div>\n\n  <div class=\"card\">\n    <h2>Historial de Evaluaciones</h2>\n    <div class=\"muted\">Ahora se guardan múltiples evaluaciones por ensayo, con diferentes fechas.</div>\n    <div id=\"lista\"></div>\n  </div>\n\n</div>", "script": "const $ = id => document.getElementById(id);\n\n  function getData(key){\n    try { return JSON.parse(localStorage.getItem(key)) || []; }\n    catch(e){ return []; }\n  }\n\n  function saveData(key, data){\n    localStorage.setItem(key, JSON.stringify(data));\n  }\n\n  function ensayoLabel(e){\n    return `${e.id} | ${e.cultivo || \"\"} | ${e.variedad_tratada || \"\"} | ${e.productor || \"\"}`;\n  }\n\n  function formatMoney(n){\n    return \"$\" + new Intl.NumberFormat(\"es-MX\", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2\n    }).format(Number(n || 0));\n  }\n\n  function formatPct(n){\n    return new Intl.NumberFormat(\"es-MX\", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2\n    }).format(Number(n || 0)) + \"%\";\n  }\n\n  function formatNum(n){\n    return new Intl.NumberFormat(\"es-MX\", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2\n    }).format(Number(n || 0));\n  }\n\n  function formatDate(iso){\n    if(!iso) return \"\";\n    const d = new Date(iso + \"T00:00:00\");\n    if(isNaN(d)) return iso;\n    return d.toLocaleDateString(\"es-MX\");\n  }\n\n  function parseNumber(value){\n    if(value === null || value === undefined) return 0;\n    const clean = String(value).trim().replace(/,/g, \"\");\n    const num = parseFloat(clean);\n    return isNaN(num) ? 0 : num;\n  }\n\n  function parseSurfaceHa(value){\n    if(value === null || value === undefined) return 0;\n    const text = String(value).trim().toLowerCase().replace(/,/g, \"\");\n    const match = text.match(/(\\d+(\\.\\d+)?)/);\n    return match ? parseFloat(match[1]) : 0;\n  }\n\n  function todayISO(){\n    return new Date().toISOString().slice(0,10);\n  }\n\n  let ensayos = getData(\"ensayos\");\n  let resultados = getData(\"resultados\");\n  let oportunidades = getData(\"oportunidades\");\n  let editId = null;\n  let tmp = null;\n\n  const metasROI = {\n    \"tomate\": 0.25,\n    \"pimiento\": 0.30,\n    \"chile\": 0.30,\n    \"cebolla\": 0.20,\n    \"pepino\": 0.25,\n    \"calabaza\": 0.22,\n    \"sandia\": 0.20,\n    \"melón\": 0.20\n  };\n\n  function getEnsayoById(id){\n    return ensayos.find(e => String(e.id) === String(id)) || null;\n  }\n\n  function getMetaROI(cultivo){\n    const key = String(cultivo || \"\").trim().toLowerCase();\n    return metasROI[key] ?? 0.30;\n  }\n\n  function getPotentialSurface(ensayoId){\n    const lista = oportunidades.filter(o => String(o.ensayo) === String(ensayoId));\n    return lista.reduce((acc, o) => {\n      return acc + Number(o.superficiePotencial || o.area || 0);\n    }, 0);\n  }\n\n  function countEvaluacionesEnsayo(ensayoId){\n    return resultados.filter(r => String(r.ensayo_id) === String(ensayoId)).length;\n  }\n\n  function cargarEnsayos(){\n    ensayos = getData(\"ensayos\");\n    $(\"ensayoSelect\").innerHTML = \"\";\n\n    ensayos.forEach(e => {\n      $(\"ensayoSelect\").innerHTML += `<option value=\"${e.id}\">${ensayoLabel(e)}</option>`;\n    });\n\n    if(ensayos.length){\n      mostrarContextoEnsayo();\n    } else {\n      $(\"contextoEnsayo\").innerHTML = `<p class=\"empty\">No hay ensayos capturados todavía.</p>`;\n    }\n  }\n\n  function mostrarContextoEnsayo(){\n    const ensayo = getEnsayoById($(\"ensayoSelect\").value);\n\n    if(!ensayo){\n      $(\"contextoEnsayo\").innerHTML = `<p class=\"empty\">Selecciona un ensayo.</p>`;\n      return;\n    }\n\n    const superficieEnsayoHa = parseSurfaceHa(ensayo.superficie);\n    const superficiePotencial = getPotentialSurface(ensayo.id);\n    const metaROI = getMetaROI(ensayo.cultivo);\n    const evaluaciones = countEvaluacionesEnsayo(ensayo.id);\n\n    $(\"contextoEnsayo\").innerHTML = `\n      <div class=\"grid\">\n        <div class=\"mini\">\n          <div>Folio</div>\n          <b>${ensayo.id}</b>\n        </div>\n        <div class=\"mini\">\n          <div>Objetivo del ensayo</div>\n          <b style=\"font-size:16px;\">${ensayo.objetivo || \"Sin objetivo\"}</b>\n        </div>\n        <div class=\"mini\">\n          <div>Superficie del ensayo</div>\n          <b>${superficieEnsayoHa > 0 ? formatNum(superficieEnsayoHa) + \" ha\" : \"No definida\"}</b>\n        </div>\n        <div class=\"mini\">\n          <div>Superficie potencial productor</div>\n          <b>${superficiePotencial > 0 ? formatNum(superficiePotencial) + \" ha\" : \"N/D\"}</b>\n        </div>\n        <div class=\"mini\">\n          <div>Meta ROI cultivo</div>\n          <b>${formatPct(metaROI * 100)}</b>\n        </div>\n        <div class=\"mini\">\n          <div>Evaluaciones históricas</div>\n          <b>${evaluaciones}</b>\n        </div>\n      </div>\n    `;\n  }\n\n  function analyzeObjective(objetivo, porcentaje, rendTratado, calidadComercial){\n    if(!objetivo || !String(objetivo).trim()){\n      return {\n        estado: \"Sin objetivo definido\",\n        clase: \"muted\",\n        detalle: \"No existe objetivo capturado en la ficha del ensayo.\"\n      };\n    }\n\n    const txt = String(objetivo).toLowerCase();\n    const pctMatch = String(objetivo).match(/(\\d+(?:[.,]\\d+)?)\\s*%/);\n    const tonMatch = String(objetivo).match(/(\\d+(?:[.,]\\d+)?)\\s*(?:ton\\/ha|t\\/ha)/i);\n\n    if(pctMatch && (txt.includes(\"control\") || txt.includes(\"mejor\") || txt.includes(\"increment\"))){\n      const meta = parseFloat(String(pctMatch[1]).replace(\",\", \".\"));\n      const cumplido = porcentaje >= meta;\n\n      return {\n        estado: cumplido ? \"Cumplido\" : \"No cumplido\",\n        clase: cumplido ? \"green\" : \"red\",\n        detalle: `Objetivo prometido: +${formatNum(meta)}% vs control | Resultado real: ${formatPct(porcentaje)}`\n      };\n    }\n\n    if(tonMatch && txt.includes(\"rend\")){\n      const metaTon = parseFloat(String(tonMatch[1]).replace(\",\", \".\"));\n      const cumplido = rendTratado >= metaTon;\n\n      return {\n        estado: cumplido ? \"Cumplido\" : \"No cumplido\",\n        clase: cumplido ? \"green\" : \"red\",\n        detalle: `Objetivo prometido: ${formatNum(metaTon)} ton/ha | Resultado real: ${formatNum(rendTratado)} ton/ha`\n      };\n    }\n\n    if((txt.includes(\"calidad\") || txt.includes(\"calibre\")) && calidadComercial){\n      return {\n        estado: \"Revisión cualitativa\",\n        clase: \"yellow\",\n        detalle: `Objetivo prometido: ${objetivo} | Resultado capturado: ${calidadComercial}`\n      };\n    }\n\n    return {\n      estado: \"Validación manual\",\n      clase: \"yellow\",\n      detalle: `Objetivo prometido: ${objetivo} | Resultado real: ${formatPct(porcentaje)} de mejora`\n    };\n  }\n\n  function evaluar(roi, diferencia, metaROI){\n    if(diferencia < 0){\n      return {\n        evaluacion: \"No exitoso\",\n        recomendacion: \"Detener inmediatamente\",\n        repetir: \"No\"\n      };\n    }\n\n    if(roi < 0){\n      return {\n        evaluacion: \"No exitoso\",\n        recomendacion: \"No escalar, revisar causa\",\n        repetir: \"No\"\n      };\n    }\n\n    if(roi < metaROI){\n      return {\n        evaluacion: \"Parcial\",\n        recomendacion: \"Ajustar variables\",\n        repetir: \"Sí\"\n      };\n    }\n\n    return {\n      evaluacion: \"Exitoso\",\n      recomendacion: \"Escalar comercialmente\",\n      repetir: \"Sí\"\n    };\n  }\n\n  function calcular(){\n    const ensayo = getEnsayoById($(\"ensayoSelect\").value);\n    if(!ensayo){\n      alert(\"Selecciona un ensayo \n          <p>🔁 Repetir ensayo: <b>${r.repetir || \"\"}</b></p>\n          <p>🏷 Calidad comercial: <b>${r.calidadComercial || \"N/D\"}</b></p>\n          <p>🐛 Incidencia plaga: <b>${formatNum(r.incidenciaPlaga || 0)}%</b></p>\n\n          <div class=\"actions\">\n            <button class=\"edit\" onclick=\"SGE.current.editar(${r.id})\">Editar</button>\n            <button class=\"delete\" onclick=\"SGE.current.eliminar(${r.id})\">Eliminar</button>\n          </div>\n        </div>\n      `;\n    });\n  }\n\n  function exportarExcel(){\n    const data = resultados.map(r => {\n      const e = ensayos.find(x => String(x.id) === String(r.ensayo_id)) || {};\n      return {\n        \"Folio Ensayo\": e.id || \"\",\n        \"Cultivo\": e.cultivo || \"\",\n        \"Variedad Tratada\": e.variedad_tratada || \"\",\n        \"Productor\": e.productor || \"\",\n        \"Región\": e.region || \"\",\n        \"Fecha Evaluación\": r.fechaEvaluacion || \"\",\n        \"Objetivo Ensayo\": r.objetivoEnsayo || \"\",\n        \"Estado Objetivo\": r.objetivoEstado || \"\",\n        \"Detalle Objetivo\": r.objetivoDetalle || \"\",\n        \"Superficie Ensayo (ha)\": r.superficieEnsayoHa || 0,\n        \"Superficie Potencial Productor (ha)\": r.superficiePotencialHa || 0,\n        \"Rendimiento Control (ton/ha)\": r.rendControl || 0,\n        \"Rendimiento Tratado (ton/ha)\": r.rendTratado || 0,\n        \"Diferencia (ton/ha)\": r.diferencia || 0,\n        \"Diferencia (kg/ha)\": r.diferenciaKgHa || 0,\n        \"% Mejora\": r.porcentaje || 0,\n        \"Calidad Comercial\": r.calidadComercial || \"\",\n        \"Incidencia Plaga %\": r.incidenciaPlaga || 0,\n        \"Semillas $\": r.semillas || 0,\n        \"Insumos $\": r.insumos || 0,\n        \"Material $\": r.material || 0,\n        \"Horas Técnico\": r.horas || 0,\n        \"Costo por Hora $\": r.costoHora || 0,\n        \"Costo Horas $\": r.costoHoras || 0,\n        \"Traslados $\": r.traslados || 0,\n        \"Otros $\": r.    <div id=\"alertasSeguimiento\"></div>\n  </div>\n\n  <div class=\"card\">\n    <h2>📊 Dashboard del Pipeline</h2>\n\n    <div class=\"grid\">\n      <div>\n        <label>Filtrar por ensayo</label>\n        <select id=\"filtroEnsayo\"></select>\n      </div>\n    </div>\n\n    <div id=\"dashboard\" style=\"margin-top:10px;\"></div>\n    <div class=\"summary\" id=\"resumenMini\"></div>\n  </div>\n\n  <div class=\"card\">\n    <h2 id=\"modo\">Nueva Oportunidad Comercial</h2>\n\n    <div class=\"grid\">\n      <div>\n        <label>Ensayo</label>\n        <select id=\"idEnsayo\"></select>\n      </div>\n\n      <div>\n        <label>Fecha de registro</label>\n        <input type=\"date\" id=\"fechaRegistro\">\n      </div>\n\n      <div>\n        <label>Productor interesado</label>\n        <select id=\"interesado\">\n          <option value=\"Sí\">Sí</option>\n          <option value=\"No\">No</option>\n        </select>\n      </div>\n\n      <div>\n        <label>Nombre de productor nuevo</label>\n        <input id=\"productorNuevo\" placeholder=\"Ej. Rancho San José / Nuevo lead\">\n      </div>\n\n      <div>\n        <label>Etapa comercial</label>\n        <select id=\"etapa\">\n          <option value=\"Lead\">Lead</option>\n          <option value=\"Contactado\">Contactado</option>\n          <option value=\"Cotización\">Cotización</option>\n          <option value=\"Negociación\">Negociación</option>\n          <option value=\"Venta\">Venta</option>\n          <option value=\"Recompra\">Recompra</option>\n        </select>\n      </div>\n\n      <div>\n        <label>Área potencial (ha)</label>\n        <input id=\"area\" placeholder=\"Ej. 12.5\">\n      </div>\n\n      <div>\n        <label>Superficie potencial del productor (ha)</label>\n        <input id=\"superficiePotencial\" placeholder=\"Ej. 50\">\n      </div>\n\n      <div>\n        <label>Leads generados</label>\n        <input id=\"leads\" placeholder=\"Ej. 8\">\n      </div>\n\n      <div>\n        <label>Venta estimada $</label>\n        <input id=\"ventaEstimada\" placeholder=\"Ej. 250000\">\n      </div>\n\n      <div>\n        <label>Venta cerrada $</label>\n        <input id=\"ventaCerrada\" placeholder=\"Ej. 80000\">\n      </div>\n\n      <div>\n        <label>Fecha venta cerrada</label>\n        <input type=\"date\" id=\"fechaVentaCerrada\">\n      </div>\n\n      <div>\n        <label>Próxima fecha de seguimiento</label>\n        <input type=\"date\" id=\"proximaFechaSeguimiento\">\n      </div>\n\n      <div>\n        <label>¿Recompra?</label>\n        <select id=\"recompra\">\n          <option value=\"No\">No</option>\n          <option value=\"Sí\">Sí</option>\n        </select>\n      </div>\n\n      <div>\n        <label>Responsable comercial</label>\n        <input id=\"responsableComercial\" placeholder=\"Ej. Ing. García\">\n      </div>\n\n      <div>\n        <label>Próximo paso</label>\n        <input id=\"proximoPaso\" placeholder=\"Ej. Visita técnica / Cotización / Llamada\">\n      </div>\n    </div>\n\n    <div class=\"actions\">\n      <button onclick=\"SGE.current.guardar()\">Guardar oportunidad</button>\n      <button class=\"edit\" id=\"btnCancelar\" onclick=\"SGE.current.cancelarEdicion()\" style=\"display:none;\">Cancelar edición</button>\n      <button class=\"export\" onclick=\"SGE.current.exportarExcel()\">📊 Exportar Excel</button>\n    </div>\n  </div>\n\n  <div class=\"card\">\n    <h2>📋 Oportunidades Guardadas</h2>\n    <table id=\"tabla\"></table>\n  </div>\n\n</div>", "script": "const $ = id => document.getElementById(id);\n\n  function getData(key){\n    try { return JSON.parse(localStorage.getItem(key)) || []; }\n    catch(e){ return []; }\n  }\n\n  function saveData(key, data){\n    localStorage.setItem(key, JSON.stringify(data));\n  }\n\n  function ensayoLabel(e){\n    return `${e.id} | ${e.cultivo || \"\"} | ${e.variedad_tratada || \"\"} | ${e.productor || \"\"}`;\n  }\n\n  function formatMoney(n){\n    return \"$\" + new Intl.NumberFormat(\"es-MX\", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2\n    }).format(Number(n || 0));\n  }\n\n  function formatPct(n){\n    return new Intl.NumberFormat(\"es-MX\", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2\n    }).format(Number(n || 0)) + \"%\";\n  }\n\n  function formatNum(n){\n    return new Intl.NumberFormat(\"es-MX\", {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2\n    }).format(Number(n || 0));\n  }\n\n  function formatDate(iso){\n    if(!iso) return \"\";\n    const d = new Date(iso + \"T00:00:00\");\n    if(isNaN(d)) return iso;\n    return d.toLocaleDateString(\"es-MX\");\n  }\n\n  function parseNumber(value){\n    if(value === null || value === undefined) return 0;\n    const clean = String(value).trim().replace(/,/g, \"\");\n    const num = parseFloat(clean);\n    return isNaN(num) ? 0 : num;\n  }\n\n  function todayISO(){\n    return new Date().toISOString().slice(0,10);\n  }\n\n  function isSeguimientoVencido(o){\n    const hoy = todayISO();\n    const etapa = String(o.etapa || \"\");\n    const cerrada = Number(o.ventaCerrada || 0) > 0;\n    if(!o.proximaFechaSeguimiento) return false;\n    if(cerrada || etapa === \"Venta\" || etapa === \"Recompra\") return false;\n    return o.proximaFechaSeguimiento < hoy;\n  }\n\n  let ensayos = getData(\"ensayos\");\n  let oportunidades = getData(\"oportunidades\");\n  let editId = null;\n\n  function cargarEnsayos(){\n    ensayos = getData(\"ensayos\");\n\n    $(\"idEnsayo\").innerHTML = \"\";\n    $(\"filtroEnsayo\").innerHTML = `<option value=\"\">Todos los ensayos</option>`;\n\n    ensayos.forEach(e => {\n      $(\"idEnsayo\").innerHTML += `<option value=\"${e.id}\">${ensayoLabel(e)}</option>`;\n      $(\"filtroEnsayo\").innerHTML += `<option value=\"${e.id}\">${ensayoLabel(e)}</option>`;\n    });\n  }\n\n  function limpiarFormulario(){\n    editId = null;\n    $(\"modo\").innerText = \"Nueva Oportunidad Comercial\";\n    $(\"btnCancelar\").style.display = \"none\";\n\n    $(\"fechaRegistro\").value = todayISO();\n    $(\"interesado\").value = \"Sí\";\n    $(\"productorNuevo\").value = \"\";\n    $(\"etapa\").value = \"Lead\";\n    $(\"area\").value = \"\";\n    $(\"superficiePotencial\").value = \"\";\n    $(\"leads\").value = \"\";\n    $(\"ventaEstimada\").value = \"\";\n    $(\"ventaCerrada\").value = \"\";\n    $(\"fechaVentaCerrada\").value = \"\";\n    $(\"proximaFechaSeguimiento\").value = \"\";\n    $(\"recompra\").value = \"No\";\n    $(\"responsableComercial\").value = \"\";\n    $(\"proximoPaso\").value = \"\";\n  }\n\n  function cancelarEdicion(){\n    limpiarFormulario();\n  }\n\n  function guardar(){\n    if(!$(\"idEnsayo\").value){\n      alert(\"Selecciona un ensayo.\");\n      return;\n    }\n\n    const fechaRegistro = $(\"fechaRegistro\").value || todayISO();\n    const ventaCerradaVal = parseNumber($(\"ventaCerrada\").value);\n    let fechaVenta = $(\"fechaVentaCerrada\").value;\n    const etapa = $(\"etapa\").value;\n    const proximaFechaSeguimiento = $(\"proximaFechaSeguimiento\").value;\n    const proximoPaso = $(\"proximoPaso\").value.trim();\n\n    if((etapa !== \"Venta\" && etapa !== \"Recompra\") && !proximaFechaSeguimiento){\n      alert(\"Captura la próxima fecha de seguimiento para que la oportunidad no se enfríe.\");\n      return;\n    }\n\n    if((etapa !== \"Venta\" && etapa !== \"Recompra\") && !proximoPaso){\n      alert(\"Captura el próximo paso comercial.\");\n      return;\n    }\n\n    if(ventaCerradaVal > 0 && !fechaVenta){\n      fechaVenta = fechaRegistro;\n    }\n\n    const nowIso = new Date().toISOString();\n\n    const data = {\n      id: editId || Date.now(),\n      ensayo: $(\"idEnsayo\").value,\n      fechaRegistro,\n      fechaRegistroISO: editId\n        ? (oportunidades.find(o => o.id === editId)?.fechaRegistroISO || nowIso)\n        : nowIso,\n      fechaActualizacionISO: nowIso,\n      interesado: $(\"interesado\").value,\n      productorNuevo: $(\"productorNuevo\").value.trim(),\n      etapa,\n      area: parseNumber($(\"area\").value),\n      superficiePotencial: parseNumber($(\"superficiePotencial\").value),\n      leads: parseNumber($(\"leads\").value),\n      ventaEstimada: parseNumber($(\"ventaEstimada\").value),\n      ventaCerrada: ventaCerradaVal,\n      fechaVentaCerrada: fechaVenta || \"\",\n      proximaFechaSeguimiento: proximaFechaSeguimiento || \"\",\n      recompra: $(\"recompra\").value,\n      responsableComercial: $(\"responsableComercial\").value.trim(),\n      proximoPaso\n    };\n\n    if(editId){\n      oportunidades = oportunidades.map(o => o.id === editId ? data : o);\n    } else {\n      oportunidades.push(data);\n    }\n\n    saveData(\"oportunidades\", oportunidades);\n    limpiarFormulario();\n    render();\n  }\n\n  function editar(id){\n    const o = oportunidades.find(x => x.id === id);\n    if(!o) return;\n\n    editId = id;\n    $(\"modo\").innerText = \"Editar Oportunidad Comercial\";\n    $(\"btnCancelar\").style.display = \"inline-block\";\n\n    $(\"idEnsayo\").value = o.ensayo;\n    $(\"fechaRegistro\").value = o.fechaRegistro || todayISO();\n    $(\"interesado\").value = o.interesado || \"Sí\";\n    $(\"productorNuevo\").value = o.productorNuevo || \"\";\n    $(\"etapa\").value = o.etapa || \"Lead\";\n    $(\"area\").value = o.area ?? \"\";\n    $(\"superficiePotencial\").value = o.superficiePotencial ?? \"\";\n    $(\"leads\").value = o.leads ?? \"\";\n    $(\"ventaEstimada\").value = o.ventaEstimada ?? \"\";\n    $(\"ventaCerrada\").value = o.ventaCerrada ?? \"\";\n    $(\"fechaVentaCerrada\").value = o.fechaVentaCerrada || \"\";\n    $(\"proximaFechaSeguimiento\").value = o.proximaFechaSeguimiento || \"\";\n    $(\"recompra\").value = o.recompra || \"No\";\n    $(\"responsableComercial\").value = o.responsableComercial || \"\";\n    $(\"proximoPaso\").value = o.proximoPaso || \"\";\n\n    window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  function eliminar(id){\n    if(!confirm(\"¿Eliminar esta oportunidad?\")) return;\n    oportunidades = oportunidades.filter(o => o.id !== id);\n    saveData(\"oportunidades\", oportunidades);\n    render();\n  }\n\n  function getFilteredList(){\n    const filtro = $(\"filtroEnsayo\").value;\n    let lista = oportunidades.slice();\n\n    if(filtro){\n      lista = lista.filter(o => String(o.ensayo) === String(filtro));\n    }\n\n    return lista;\n  }\n\n  function renderAlertasPerdidos(){\n    ensayos = getData(\"ensayos\");\n    oportunidades = getData(\"oportunidades\");\n\n    const perdidos = ensayos.filter(e =>\n      e.estado === \"Terminado\" &&\n      !oportunidades.some(o => String(o.ensayo) === String(e.id))\n    );\n\n    if(!perdidos.length){\n      $(\"alertasPerdidos\").innerHTML = `<p class=\"empty\">No hay ensayos terminados sin oportunidad comercial.</p>`;\n      return;\n    }\n\n    $(\"alertasPerdidos\").innerHTML = perdidos.map(e => `\n      <div class=\"list-block\">\n        <div><b>${e.id}</b> — ${e.cultivo || \"\"} / ${e.variedad_tratada || \"\"}</div>\n        <div class=\"danger-text\">Región: ${e.region || \"N/D\"} | Técnico: ${e.tecnico || \"N/D\"} | Productor original: ${e.productor || \"N/D\"}</div>\n        <div class=\"danger-text\">Cliente objetivo: ${e.cliente_objetivo || \"N/D\"} | Prioridad: ${e.prioridad || \"N/D\"}</div>\n      </div>\n    `).join(\"\");\n  }\n\n  function renderAlertasSeguimiento(){\n    const vencidas = oportunidades.filter(isSeguimientoVencido);\n\n    if(!vencidas.length){\n      $(\"alertasSeguimiento\").innerHTML = `<p class=\"empty\">No hay seguimientos vencidos.</p>`;\n      return;\n    }\n\n    $(\"alertasSeguimiento\").innerHTML = vencidas.map(o => {\n      const e = ensayos.find(x => String(x.id) === String(o.ensayo)) || {};\n      return `\n        <div class=\"list-block\">\n          <div><b>${ensayoLabel(e)}</b></div>\n          <div class=\"danger-text\">Productor nuevo: ${o.productorNuevo || \"N/D\"} | Etapa: ${o.etapa || \"N/D\"} | Responsable: ${o.responsableComercial || \"N/D\"}</div>\n          <div class=\"danger-text\">Seguimiento vencido desde: ${formatDate(o.proximaFechaSeguimiento)} | Próximo paso: ${o.proximoPaso || \"N/D\"}</div>\n        </div>\n      `;\n    }).join(\"\");\n  }\n\n  function calcularDashboard(){\n    const lista = getFilteredList();\n\n    const productores = lista.filter(o => o.interesado === \"Sí\").length;\n    const leadsTotal = lista.reduce((a,b) => a + Number(b.leads || 0), 0);\n    const areaTotal = lista.reduce((a,b) => a + Number(b.area || 0), 0);\n    const superficiePotencialTotal = lista.reduce((a,b) => a + Number(b.superficiePotencial || 0), 0);\n    const estimado = lista.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);\n    const ventas = lista.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n\n    const conversionValor = estimado > 0 ? (ventas / estimado) * 100 : 0;\n    const oportunidadesConVenta = lista.filter(o => Number(o.ventaCerrada || 0) > 0).length;\n    const conversionRegistros = lista.length ? (oportunidadesConVenta / lista.length) * 100 : 0;\n    const recompraCount = lista.filter(o => o.recompra === \"Sí\").length;\n    const seguimientoVencido = lista.filter(isSeguimientoVencido).length;\n\n    const claseValor = conversionValor >= 25 ? \"green\" : conversionValor >= 10 ? \"yellow\" : \"red\";\n    const claseRegistros = conversionRegistros >= 25 ? \"green\" : conversionRegistros >= 10 ? \"yellow\" : \"red\";\n    const claseSeguimiento = seguimientoVencido === 0 ? \"green\" : seguimientoVencido <= 2 ? \"yellow\" : \"red\";\n\n    $(\"dashboard\").innerHTML = `\n      <div class=\"kpi\">👨‍🌾 Productores interesados: <b>${productores}</b></div>\n      <div class=\"kpi\">📊 Leads generados: <b>${formatNum(leadsTotal)}</b></div>\n      <div class=\"kpi\">🌱 Área potencial: <b>${formatNum(areaTotal)} ha</b></div>\n      <div class=\"kpi\">📏 Superficie potencial productor: <b>${formatNum(superficiePotencialTotal)} ha</b></div>\n      <div class=\"kpi\">💰 Venta estimada: <b>${formatMoney(estimado)}</b></div>\n      <div class=\"kpi\">💵 Venta cerrada: <b>${formatMoney(ventas)}</b></div>\n      <div class=\"kpi ${claseValor}\">📈 Conversión por valor: <b>${formatPct(conversionValor)}</b></div>\n      <div class=\"kpi ${claseRegistros}\">🧩 Conversión de registros con venta: <b>${formatPct(conversionRegistros)}</b></div>\n      <div class=\"kpi\">🔁 Registros con recompra: <b>${recompraCount}</b></div>\n      <div class=\"kpi ${claseSeguimiento}\">⏰ Seguimientos vencidos: <b>${seguimientoVencido}</b></div>\n    `;\n\n    $(\"resumenMini\").innerHTML = `\n      <div class=\"mini\"><span>Productores interesados</span><b>${productores}</b></div>\n      <div class=\"mini\"><span>Leads</span><b>${formatNum(leadsTotal)}</b></div>\n      <div class=\"mini\"><span>Área potencial (ha)</span><b>${formatNum(areaTotal)}</b></div>\n      <div class=\"mini\"><span>Superficie potencial (ha)</span><b>${formatNum(superficiePotencialTotal)}</b></div>\n      <div class=\"mini\"><span>Venta estimada</span><b>${formatMoney(estimado)}</b></div>\n      <div class=\"mini\"><span>Venta cerrada</span><b>${formatMoney(ventas)}</b></div>\n      <div class=\"mini\"><span>Conversión valor</span><b>${formatPct(conversionValor)}</b></div>\n      <div class=\"mini\"><span>Seguimientos vencidos</span><b>${seguimientoVencido}</b></div>\n    `;\n\n    return {\n      productores,\n      leadsTotal,\n      areaTotal,\n      superficiePotencialTotal,\n      estimado,\n      ventas,\n      conversionValor,\n      conversionRegistros,\n      recompraCount,\n      seguimientoVencido\n    };\n  }\n\n  function render(){\n    ensayos = getData(\"ensayos\");\n    oportunidades = getData(\"oportunidades\");\n\n    const tabla = $(\"tabla\");\n    const lista = getFilteredList()\n      .sort((a,b) => String(b.fechaActualizacionISO || b.fechaRegistroISO || \"\").localeCompare(String(a.fechaActualizacionISO || a.fechaRegistroISO || \"\")));\n\n    tabla.innerHTML = `\n      <tr>\n        <th>Ensayo</th>\n        <th>Fecha</th>\n        <th>Interesado</th>\n        <th>Productor nuevo</th>\n        <th>Etapa</th>\n        <th>Área (ha)</th>\n        <th>Sup. Potencial (ha)</th>\n        <th>Leads</th>\n        <th>Venta Estimada</th>\n        <th>Venta Cerrada</th>\n        <th>Fecha Cierre</th>\n        <th>Seguimiento</th>\n        <th>Responsable</th>\n        <th>Acciones</th>\n      </tr>\n    `;\n\n    if(!lista.length){\n      tabla.innerHTML += `\n        <tr>\n          <td colspan=\"14\" class=\"muted\">No hay oportunidades registradas para el filtro seleccionado.</td>\n        </tr>\n      `;\n    }\n\n    lista.forEach(o => {\n      const e = ensayos.find(x => String(x.id) === String(o.ensayo)) || {};\n      const vencido = isSeguimientoVencido(o);\n\n      tabla.innerHTML += `\n        <tr class=\"${vencido ? 'vencido-row' : ''}\">\n          <td>${ensayoLabel(e)}</td>\n          <td class=\"nowrap\">${formatDate(o.fechaRegistro)}</td>\n          <td>${o.interesado || \"\"}</td>\n          <td>${o.productorNuevo || \"\"}</td>\n          <td>${o.etapa || \"\"}</td>\n          <td>${formatNum(o.area)}</td>\n          <td>${formatNum(o.superficiePotencial)}</td>\n          <td>${formatNum(o.leads)}</td>\n          <td>${formatMoney(o.ventaEstimada)}</td>\n          <td>${formatMoney(o.ventaCerrada)}</td>\n          <td class=\"nowrap\">${formatDate(o.fechaVentaCerrada)}</td>\n          <td class=\"nowrap ${vencido ? 'red' : ''}\">\n            <b>${o.proximaFechaSeguimiento ? formatDate(o.proximaFechaSeguimiento) : \"N/D\"}</b>\n          </td>\n          <td>${o.responsableComercial || \"\"}</td>\n          <td>\n            <div class=\"actions\" style=\"justify-content:center;\">\n              <button class=\"edit\" onclick=\"SGE.current.editar(${o.id})\">Editar</button>\n              <button class=\"delete\" onclick=\"SGE.current.eliminar(${o.id})\">Eliminar</button>\n            </div>\n          </td>\n        </tr>\n      `;\n    });\n\n    calcularDashboard();\n    renderAlertasPerdidos();\n    renderAlertasSeguimiento();\n  }\n\n  function exportarExcel(){\n    const resumen = calcularDashboard();\n\n    const data = oportunidades.map(o => {\n      const e = ensayos.find(x => String(x.id) === String(o.ensayo)) || {};\n      return {\n        \"Folio Ensayo\": e.id || \"\",\n        \"Cultivo\": e.cultivo || \"\",\n        \"Variedad Tratada\": e.variedad_tratada || \"\",\n        \"Productor Original\": e.productor || \"\",\n        \"Productor Nuevo\": o.productorNuevo || \"\",\n        \"Región\": e.region || \"\",\n        \"Fecha Registro\": o.fechaRegistro || \"\",\n        \"Interesado\": o.interesado || \"\",\n        \"Etapa\": o.etapa || \"\",\n        \"Área Potencial (ha)\": o.area || 0,\n        \"Superficie Potencial Productor (ha)\": o.superficiePotencial || 0,\n        \"Leads Generados\": o.leads || 0,\n        \"Venta Estimada $\": o.ventaEstimada || 0,\n        \"Venta Cerrada $\": o.ventaCerrada || 0,\n        \"Fecha Venta Cerrada\": o.fechaVentaCerrada || \"\",\n        \"Próxima Fecha Seguimiento\": o.proximaFechaSeguimiento || \"\",\n        \"Recompra\": o.recompra || \"No\",\n        \"Responsable Comercial\": o.responsableComercial || \"\",\n        \"Próximo Paso\": o.proximoPaso || \"\",\n        \"Seguimiento Vencido\": isSeguimientoVencido(o) ? \"Sí\" : \"No\",\n        \"Fecha Registro ISO\": o.fechaRegistroISO || \"\",\n        \"Fecha Actualización ISO\": o.fechaActualizacionISO || \"\"\n      };\n    });\n\n    const resumenSheet = [\n      [\"Productores interesados\", resumen.productores],\n      [\"Leads generados\", resumen.leadsTotal],\n      [\"Área potencial (ha)\", resumen.areaTotal],\n      [\"Superficie potencial productor (ha)\", resumen.superficiePotencialTotal],\n      [\"Venta estimada\", resumen.estimado],\n      [\"Venta cerrada\", resumen.ventas],\n      [\"Conversión por valor (%)\", resumen.conversionValor],\n      [\"Conversión de registros con venta (%)\", resumen.conversionRegistros],\n      [\"Registros con recompra\", resumen.recompraCount],\n      [\"Seguimientos vencidos\", resumen.seguimientoVencido]\n    ];\n\n    const ws1 = XLSX.utils.json_to_sheet(data);\n    const ws2 = XLSX.utils.aoa_to_sheet(resumenSheet);\n\n    const wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, ws1, \"Detalle\");\n    XLSX.utils.book_append_sheet(wb, ws2, \"Resumen\");\n\n    XLSX.writeFile(wb, \"Pipeline_Comercial_Galera_Ajustado.xlsx\");\n  }\n\n  $(\"filtroEnsayo\").addEventListener(\"change\", render);\n\n  cargarEnsayos();\n  $(\"fechaRegistro\").value = todayISO();\n  render();", "functions": ["calcularDashboard", "cancelarEdicion", "cargarEnsayos", "editar", "eliminar", "ensayoLabel", "exportarExcel", "formatDate", "formatMoney", "formatNum", "formatPct", "getData", "getFilteredList", "guardar", "isSeguimientoVencido", "limpiarFormulario", "parseNumber", "render", "renderAlertasPerdidos", "renderAlertasSeguimiento", "saveData", "todayISO"]}, "tablero": {"html": "<div class=\"container\">\n<h1>🧠 Tablero Operativo</h1>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>Resumen Ejecutivo</h2>\n      <span class=\"badge\">Consolidado general</span>\n    </div>\n    <div class=\"grid\" id=\"resumenEjecutivo\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>🔬 KPIs Técnicos</h2>\n      <span class=\"badge\">Base: ensayos + resultados</span>\n    </div>\n    <div id=\"kpiTecnico\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>💰 KPIs Comerciales</h2>\n      <span class=\"badge\">Base: pipeline + cierres</span>\n    </div>\n    <div id=\"kpiComercial\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>🚀 KPIs Estratégicos</h2>\n      <span class=\"badge\">Dirección y comparación de ciclos</span>\n    </div>\n    <div id=\"kpiEstrategico\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>👨‍🔬 ROI Promedio por Técnico</h2>\n      <span class=\"badge\">Último resultado por ensayo</span>\n    </div>\n    <div id=\"roiTecnico\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>📦 Ensayos sin Pipeline</h2>\n      <span class=\"badge\">Sin oportunidades registradas</span>\n    </div>\n    <div id=\"sinPipeline\"></div>\n  </div>\n\n  <div class=\"card\">\n    <div class=\"section-title\">\n      <h2>🔄 Comparativo Ciclo Actual vs Anterior</h2>\n      <span class=\"badge\">Calculado desde fecha de siembra</span>\n    </div>\n    <div id=\"comparativoCiclos\"></div>\n  </div>\n</div>", "script": "function getData(key){\n    try{\n      return JSON.parse(localStorage.getItem(key)) || [];\n    }catch(e){\n      return [];\n    }\n  }\n\n  const money = n => \"$\" + new Intl.NumberFormat(\"es-MX\", {\n    minimumFractionDigits:2,\n    maximumFractionDigits:2\n  }).format(Number(n || 0));\n\n  const pct = n => new Intl.NumberFormat(\"es-MX\", {\n    minimumFractionDigits:2,\n    maximumFractionDigits:2\n  }).format(Number(n || 0)) + \"%\";\n\n  const num = n => new Intl.NumberFormat(\"es-MX\", {\n    minimumFractionDigits:2,\n    maximumFractionDigits:2\n  }).format(Number(n || 0));\n\n  function formatDate(iso){\n    if(!iso) return \"N/D\";\n    const d = new Date(iso + \"T00:00:00\");\n    if(isNaN(d)) return iso;\n    return d.toLocaleDateString(\"es-MX\");\n  }\n\n  function ensayoLabel(e){\n    return `${e.id} | ${e.cultivo || \"\"} | ${e.variedad_tratada || \"\"} | ${e.productor || \"\"}`;\n  }\n\n  let ensayos = getData(\"ensayos\");\n  let resultados = getData(\"resultados\");\n  let oportunidades = getData(\"oportunidades\");\n\n  function latestResultadosMap(){\n    const mapObj = {};\n    resultados.forEach(r => {\n      const key = String(r.ensayo_id);\n      if(!mapObj[key]){\n        mapObj[key] = r;\n      }else{\n        const a = String(r.fechaActualizacionISO || r.fechaISO || r.id || \"\");\n        const b = String(mapObj[key].fechaActualizacionISO || mapObj[key].fechaISO || mapObj[key].id || \"\");\n        if(a > b){\n          mapObj[key] = r;\n        }\n      }\n    });\n    return mapObj;\n  }\n\n  function opportunitiesByEnsayo(ensayoId){\n    return oportunidades.filter(o => String(o.ensayo) === String(ensayoId));\n  }\n\n  function closedSalesByEnsayo(ensayoId){\n    return oportunidades.filter(o =>\n      String(o.ensayo) === String(ensayoId) &&\n      Number(o.ventaCerrada || 0) > 0\n    );\n  }\n\n  function earliestClosedSaleDate(ensayoId){\n    const lista = closedSalesByEnsayo(ensayoId)\n      .map(o => o.fechaVentaCerrada || o.fechaRegistro || \"\")\n      .filter(Boolean)\n      .sort();\n    return lista[0] || \"\";\n  }\n\n  function daysBetween(startISO, endISO){\n    if(!startISO || !endISO) return null;\n    const start = new Date(startISO + \"T00:00:00\");\n    const end = new Date(endISO + \"T00:00:00\");\n    if(isNaN(start) || isNaN(end)) return null;\n    const diff = Math.round((end - start) / (1000 * 60 * 60 * 24));\n    return diff >= 0 ? diff : null;\n  }\n\n  function statusClassByPercent(value, good, warn){\n    if(value >= good) return \"green\";\n    if(value >= warn) return \"yellow\";\n    return \"red\";\n  }\n\n  function statusClassByInverse(value, good, warn){\n    if(value <= good) return \"green\";\n    if(value <= warn) return \"yellow\";\n    return \"red\";\n  }\n\n  function getCycleOrder(){\n    const ciclos = {};\n\n    ensayos.forEach(e => {\n      const ciclo = e.ciclo || \"Sin ciclo\";\n      const fecha = e.fecha_siembra || \"1900-01-01\";\n      if(!ciclos[ciclo] || fecha > ciclos[ciclo]){\n        ciclos[ciclo] = fecha;\n      }\n    });\n\n    return Object.entries(ciclos)\n      .sort((a,b) => String(b[1]).localeCompare(String(a[1])))\n      .map(x => x[0]);\n  }\n\n  function buildCycleMetrics(ciclo){\n    const resultadosMap = latestResultadosMap();\n    const ensayosCiclo = ensayos.filter(e => (e.ciclo || \"Sin ciclo\") === ciclo);\n\n    const total = ensayosCiclo.length;\n\n    const conVenta = ensayosCiclo.filter(e => {\n      return opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0) > 0;\n    }).length;\n\n    const conversion = total ? (conVenta / total) * 100 : 0;\n\n    const ventas = ensayosCiclo.reduce((acc,e) => {\n      return acc + opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n    }, 0);\n\n    const roiValues = ensayosCiclo\n      .map(e => resultadosMap[String(e.id)]?.roi)\n      .filter(v => typeof v === \"number\");\n\n    const roiProm = roiValues.length\n      ? roiValues.reduce((a,b) => a + b, 0) / roiValues.length\n      : 0;\n\n    return {\n      ciclo,\n      total,\n      conVenta,\n      conversion,\n      ventas,\n      roiProm\n    };\n  }\n\n  function renderResumenEjecutivo(){\n    const resultadosMap = latestResultadosMap();\n\n    const totalEnsayos = ensayos.length;\n    const activos = ensayos.filter(e => e.estado === \"Activo\").length;\n    const terminados = ensayos.filter(e => e.estado === \"Terminado\").length;\n\n    const totalVentas = oportunidades.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n    const totalLeads = oportunidades.reduce((a,b) => a + Number(b.leads || 0), 0);\n\n    const roiValues = Object.values(resultadosMap)\n      .map(r => Number(r.roi || 0));\n\n    const roiProm = roiValues.length\n      ? roiValues.reduce((a,b) => a + b, 0) / roiValues.length\n      : 0;\n\n    document.getElementById(\"resumenEjecutivo\").innerHTML = `\n      <div class=\"mini\">\n        <span>Total ensayos</span>\n        <b>${totalEnsayos}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Ensayos activos</span>\n        <b>${activos}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Ensayos terminados</span>\n        <b>${terminados}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Leads acumulados</span>\n        <b>${num(totalLeads)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>Ventas cerradas</span>\n        <b>${money(totalVentas)}</b>\n      </div>\n      <div class=\"mini\">\n        <span>ROI promedio</span>\n        <b>${pct(roiProm * 100)}</b>\n      </div>\n    `;\n  }\n\n  function renderTecnicos(){\n    const resultadosMap = latestResultadosMap();\n\n    const total = ensayos.length;\n    const planeados = ensayos.filter(e => e.estado === \"Planeado\").length;\n    const activos = ensayos.filter(e => e.estado === \"Activo\").length;\n    const terminados = ensayos.filter(e => e.estado === \"Terminado\").length;\n    const activosPct = total ? (activos / total) * 100 : 0;\n\n    const rendTratadoValues = Object.values(resultadosMap)\n      .map(r => Number(r.rendTratado || 0))\n      .filter(v => !isNaN(v));\n\n    const mejoraValues = Object.values(resultadosMap)\n      .map(r => Number(r.porcentaje || 0))\n      .filter(v => !isNaN(v));\n\n    const rendProm = rendTratadoValues.length\n      ? rendTratadoValues.reduce((a,b) => a + b, 0) / rendTratadoValues.length\n      : 0;\n\n    const mejoraProm = mejoraValues.length\n      ? mejoraValues.reduce((a,b) => a + b, 0) / mejoraValues.length\n      : 0;\n\n    const activosClass = statusClassByPercent(activosPct, 60, 30);\n    const mejoraClass = mejoraProm >= 15 ? \"green\" : mejoraProm >= 5 ? \"yellow\" : \"red\";\n\n    document.getElementById(\"kpiTecnico\").innerHTML = `\n      <div class=\"kpi ${activosClass}\">📌 % Ensayos activos: <b>${pct(activosPct)}</b></div>\n      <div class=\"kpi\">🗂 Planeados / Activos / Terminados: <b>${planeados} / ${activos} / ${terminados}</b></div>\n      <div class=\"kpi\">🌾 Rendimiento promedio tratado: <b>${num(rendProm)} ton/ha</b></div>\n      <div class=\"kpi ${mejoraClass}\">📈 Mejora promedio vs control: <b>${pct(mejoraProm)}</b></div>\n    `;\n  }\n\n  function renderComerciales(){\n    const ensayosTot = ensayos.length || 0;\n\n    const ensayosConVenta = ensayos.filter(e => {\n      const totalVenta = opportunitiesByEnsayo(e.id).reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n      return totalVenta > 0;\n    }).length;\n\n    const conversion = ensayosTot ? (ensayosConVenta / ensayosTot) * 100 : 0;\n\n    const totalLeads = oportunidades.reduce((a,b) => a + Number(b.leads || 0), 0);\n    const leadsPorEnsayo = ensayosTot ? totalLeads / ensayosTot : 0;\n\n    const ventaEstimada = oportunidades.reduce((a,b) => a + Number(b.ventaEstimada || 0), 0);\n    const ventaCerrada = oportunidades.reduce((a,b) => a + Number(b.ventaCerrada || 0), 0);\n    const conversionValor = ventaEstimada > 0 ? (ventaCerrada / ventaEstimada) * 100 : 0;\n\n    const tiempos = ensayos\n      .map(e => {\n        const cierre = earliestClosedSaleDate(e.id);\n        return daysBetween(e.fecha_siembra, cierre);\n      })\n      .filter(v => v !== null);\n\n    const tiempoProm = tiempos.length\n      ? tiempos.reduce((a,b) => a + b, 0) / tiempos.length\n      : 0;\n\n    const convClass = statusClassByPercent(conversion, 25, 10);\n    const convValorClass = statusClassByPercent(conversionValor, 25, 10);\n    const tiempoClass = tiempos.length ? statusClassByInverse(tiempoProm, 90, 180) : \"muted\";\n\n    document.getElementById(\"kpiComercial\").innerHTML = `\n      <div class=\"kpi ${convClass}\">📈 Tasa de conversión ensayo → venta: <b>${pct(conversion)}</b></div>\n      <div class=\"kpi\">📊 Leads por ensayo: <b>${num(leadsPorEnsayo)}</b></div>\n      <div class=\"kpi\">🧾 Venta estimada acumulada: <b>${money(ventaEstimada)}</b></div>\n      <div class=\"kpi\">💵 Venta cerrada acumulada: <b>${money(ventaCerrada)}</b></div>\n      <div class=\"kpi ${convValorClass}\">🔁 Conversión por valor: <b>${pct(conversionValor)}</b></div>\n      <div class=\"kpi ${tiempoClass}\">⏱ Tiempo promedio ensayo → ci
