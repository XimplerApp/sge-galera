<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SGE Galera — Sistema Integral</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Librerías externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- ESTILOS GENERALES DEL SISTEMA -->
  <style>
    :root{
      --bg:#0f172a;
       --panel:#111827;
       --card:#1e293b;
       --line:#334155;
       --text:#e2e8f0;
       --muted:#94a3b8;
      --primary:#38bdf8;
       --danger:#ef4444;
       --success:#22c55e;
       --warn:#f59e0b;
       --yellow:#facc15;
       --danger-bg:#3b0f14;
    }

    *{
      box-sizing:border-box}

    body{
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:20px;
      margin:0;
      }

    h1{
      color:var(--primary);
      margin-top:0}
     h2,h3{
      margin-top:0}
    .container{
      max-width:1320px;
      margin:auto}

    .app-shell{
      max-width:1320px;
      margin:auto}
    .topbar{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(15,23,42,.96);
      backdrop-filter:blur(8px);
      padding:10px 0 16px;
      border-bottom:1px solid rgba(51,65,85,.7);
      margin-bottom:20px}
    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px}
    .brand-title{
      font-size:20px;
      font-weight:800;
      color:var(--primary)}
    .brand-sub{
      font-size:13px;
      color:var(--muted)}

    .nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:0}
    .nav button{
      width:auto;
      background:#0b1220;
      color:var(--text);
      border:1px solid var(--line)}
    .nav button.active{
      background:var(--primary);
      color:#082f49;
      border-color:var(--primary)}

    .card{
      background:var(--card);
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      border:1px solid var(--line)}
    .alert-card{
      background:var(--danger-bg);
      border:1px solid var(--danger)}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:12px}

    input,select,button,textarea{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:none}
    input,select,textarea{
      margin-top:6px;
      background:#fff;
      color:#111827}
    textarea{
      font-family:Arial,sans-serif}
    label{
      display:block;
      font-size:14px;
      color:var(--muted);
      margin-top:6px;
      margin-bottom:6px}
    button{
      background:var(--primary);
      cursor:pointer;
      font-weight:700;
      color:#082f49}
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px}
    .actions button{
      width:auto}
    .secondary{
      background:#111827;
      color:#e2e8f0;
      border:1px solid var(--line)}
    .danger,.delete{
      background:var(--danger);
      color:#fff}
    .export,.save{
      background:var(--success);
      color:#fff}
    .edit{
      background:var(--warn);
      color:#111827}

    .summary{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      margin-top:14px}
    .mini{
      background:#0b1220;
      border:1px solid var(--line);
      border-radius:10px;
      padding:14px}
    .mini span,.mini div{
      display:block;
      color:var(--muted);
      font-size:13px;
      margin-bottom:6px}
    .mini b{
      display:block;
      font-size:22px;
      color:var(--primary);
      margin-top:4px}
    .kpi{
      font-size:18px;
      margin:8px 0;
      line-height:1.45}
    .green{
      color:var(--success)}
    .red{
      color:var(--danger)}
    .yellow{
      color:var(--yellow)}
    .muted{
      color:var(--muted)}
    .danger-text{
      color:#fecaca}
    .empty{
      color:var(--muted);
      font-style:italic}
    .nowrap{
      white-space:nowrap}

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px}
    th,td{
      padding:10px;
      border:1px solid var(--line);
      text-align:center;
      vertical-align:middle}
    th{
      background:#0b1220}
    .table-wrap{
      overflow-x:auto}
    .result-card,.context-box,.list-block,.radar-panel,.weight-box{
      background:#0b1220;
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
      margin-top:10px}
    .badge{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      background:#0b1220;
      border:1px solid var(--line);
      color:var(--muted);
      margin-left:6px}
    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap}
    .vencido-row{
      background:rgba(239,68,68,.12)}
    hr{
      border:none;
      border-top:1px solid var(--line);
      margin:14px 0}

    #map{
      height:430px;
      border-radius:12px;
      border:1px solid var(--line);
      margin-top:12px}
    .module-bitacora #map{
      height:320px}
    img{
      max-width:100%;
      border-radius:10px;
      margin-top:10px;
      border:1px solid var(--line)}
    .timeline-item{
      background:#0b1220;
      border:1px solid var(--line);
      border-radius:12px;
      padding:16px;
      margin-top:12px}
    .popup{
      color:#111827;
      line-height:1.4;
      min-width:240px}
    .popup b{
      color:#0f172a}
    .radar-wrap{
      display:grid;
      grid-template-columns:minmax(320px,460px) 1fr;
      gap:20px;
      align-items:start}
    .radar-svg{
      width:100%;
      max-width:420px;
      height:auto;
      display:block;
      margin:auto}
    .legend{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px;
      margin-top:10px}
    .legend-item{
      background:#111827;
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px}
    .weight-note{
      margin-top:10px;
      font-size:14px;
      color:var(--muted)}

    @media(max-width:760px){
      body{
      padding:12px}
    .card{
      padding:14px}
    .actions button,.nav button{
      width:100%}
    .radar-wrap{
      grid-template-columns:1fr}
    .topbar{
      position:static}
    }

    .leaflet-popup-content{
      max-height:340px;
      overflow:auto;
      min-width:270px}
    .leaflet-container{
      font:12px/1.45 Arial,sans-serif}
    .module-inteligencia #map{
      height:560px}
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">
        <div>
          <div class="brand-title">Sistema Integral de Gestión de Ensayos Galera</div>
          <div class="brand-sub">v5 legible · GPS consolidado · Importador Galera · Ensayos · Bitácora · Resultados · Pipeline · Tablero · Inteligencia · Innovación</div>
        </div>
        <div class="brand-sub">Datos locales: ensayos, bitácora, resultados, oportunidades, evaluaciones importadas y pesos de innovación</div>
      </div>
      <div class="nav" id="mainNav"></div>
    </div>

    <main id="app"></main>
  </div>

  <!-- ============================================================
       PLANTILLAS HTML POR MÓDULO
       Cada template conserva el diseño y campos de su módulo, pero
       se carga dinámicamente en una sola página index.html.
       ============================================================ -->

  <!-- MÓDULO: 📋 Ensayos -->
  <template id="tpl-ensayos">
    <div class="container">
    <h1>🚀 Registro de Ensayos - Galera</h1>

      <div class="card">
        <div class="section-title">
          <h2>📥 Importar Excel Galera / AppSheet</h2>
          <span class="badge">Conecta sistema actual + SGE</span>
        </div>
        <p class="muted">Importa exportables como el de lechugas. El sistema crea ensayos madre multi-variedad, evaluaciones técnicas y evidencia de bitácora sin duplicar registros ya importados.</p>
        <div class="grid">
          <div>
            <label>Archivo Excel Galera (.xlsx)</label>
            <input type="file" id="archivoGalera" accept=".xlsx,.xls">
          </div>
          <div>
            <label>Modo de importación</label>
            <select id="modoImportacionGalera">
              <option value="fusionar" selected>Fusionar sin duplicar</option>
              <option value="solo_validar">Solo validar / previsualizar</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="export" onclick="SGE.current.importarExcelGalera()">Importar y consolidar</button>
          <button class="secondary" onclick="SGE.current.previsualizarImportacionGalera()">Previsualizar columnas</button>
        </div>
        <div id="importacionGaleraResultado" class="list-block">
          <p class="empty">Aún no se ha importado ningún archivo en esta sesión.</p>
        </div>
      </div>


      <div class="card">
        <h2 id="modo">Nuevo Ensayo</h2>
        <div class="grid">
          <div><label>Técnico responsable</label><input id="tecnico" placeholder="Ej. Ing. López"></div>
          <div><label>Región</label><input id="region" placeholder="Ej. Bajío"></div>
          <div><label>Cultivo</label><input id="cultivo" placeholder="Ej. Tomate"></div>
          <div><label>Objetivo</label><input id="objetivo" placeholder="Ej. +12% vs control"></div>

          <div><label>Ciclo agrícola</label><input id="ciclo" placeholder="Ej. Otoño-Invierno"></div>
          <div>
            <label>Tipo de sistema</label>
            <select id="sistema">
              <option value="Campo abierto">Campo abierto</option>
              <option value="Invernadero">Invernadero</option>
            </select>
          </div>
          <div><label>Tipo de suelo</label><input id="suelo" placeholder="Ej. Franco arenoso"></div>
          <div><label>Sistema de riego</label><input id="riego" placeholder="Ej. Goteo"></div>

          <div><label>Fecha siembra</label><input type="date" id="siembra"></div>
          <div><label>Fecha estimada cosecha</label><input type="date" id="cosecha"></div>
          <div><label>Variedad tratada</label><input id="variedadTratada" placeholder="Ej. Dumas"></div>
          <div><label>Variedad control</label><input id="variedadControl" placeholder="Ej. Competidor"></div>

          <div><label>Proveedor control</label><input id="proveedor" placeholder="Ej. Proveedor X"></div>
          <div><label>Superficie ensayo</label><input id="superficie" placeholder="Ej. 0.5 ha"></div>
          <div><label>Productor</label><input id="productor" placeholder="Ej. Productor Gómez"></div>

          <div>
            <label>Prioridad</label>
            <select id="prioridad">
              <option value="Alta">Alta</option>
              <option value="Media" selected>Media</option>
              <option value="Baja">Baja</option>
            </select>
          </div>

          <div>
            <label>Vínculo comercial explícito</label>
            <select id="vinculoComercial">
              <option value="Sí">Sí</option>
              <option value="No">No</option>
            </select>
          </div>

          <div><label>Cliente / cuenta objetivo</label><input id="clienteObjetivo" placeholder="Ej. Productor / distribuidor / cuenta"></div>

          <div>
            <label>Modo de ensayo</label>
            <select id="modoEnsayo">
              <option value="Individual">Individual</option>
              <option value="Multi-variedad">Multi-variedad</option>
            </select>
          </div>
          <div><label>No. Ensayo externo Galera</label><input id="noEnsayoExterno" placeholder="Ej. ENS#-0440"></div>
          <div><label>Folio externo Galera</label><input id="folioExternoGalera" placeholder="Ej. LC-0410"></div>
          <div><label>Estado geográfico</label><input id="estadoGeografico" placeholder="Ej. Aguascalientes"></div>
          <div><label>Municipio</label><input id="municipio" placeholder="Ej. Asientos"></div>
          <div><label>Ubicación / GPS</label><input id="ubicacion" placeholder="Ej. 22.054157, -101.959836"></div>
          <div><label>Mercado objetivo</label><input id="mercadoObjetivo" placeholder="Ej. Productores exportadores / mercado local"></div>
          <div><label>Segmento objetivo</label><input id="segmentoObjetivo" placeholder="Ej. Agricultores medianos / invernaderos / distribuidores"></div>
          <div><label>Problema que busca resolver *</label><input id="problemaQueBuscaResolver" placeholder="Ej. Mejorar resistencia a fusarium sin perder calibre"></div>
          <div><label>Competidor objetivo</label><input id="competidorObjetivo" placeholder="Ej. Pedrola / proveedor actual"></div>
          <div><label>Criterio de éxito del ensayo *</label><input id="criterioExitoEnsayo" placeholder="Ej. Igual o mejor sanidad, peso y % cosecha vs control"></div>

          <div>
            <label>Estado</label>
            <select id="estado">
              <option value="Planeado">Planeado</option>
              <option value="Activo">Activo</option>
              <option value="Terminado">Terminado</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button onclick="SGE.current.guardar()">Guardar Ensayo</button>
          <button class="edit" onclick="SGE.current.cancelarEdicion()" id="btnCancelar" style="display:none;">Cancelar edición</button>
        </div>
      </div>

      <div class="card">
        <h2>Resumen rápido</h2>
        <div class="summary" id="resumen"></div>
      </div>

      <div class="card alert-card">
        <h2>🚨 Ensayos terminados sin oportunidad comercial</h2>
        <div id="alertasPerdidos"></div>
      </div>

      <div class="card">
        <h2>Ensayos Registrados</h2>
        <div class="actions">
          <button class="export" onclick="SGE.current.exportarExcel()">📊 Exportar a Excel</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Folio</th>
              <th>Cultivo</th>
              <th>Variedad</th>
              <th>Región</th>
              <th>Modo</th>
              <th>Prioridad</th>
              <th>Vínculo comercial</th>
              <th>Éxito definido</th>
              <th>Estado</th>
              <th>Fecha siembra</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- MÓDULO: 📸 Bitácora -->
  <template id="tpl-bitacora">
    <div class="container">
    <h1>📸 Bitácora de Ensayos</h1>

      <div class="card">
        <h2 id="modo">Nuevo Registro</h2>
        <div class="grid">
          <div>
            <label>Ensayo</label>
            <select id="ensayoSelect"></select>
          </div>
          <div>
            <label>Responsable</label>
            <input id="responsable" placeholder="Ej. Ing. López">
          </div>
          <div>
            <label>Etapa</label>
            <select id="etapa">
              <option value="Siembra">Siembra</option>
              <option value="Desarrollo">Desarrollo</option>
              <option value="Cosecha">Cosecha</option>
              <option value="Evaluación">Evaluación</option>
            </select>
          </div>
          <div>
            <label>Tipo de hallazgo</label>
            <select id="tipoHallazgo">
              <option value="">Sin clasificar</option>
              <option value="Plaga">Plaga</option>
              <option value="Vigor">Vigor</option>
              <option value="Floración">Floración</option>
              <option value="Calibre">Calibre</option>
              <option value="Manejo">Manejo</option>
              <option value="Sanidad">Sanidad</option>
              <option value="Madurez">Madurez</option>
              <option value="Evaluación técnica">Evaluación técnica</option>
            </select>
          </div>
          <div>
            <label>Etapa fenológica</label>
            <input id="etapaFenologica" placeholder="Ej. Plantación / Desarrollo / Madurez / Cosecha">
          </div>
          <div>
            <label>Comparativo vs control</label>
            <input id="comparativoVsControl" placeholder="Ej. Más tardía, mejor peso, menor uniformidad">
          </div>
          <div>
            <label>Severidad del hallazgo (1-5)</label>
            <input id="severidadHallazgo" type="number" min="1" max="5" step="1" placeholder="Ej. 3">
          </div>
          <div>
            <label>Acción correctiva</label>
            <input id="accionCorrectiva" placeholder="Ej. Visita técnica, ajuste manejo, repetir evaluación">
          </div>
          <div>
            <label>Foto</label>
            <input type="file" id="foto" accept="image/*">
          </div>
        </div>

        <label>Observación</label>
        <textarea id="comentario" rows="4" placeholder="Describe el avance, hallazgos o incidencia observada..."></textarea>

        <label>Ubicación en mapa</label>
        <div id="map"></div>
        <p id="coords" class="muted"></p>

        <div class="actions">
          <button onclick="SGE.current.guardarBitacora()">Guardar registro</button>
          <button class="edit" id="btnCancelar" onclick="SGE.current.cancelarEdicion()" style="display:none;">Cancelar edición</button>
        </div>
      </div>

      <div class="card">
        <h2>Filtrar Timeline</h2>
        <div class="grid">
          <div>
            <label>Ensayo</label>
            <select id="filtroEnsayo"></select>
          </div>
          <div>
            <label>Etapa</label>
            <select id="filtroEtapa">
              <option value="">Todas</option>
              <option value="Siembra">Siembra</option>
              <option value="Desarrollo">Desarrollo</option>
              <option value="Cosecha">Cosecha</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button onclick="SGE.current.render()">Aplicar filtros</button>
          <button class="export" onclick="SGE.current.exportarExcel()">📊 Exportar Excel</button>
        </div>
      </div>

      <div class="card">
        <h2>Timeline</h2>
        <div id="timeline"></div>
      </div>
    </div>
  </template>

  <!-- MÓDULO: 📊 Resultados -->
  <template id="tpl-resultados">
    <div class="container">
    <h1>📊 Resultados de Ensayos</h1>

      <div class="card">
        <h2 id="modo">Nueva Evaluación</h2>

        <div class="grid">
          <div>
            <label>Ensayo</label>
            <select id="ensayoSelect"></select>
          </div>
          <div>
            <label>Fecha de evaluación</label>
            <input type="date" id="fechaEvaluacion">
          </div>
        </div>

        <div id="contextoEnsayo" class="context-box"></div>

        <h3 style="margin-top:20px;">Resultados Técnicos</h3>
        <div class="grid">
          <div>
            <label>Rendimiento Control (ton/ha)</label>
            <input id="rendControl" placeholder="Ej. 5.2">
          </div>
          <div>
            <label>Rendimiento Tratado (ton/ha)</label>
            <input id="rendTratado" placeholder="Ej. 6.1">
          </div>
          <div>
            <label>Calidad comercial</label>
            <input id="calidadComercial" placeholder="Ej. Calibre exportable alto">
          </div>
          <div>
            <label>Incidencia de plaga (%)</label>
            <input id="incidenciaPlaga" placeholder="Ej. 4">
          </div>
        </div>


        <h3 style="margin-top:20px;">Evaluación Técnica de Campo / Galera</h3>
        <div class="grid">
          <div><label>Variedad evaluada</label><input id="variedadEvaluada" placeholder="Ej. 12981 / Pedrola / Dumas"></div>
          <div>
            <label>Tipo de ensayo Galera</label>
            <select id="tipoEnsayoGalera">
              <option value="">No aplica</option>
              <option value="Comercial">Comercial / Control</option>
              <option value="Muestra">Muestra</option>
              <option value="Experimental">Experimental</option>
            </select>
          </div>
          <div><label>Casa comercial</label><input id="casaComercial" placeholder="Ej. Enza Zaden"></div>
          <div><label>Condición de cultivo</label><input id="condicionCultivo" placeholder="Ej. Bueno / Campo abierto / Invernadero"></div>
          <div><label>Densidad (plantas/ha)</label><input id="densidadPlantasHa" placeholder="Ej. 80000"></div>
          <div><label>Sanidad general</label><input id="sanidadGeneral" placeholder="Ej. Muy buena"></div>
          <div><label>Uniformidad de planta/fruta</label><input id="uniformidadPlanta" placeholder="Ej. Buena / Muy buena"></div>
          <div><label>Madurez</label><input id="madurez" placeholder="Ej. Tardía / Intermedia / Precoz"></div>
          <div><label>Color</label><input id="color" placeholder="Ej. Verde oscuro"></div>
          <div><label>Forma</label><input id="forma" placeholder="Ej. Redonda plana"></div>
          <div><label>Calibre / tamaño dominante</label><input id="calibreTamano" placeholder="Ej. 18s / 24s"></div>
          <div><label>Diámetro producto (cm)</label><input id="diametroProductoCm" placeholder="Ej. 16"></div>
          <div><label>Tamaño de tallo (cm)</label><input id="tamanoTalloCm" placeholder="Ej. 7"></div>
          <div><label>Peso producto (g)</label><input id="pesoProductoG" placeholder="Ej. 1100"></div>
          <div><label>% de cosecha</label><input id="porcentajeCosecha" placeholder="Ej. 0.95 o 95"></div>
          <div><label>Enfermedad observada</label><input id="enfermedadObservada" placeholder="Ej. Fusarium / Bremia / Xanthomonas"></div>
          <div><label>Ventaja principal</label><input id="ventajaPrincipal" placeholder="Ej. Mejor sanidad / peso / calibre"></div>
          <div><label>Desventaja principal</label><input id="desventajaPrincipal" placeholder="Ej. Más tardía / menor uniformidad"></div>
          <div><label>Comparación vs testigo</label><input id="comparacionVsTestigo" placeholder="Resumen corto vs control"></div>
          <div>
            <label>Recomendación comercial</label>
            <select id="recomendacionComercial">
              <option value="">Automática / no definida</option>
              <option value="Escalar">Escalar</option>
              <option value="Repetir con ajustes">Repetir con ajustes</option>
              <option value="Ajustar">Ajustar</option>
              <option value="Detener">Detener</option>

  <script>
  /* ============================================================
     CONFIGURACIÓN GENERAL
     ============================================================ */
  const MODULE_ORDER = ["ensayos", "bitacora", "resultados", "pipeline", "tablero", "inteligencia", "innovacion"];

  const MODULE_LABELS = {
    "ensayos": "📋 Ensayos",
    "bitacora": "📸 Bitácora",
    "resultados": "📊 Resultados",
    "pipeline": "🌱 Pipeline",
    "tablero": "🧠 Tablero",
    "inteligencia": "🚀 Inteligencia",
    "innovacion": "🧬 Innovación"
  };


  /* ============================================================
     MÓDULO 📋 ENSAYOS
     ============================================================ */
  function initEnsayos() {
    const $ = id => document.getElementById(id);

      function getData(key){
        try{ return JSON.parse(localStorage.getItem(key)) || []; }
        catch(e){ return []; }
      }

      function saveData(key, data){
        localStorage.setItem(key, JSON.stringify(data));
      }

      function formatDate(iso){
        if(!iso) return "";
        const d = new Date(iso + "T00:00:00");
        if(isNaN(d)) return iso;
        return d.toLocaleDateString("es-MX");
      }

      let ensayos = getData("ensayos");
      let editId = null;

      function generateEnsayoId(){
        const year = new Date().getFullYear();
        const regex = new RegExp(`^ENS-${year}-(\\d{3})$`);
        let max = 0;

        ensayos.forEach(e => {
          const match = String(e.id || "").match(regex);
          if(match){
            max = Math.max(max, parseInt(match[1], 10));
          }
        });

        return `ENS-${year}-${String(max + 1).padStart(3, "0")}`;
      }

      function limpiarFormulario(){
        editId = null;
        $("modo").innerText = "Nuevo Ensayo";
        $("btnCancelar").style.display = "none";

        [
          "tecnico","region","cultivo","objetivo","ciclo","suelo","riego",
          "siembra","cosecha","variedadTratada","variedadControl","proveedor",
          "superficie","productor","clienteObjetivo","noEnsayoExterno","folioExternoGalera",
          "estadoGeografico","municipio","ubicacion","mercadoObjetivo","segmentoObjetivo",
          "problemaQueBuscaResolver","competidorObjetivo","criterioExitoEnsayo"
        ].forEach(id => { if($(id)) $(id).value = ""; });

        $("sistema").value = "Campo abierto";
        $("estado").value = "Planeado";
        $("prioridad").value = "Media";
        $("vinculoComercial").value = "Sí";
        $("modoEnsayo").value = "Individual";
      }

      function cancelarEdicion(){
        limpiarFormulario();
      }

      function editar(id){
        const e = ensayos.find(x => String(x.id) === String(id));
        if(!e) return;

        editId = String(id);
        $("modo").innerText = "Editar Ensayo";
        $("btnCancelar").style.display = "inline-block";

        $("tecnico").value = e.tecnico || "";
        $("region").value = e.region || "";
        $("cultivo").value = e.cultivo || "";
        $("objetivo").value = e.objetivo || "";
        $("ciclo").value = e.ciclo || "";
        $("sistema").value = e.sistema || "Campo abierto";
        $("suelo").value = e.suelo || "";
        $("riego").value = e.riego || "";
        $("siembra").value = e.fecha_siembra || "";
        $("cosecha").value = e.fecha_cosecha || "";
        $("variedadTratada").value = e.variedad_tratada || "";
        $("variedadControl").value = e.variedad_control || "";
        $("proveedor").value = e.proveedor_control || "";
        $("superficie").value = e.superficie || "";
        $("productor").value = e.productor || "";
        $("prioridad").value = e.prioridad || "Media";
        $("vinculoComercial").value = e.vinculo_comercial || "Sí";
        $("clienteObjetivo").value = e.cliente_objetivo || "";
        $("modoEnsayo").value = e.modo_ensayo || "Individual";
        $("noEnsayoExterno").value = e.no_ensayo_externo || "";
        $("folioExternoGalera").value = e.folio_externo_galera || "";
        $("estadoGeografico").value = e.estado_geografico || "";
        $("municipio").value = e.municipio || "";
        $("ubicacion").value = e.ubicacion || "";
        $("mercadoObjetivo").value = e.mercado_objetivo || "";
        $("segmentoObjetivo").value = e.segmento_objetivo || "";
        $("problemaQueBuscaResolver").value = e.problema_que_busca_resolver || "";
        $("competidorObjetivo").value = e.competidor_objetivo || "";
        $("criterioExitoEnsayo").value = e.criterio_exito_ensayo || "";
        $("estado").value = e.estado || "Planeado";

        window.scrollTo({top:0, behavior:"smooth"});
      }

      function guardar(){
        const nowIso = new Date().toISOString();

        const fechaSiembra = $("siembra").value;
        const fechaCosecha = $("cosecha").value;

        if(fechaSiembra && fechaCosecha && fechaCosecha <= fechaSiembra){
          alert("La fecha estimada de cosecha debe ser posterior a la fecha de siembra.");
          return;
        }

        const vinculoComercial = $("vinculoComercial").value;
        const clienteObjetivo = $("clienteObjetivo").value.trim();

        if(vinculoComercial === "Sí" && !clienteObjetivo){
          alert("Si el ensayo tiene vínculo comercial explícito, captura el cliente o cuenta objetivo.");
          return;
        }

        const problema = $("problemaQueBuscaResolver").value.trim();
        const criterioExito = $("criterioExitoEnsayo").value.trim();

        if(!problema){
          alert("Captura el problema que busca resolver el ensayo. Esto evita ensayos sin hipótesis comercial/técnica.");
          return;
        }

        if(!criterioExito){
          alert("Captura el criterio de éxito del ensayo. Esto define cuándo avanzar, repetir o detener.");
          return;
        }

        const ensayo = {
          id: editId || generateEnsayoId(),
          tecnico: $("tecnico").value.trim(),
          region: $("region").value.trim(),
          cultivo: $("cultivo").value.trim(),
          objetivo: $("objetivo").value.trim(),
          ciclo: $("ciclo").value.trim(),
          sistema: $("sistema").value,
          suelo: $("suelo").value.trim(),
          riego: $("riego").value.trim(),
          fecha_siembra: fechaSiembra,
          fecha_cosecha: fechaCosecha,
          variedad_tratada: $("variedadTratada").value.trim(),
          variedad_control: $("variedadControl").value.trim(),
          proveedor_control: $("proveedor").value.trim(),
          superficie: $("superficie").value.trim(),
          productor: $("productor").value.trim(),
          prioridad: $("prioridad").value,
          vinculo_comercial: vinculoComercial,
          cliente_objetivo: clienteObjetivo,
          modo_ensayo: $("modoEnsayo").value,
          no_ensayo_externo: $("noEnsayoExterno").value.trim(),
          folio_externo_galera: $("folioExternoGalera").value.trim(),
          estado_geografico: $("estadoGeografico").value.trim(),
          municipio: $("municipio").value.trim(),
          ubicacion: $("ubicacion").value.trim(),
          mercado_objetivo: $("mercadoObjetivo").value.trim(),
          segmento_objetivo: $("segmentoObjetivo").value.trim(),
          problema_que_busca_resolver: problema,
          competidor_objetivo: $("competidorObjetivo").value.trim(),
          criterio_exito_ensayo: criterioExito,
          estado: $("estado").value,
          fecha_alta_iso: editId ? (ensayos.find(x => String(x.id) === String(editId))?.fecha_alta_iso || nowIso) : nowIso,
          fecha_actualizacion_iso: nowIso
        };

        if(!ensayo.cultivo || !ensayo.variedad_tratada || !ensayo.region){
          alert("Captura al menos cultivo, variedad tratada y región.");
          return;
        }

        if(editId){
          ensayos = ensayos.map(x => String(x.id) === String(editId) ? ensayo : x);
        }else{
          ensayos.push(ensayo);
        }

        saveData("ensayos", ensayos);
        limpiarFormulario();
        render();
      }

        if(!confirm("¿Eliminar este ensayo?")) return;
        ensayos = ensayos.filter(e => String(e.id) !== String(id));
        saveData("ensayos", ensayos);

      function normalizeText(v){
        return String(v ?? "").trim();
      }

      function normalizeHeader(v){
        return normalizeText(v)
          .toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function val(row, names){
        const keys = Object.keys(row || {});
        for(const name of names){
          const target = normalizeHeader(name);
          const found = keys.find(k => normalizeHeader(k) === target);
          if(found !== undefined) return row[found];
        }
        return "";
      }

      function parseNumberFlexible(value){
        if(value === null || value === undefined || value === "") return 0;
        if(typeof value === "number") return value;
        const clean = String(value).replace(/,/g, "").replace("%","").trim();
        const n = parseFloat(clean);
        return isNaN(n) ? 0 : n;
      }

      function excelDateToISO(v){
        if(!v) return "";
        if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
        if(typeof v === "number"){
          const d = XLSX.SSF.parse_date_code(v);
          if(!d) return "";
          return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
        }
        const txt = String(v).trim();
        const d = new Date(txt);
        return isNaN(d) ? txt : d.toISOString().slice(0,10);
      }

      function isValidLatLng(lat, lng){
        lat = Number(lat);
        lng = Number(lng);
        return isFinite(lat) && isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
      }

      function parseLatLng(text){
        const raw = String(text || "").trim();
        if(!raw) return {lat:null,lng:null,raw:"",source:"Sin ubicación"};

        // Caso común: "22.054157, -101.959836".
        const direct = raw.match(/(-?\d{1,2}(?:\.\d+))\s*[,;\s]+\s*(-?\d{1,3}(?:\.\d+))/);
        if(direct){
          const lat = Number(direct[1]);
          const lng = Number(direct[2]);
          if(isValidLatLng(lat,lng)) return {lat,lng,raw,source:"GPS importado del Excel"};
        }

        // Respaldo para textos/URLs con coordenadas embebidas: busca pares válidos.
        const nums = raw.match(/-?\d+(?:\.\d+)?/g) || [];
        for(let i=0; i<nums.length-1; i++){
          const lat = Number(nums[i]);
          const lng = Number(nums[i+1]);
          if(isValidLatLng(lat,lng)) return {lat,lng,raw,source:"GPS detectado en texto"};
        }

        return {lat:null,lng:null,raw,source:"Texto de ubicación sin GPS válido"};
      }

      function bestCoordsFromRows(rows){
        const parsed = (rows || []).map(row => {
          const raw = normalizeText(val(row, ["Ubicación","Ubicacion","GPS","Coordenadas"]));
          return parseLatLng(raw);
        });

        const valid = parsed.filter(p => isValidLatLng(p.lat, p.lng));
        const raw = (parsed.find(p => p.raw)?.raw) || "";

        if(valid.length){
          const lat = valid.reduce((a,b)=>a + Number(b.lat),0) / valid.length;
          const lng = valid.reduce((a,b)=>a + Number(b.lng),0) / valid.length;
          return {
            lat,
            lng,
            raw: valid.map(p => p.raw).filter(Boolean).join(" | "),
            count: valid.length,
            source: valid.length > 1 ? "GPS promedio de variedades del mismo ensayo" : "GPS importado del Excel"
          };
        }

        return {lat:null,lng:null,raw, count:0, source:"Sin GPS en Excel"};
      }

      function todayISO(){
        return new Date().toISOString().slice(0,10);
      }

      function technicalScoreText(value){
        const txt = normalizeHeader(value);
        if(!txt) return 0;
        if(txt.includes("excel") || txt.includes("muy buena") || txt.includes("alta") || txt.includes(">91") || txt.includes("avance comercial")) return 5;
        if(txt.includes("buena") || txt.includes("medio") || txt.includes("media")) return 4;
        if(txt.includes("regular") || txt.includes("intermedia") || txt.includes("volver")) return 3;
        if(txt.includes("baja") || txt.includes("<84") || txt.includes("eliminar")) return 1;
        return 3;
      }

      function decisionFromEstatus(estatus){
        const txt = normalizeHeader(estatus);
        if(txt.includes("avance")) return {evaluacion:"Exitoso", recomendacion:"Escalar comercialmente", repetir:"Sí"};
        if(txt.includes("volver") || txt.includes("repetir")) return {evaluacion:"Parcial", recomendacion:"Repetir con ajustes", repetir:"Sí"};
        if(txt.includes("eliminar") || txt.includes("descartar")) return {evaluacion:"No exitoso", recomendacion:"Detener / no escalar", repetir:"No"};
        return {evaluacion:"Validación técnica", recomendacion:"Revisión comercial", repetir:"Por definir"};
      }

      function groupKeyFromGaleraRow(row){
        const agricultor = normalizeText(val(row, ["Agricultor"]));
        const estado = normalizeText(val(row, ["Estado"]));
        const municipio = normalizeText(val(row, ["Municipio"]));
        const tipo = normalizeText(val(row, ["Tipo de Lechuga","Cultivo"]));
        const fechaSiembra = excelDateToISO(val(row, ["Fecha de Siembra","Fecha Siembra"]));
        const fechaPlantacion = excelDateToISO(val(row, ["Fecha de Plantación","Fecha Plantación"]));
        const fechaEval = excelDateToISO(val(row, ["Fecha de Evaluación","Fecha Evaluación"]));

        // Importante: NO usamos la columna Ubicación como parte de la llave madre.
        // En el exportable de Galera una misma evaluación puede traer coordenadas ligeramente distintas por variedad.
        // Si la metemos a la llave, se separan muestras/control que realmente pertenecen al mismo ensayo.
        return [agricultor, estado, municipio, tipo, fechaSiembra, fechaPlantacion, fechaEval]
          .map(x => normalizeHeader(x)).join("|");
      }

      function splitCsvLike(text){
        return String(text || "").split(",").map(x => x.trim()).filter(Boolean);
      }

      function intersects(a,b){
        const set = new Set((a || []).map(x => normalizeHeader(x)));
        return (b || []).some(x => set.has(normalizeHeader(x)));
      }

      function galeraRowsFromWorkbook(wb){
        const firstSheet = wb.SheetNames[0];
        const ws = wb.Sheets[firstSheet];
        return XLSX.utils.sheet_to_json(ws, {defval:"", raw:true});
      }

      function previsualizarImportacionGalera(){
        const file = $("archivoGalera").files[0];
        if(!file){
          alert("Selecciona un archivo Excel de Galera.");
          return;
        }

        const reader = new FileReader();
        reader.onload = function(ev){
          const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
          const rows = galeraRowsFromWorkbook(wb);
          const cols = rows.length ? Object.keys(rows[0]) : [];
          $("importacionGaleraResultado").innerHTML = `
            <h3>Previsualización</h3>
            <p>Filas detectadas: <b>${rows.length}</b></p>
            <p>Columnas detectadas:</p>
            <p class="muted">${cols.join(" · ")}</p>
          `;
        };
        reader.readAsArrayBuffer(file);
      }

      function importarExcelGalera(){
        const file = $("archivoGalera").files[0];
        if(!file){
          alert("Selecciona un archivo Excel de Galera.");
          return;
        }

        const modo = $("modoImportacionGalera").value;

        const reader = new FileReader();
        reader.onload = function(ev){
          const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
          const rows = galeraRowsFromWorkbook(wb);

          if(!rows.length){
            $("importacionGaleraResultado").innerHTML = `<p class="red">No se detectaron filas en el archivo.</p>`;
            return;
          }

          if(modo === "solo_validar"){
            const cols = Object.keys(rows[0] || {});
            $("importacionGaleraResultado").innerHTML = `
              <h3>Validación sin importar</h3>
              <p>Filas listas para importar: <b>${rows.length}</b></p>
              <p class="muted">${cols.join(" · ")}</p>
            `;
            return;
          }

          ensayos = getData("ensayos");
          let resultados = getData("resultados");
          let bitacora = getData("bitacora");

          const existingGroups = {};
          ensayos.forEach(e => {
            if(e.galera_group_key) existingGroups[e.galera_group_key] = e;
          });

          const groupedRows = {};
          rows.forEach(row => {
            const key = groupKeyFromGaleraRow(row);
            if(!groupedRows[key]) groupedRows[key] = [];
            groupedRows[key].push(row);
          });

          let ensayosCreados = 0;
          let ensayosActualizados = 0;
          let resultadosCreados = 0;
          let resultadosActualizados = 0;
          let bitacorasCreadas = 0;
          let duplicadosResultado = 0;
          let incompletos = 0;
          let gpsDetectados = 0;
          let gruposConGps = 0;
          let gruposSinGps = 0;
          const nowIso = new Date().toISOString();

          Object.entries(groupedRows).forEach(([groupKey, lista]) => {
            const first = lista[0];
            const estadoGeo = normalizeText(val(first, ["Estado"]));
            const municipio = normalizeText(val(first, ["Municipio"]));
            const coordInfo = bestCoordsFromRows(lista);
            const ubicacion = coordInfo.raw || normalizeText(val(first, ["Ubicación","Ubicacion"]));
            const coords = coordInfo;
            if(isValidLatLng(coords.lat, coords.lng)){
              gruposConGps++;
              gpsDetectados += coords.count || 1;
            }else{
              gruposSinGps++;
            }
            const agricultor = normalizeText(val(first, ["Agricultor"]));
            const tipoLechuga = normalizeText(val(first, ["Tipo de Lechuga"]));
            const cultivo = tipoLechuga ? "Lechuga" : (normalizeText(val(first, ["Cultivo"])) || "Cultivo no definido");
            const fechaSiembra = excelDateToISO(val(first, ["Fecha de Siembra","Fecha Siembra"]));
            const fechaPlantacion = excelDateToISO(val(first, ["Fecha de Plantación","Fecha Plantación"]));
            const fechaEval = excelDateToISO(val(first, ["Fecha de Evaluación","Fecha Evaluación"]));
            const comerciales = lista.filter(r => normalizeHeader(val(r, ["Tipo de Ensayo"])) === "comercial");
            const muestras = lista.filter(r => normalizeHeader(val(r, ["Tipo de Ensayo"])) !== "comercial");
            const control = comerciales[0] || first;
            const variedadControl = normalizeText(val(control, ["Variedad"]));
            const variedadTratada = normalizeText(val(muestras[0] || first, ["Variedad"]));
            const folios = [...new Set(lista.map(r => normalizeText(val(r, ["Folio"]))).filter(Boolean))];
            const noEnsayos = [...new Set(lista.map(r => normalizeText(val(r, ["No. Ensayo","No Ensayo"]))).filter(Boolean))];
            const variedadesEvaluadas = [...new Set(lista.map(r => normalizeText(val(r, ["Variedad"]))).filter(Boolean))];
            const variedadesMuestra = [...new Set(muestras.map(r => normalizeText(val(r, ["Variedad"]))).filter(Boolean))];
            const variedadTratadaDisplay = variedadesMuestra.length ? variedadesMuestra.join(", ") : (variedadTratada || variedadesEvaluadas.join(", "));

            let ensayo = existingGroups[groupKey] || ensayos.find(e => {
              if(!e.importado_desde_galera) return false;
              const foliosExistentes = splitCsvLike(e.folio_externo_galera);
              const noEnsayosExistentes = splitCsvLike(e.no_ensayo_externo);
              const mismoLugar = normalizeHeader(e.productor) === normalizeHeader(agricultor || "Sin agricultor") &&
                normalizeHeader(e.estado_geografico) === normalizeHeader(estadoGeo) &&
                normalizeHeader(e.municipio) === normalizeHeader(municipio);
              return mismoLugar && (intersects(foliosExistentes, folios) || intersects(noEnsayosExistentes, noEnsayos));
            });
            if(!ensayo){
              ensayo = {
                id: generateEnsayoId(),
                tecnico: normalizeText(val(first, ["Evaluador"])) || "",
                region: [estadoGeo, municipio].filter(Boolean).join(" / "),
                cultivo,
                objetivo: `Validar ${cultivo}${tipoLechuga ? " tipo " + tipoLechuga : ""} contra control comercial y convertir evidencia técnica en decisión comercial.`,
                ciclo: "",
                sistema: normalizeText(val(first, ["Condición de Cultivo"])) || "Campo abierto",
                suelo: "",
                riego: "",
                fecha_siembra: fechaSiembra || fechaPlantacion || "",
                fecha_cosecha: fechaEval || "",
                variedad_tratada: variedadTratadaDisplay || variedadControl || "",
                variedades_evaluadas: variedadesEvaluadas.join(", "),
                variedad_control: variedadControl || "",
                proveedor_control: normalizeText(val(control, ["Casa Comercial"])) || "",
                superficie: "",
                productor: agricultor || "Sin agricultor",
                prioridad: "Alta",
                vinculo_comercial: "Sí",
                cliente_objetivo: agricultor || "",
                modo_ensayo: "Multi-variedad",
                no_ensayo_externo: noEnsayos.join(", "),
                folio_externo_galera: folios.join(", "),
                estado_geografico: estadoGeo,
                municipio,
                ubicacion,
                lat: isValidLatLng(coords.lat, coords.lng) ? coords.lat : null,
                lng: isValidLatLng(coords.lat, coords.lng) ? coords.lng : null,
                gps_source: coords.source,
                gps_count_importado: coords.count || 0,
                mercado_objetivo: "Productores agrícolas por zona/cultivo",
                segmento_objetivo: tipoLechuga || cultivo,
                problema_que_busca_resolver: `Validar si las muestras superan o igualan al control comercial ${variedadControl || "actual"} en sanidad, uniformidad, calibre, peso y % de cosecha.`,
                competidor_objetivo: variedadControl || "",
                criterio_exito_ensayo: "Avance comercial, mejor o igual desempeño técnico vs control y argumento comercial claro.",
                estado: "Terminado",
                importado_desde_galera: true,
                galera_group_key: groupKey,
                fecha_alta_iso: nowIso,
                fecha_actualizacion_iso: nowIso
              };
              ensayos.push(ensayo);
              existingGroups[groupKey] = ensayo;
              ensayosCreados++;
            }else{
              const mergedFolios = [...new Set(String(ensayo.folio_externo_galera || "").split(",").map(x=>x.trim()).concat(folios).filter(Boolean))];
              const mergedNoEnsayos = [...new Set(String(ensayo.no_ensayo_externo || "").split(",").map(x=>x.trim()).concat(noEnsayos).filter(Boolean))];
              ensayo.folio_externo_galera = mergedFolios.join(", ");
              ensayo.no_ensayo_externo = mergedNoEnsayos.join(", ");
              ensayo.variedades_evaluadas = [...new Set(splitCsvLike(ensayo.variedades_evaluadas).concat(variedadesEvaluadas))].join(", ");
              ensayo.variedad_tratada = ensayo.variedad_tratada || variedadTratadaDisplay || variedadControl || "";
              ensayo.ubicacion = ensayo.ubicacion || ubicacion;
              if(isValidLatLng(coords.lat, coords.lng) && !isValidLatLng(ensayo.lat, ensayo.lng)){
                ensayo.lat = coords.lat;
                ensayo.lng = coords.lng;
                ensayo.gps_source = coords.source;
                ensayo.gps_count_importado = coords.count || 0;
              }
              ensayo.galera_group_key = groupKey;
              ensayo.fecha_actualizacion_iso = nowIso;
              ensayosActualizados++;
            }

            const pesoControl = parseNumberFlexible(val(control, ["Peso de Producto, g"]));
            const cosechaControl = parseNumberFlexible(val(control, ["% de Cosecha"]));
            const diametroControl = parseNumberFlexible(val(control, ["Díametro de Producto, cm","Diámetro de Producto, cm"]));

            lista.forEach((row, idx) => {
              const folio = normalizeText(val(row, ["Folio"]));
              const noEnsayo = normalizeText(val(row, ["No. Ensayo","No Ensayo"]));
              const variedad = normalizeText(val(row, ["Variedad"]));
              const tipoEnsayo = normalizeText(val(row, ["Tipo de Ensayo"]));
              const importKey = ["GALERA", groupKey, folio, noEnsayo, variedad, excelDateToISO(val(row, ["Fecha de Evaluación","Fecha Evaluación"]))].map(x => normalizeHeader(x)).join("|");

              if(!folio && !variedad){
                incompletos++;
                return;
              }

              const existingResultado = resultados.find(r => r.import_key === importKey);
              if(existingResultado){
                const rowCoordsDirect = parseLatLng(normalizeText(val(row, ["Ubicación","Ubicacion","GPS","Coordenadas"])));
                const rowCoords = isValidLatLng(rowCoordsDirect.lat, rowCoordsDirect.lng) ? rowCoordsDirect : coords;
                Object.assign(existingResultado, {
                  evaluacion_id: normalizeText(val(row, ["EvaluacionID","EvaluaciónID","EvaluationID"])),
                  ubicacion: normalizeText(val(row, ["Ubicación","Ubicacion"])) || ubicacion || existingResultado.ubicacion || "",
                  lat: isValidLatLng(rowCoords.lat, rowCoords.lng) ? rowCoords.lat : (isValidLatLng(existingResultado.lat, existingResultado.lng) ? existingResultado.lat : null),

  function initBitacora() {
    const $ = id => document.getElementById(id);

      function getData(key){
        try{
          return JSON.parse(localStorage.getItem(key)) || [];
        }catch(e){
          return [];
        }
      }

      function saveData(key, data){
        localStorage.setItem(key, JSON.stringify(data));
      }

      function formatDateTime(iso){
        if(!iso) return "";
        const d = new Date(iso);
        if(isNaN(d)) return iso;
        return d.toLocaleString("es-MX");
      }

      let ensayos = getData("ensayos");
      let bitacora = getData("bitacora");
      let editId = null;
      let lat = null;
      let lng = null;
      let marker = null;

      function ensayoLabel(e){
        return `${e.id} | ${e.cultivo || ""} | ${e.variedad_tratada || ""} | ${e.productor || ""}`;
      }

      function cargarEnsayos(){
        ensayos = getData("ensayos");

        $("ensayoSelect").innerHTML = "";
        $("filtroEnsayo").innerHTML = '<option value="">Todos los ensayos</option>';

        if(!ensayos.length){
          $("ensayoSelect").innerHTML = '<option value="">No hay ensayos capturados</option>';
          return;
        }

        ensayos.forEach(e => {
          $("ensayoSelect").innerHTML += `<option value="${e.id}">${ensayoLabel(e)}</option>`;
          $("filtroEnsayo").innerHTML += `<option value="${e.id}">${ensayoLabel(e)}</option>`;
        });
      }

      const map = L.map("map").setView([23.6, -102.5], 5);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19
      }).addTo(map);

      map.on("click", function(e){
        lat = e.latlng.lat;
        lng = e.latlng.lng;

        if(marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);

        $("coords").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
      });

      function limpiarMapa(){
        lat = null;
        lng = null;
        $("coords").innerText = "";
        if(marker){
          map.removeLayer(marker);
          marker = null;
        }
      }

      function limpiarFormulario(){
        editId = null;
        $("modo").innerText = "Nuevo Registro";
        $("btnCancelar").style.display = "none";
        $("responsable").value = "";
        $("comentario").value = "";
        $("foto").value = "";
        $("etapa").value = "Siembra";
        $("tipoHallazgo").value = "";
        $("etapaFenologica").value = "";
        $("comparativoVsControl").value = "";
        $("severidadHallazgo").value = "";
        $("accionCorrectiva").value = "";
        limpiarMapa();
      }

      function cancelarEdicion(){
        limpiarFormulario();
      }

      function guardarBitacora(){
        if(!$("ensayoSelect").value){
          alert("Selecciona un ensayo.");
          return;
        }

        if(!$("responsable").value.trim()){
          alert("Captura el responsable.");
          return;
        }

        const file = $("foto").files[0];

        if(file){
          const reader = new FileReader();
          reader.onload = () => guardarRegistro(reader.result);
          reader.readAsDataURL(file);
        }else{
          const existing = editId ? (bitacora.find(b => b.id === editId)?.foto || null) : null;
          guardarRegistro(existing);
        }
      }

      function guardarRegistro(fotoBase64){
        const nowIso = new Date().toISOString();

        const registro = {
          id: editId || Date.now(),
          ensayo_id: $("ensayoSelect").value,
          responsable: $("responsable").value.trim(),
          etapa: $("etapa").value,
          tipo_hallazgo: $("tipoHallazgo").value,
          etapa_fenologica: $("etapaFenologica").value.trim(),
          comparativo_vs_control: $("comparativoVsControl").value.trim(),
          severidad_hallazgo: Number($("severidadHallazgo").value || 0),
          accion_correctiva: $("accionCorrectiva").value.trim(),
          comentario: $("comentario").value.trim(),
          foto: fotoBase64 || null,
          lat: lat,
          lng: lng,
          fechaISO: editId ? (bitacora.find(b => b.id === editId)?.fechaISO || nowIso) : nowIso,
          fechaActualizacionISO: nowIso
        };

        if(editId){
          bitacora = bitacora.map(b => b.id === editId ? registro : b);
        }else{
          bitacora.push(registro);
        }

        saveData("bitacora", bitacora);
        limpiarFormulario();
        render();
      }

      function editar(id){
        const b = bitacora.find(x => x.id === id);
        if(!b) return;

        editId = id;
        $("modo").innerText = "Editar Registro";
        $("btnCancelar").style.display = "inline-block";

        $("ensayoSelect").value = b.ensayo_id;
        $("responsable").value = b.responsable || "";
        $("etapa").value = b.etapa || "Siembra";
        $("comentario").value = b.comentario || "";
        $("tipoHallazgo").value = b.tipo_hallazgo || "";
        $("etapaFenologica").value = b.etapa_fenologica || "";
        $("comparativoVsControl").value = b.comparativo_vs_control || "";
        $("severidadHallazgo").value = b.severidad_hallazgo || "";
        $("accionCorrectiva").value = b.accion_correctiva || "";

        limpiarMapa();

        lat = typeof b.lat === "number" ? b.lat : null;
        lng = typeof b.lng === "number" ? b.lng : null;

        if(lat !== null && lng !== null){
          marker = L.marker([lat, lng]).addTo(map);
          map.setView([lat, lng], 12);
          $("coords").innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function eliminar(id){
        if(!confirm("¿Eliminar este registro de bitácora?")) return;
        bitacora = bitacora.filter(b => b.id !== id);
        saveData("bitacora", bitacora);
        render();
      }

      function render(){
        bitacora = getData("bitacora");
        ensayos = getData("ensayos");

        const ensayoFiltro = $("filtroEnsayo").value;
        const etapaFiltro = $("filtroEtapa").value;

        let lista = bitacora.slice();

        if(ensayoFiltro){
          lista = lista.filter(b => String(b.ensayo_id) === String(ensayoFiltro));
        }

        if(etapaFiltro){
          lista = lista.filter(b => b.etapa === etapaFiltro);
        }

        lista.sort((a, b) => String(b.fechaISO || "").localeCompare(String(a.fechaISO || "")));

        $("timeline").innerHTML = lista.length ? "" : `<p class="muted">No hay registros para los filtros seleccionados.</p>`;

        lista.forEach(b => {
          const e = ensayos.find(x => String(x.id) === String(b.ensayo_id)) || {};

          $("timeline").innerHTML += `
            <div class="timeline-item">
              <h3>${ensayoLabel(e)}</h3>

              ${b.foto ? `<img src="${b.foto}" alt="Foto evidencia">` : ""}
              <div class="actions">
                <button class="edit" onclick="SGE.current.editar(${b.id})">Editar</button>
                <button class="delete" onclick="SGE.current.eliminar(${b.id})">Eliminar</button>
              </div>
            </div>
          `;
        });
      }

      function exportarExcel(){
        const data = bitacora.map(b => {
          const e = ensayos.find(x => String(x.id) === String(b.ensayo_id)) || {};
          return {

            "Productor": e.productor || "",

  function initResultados() {
    const $ = id => document.getElementById(id);

      function getData(key){
        try { return JSON.parse(localStorage.getItem(key)) || []; }
        catch(e){ return []; }
      }

      function saveData(key, data){
        localStorage.setItem(key, JSON.stringify(data));
      }

      function ensayoLabel(e){
        return `${e.id} | ${e.cultivo || ""} | ${e.variedad_tratada || ""} | ${e.productor || ""}`;
      }

      function formatMoney(n){
        return "$" + new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(n || 0));
      }

      function formatPct(n){
        return new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(n || 0)) + "%";
      }

      function formatNum(n){
        return new Intl.NumberFormat("es-MX", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(n || 0));
      }

      function formatDate(iso){
        if(!iso) return "";
        const d = new Date(iso + "T00:00:00");
        if(isNaN(d)) return iso;
        return d.toLocaleDateString("es-MX");
      }

      function parseNumber(value){
        if(value === null || value === undefined) return 0;
        const clean = String(value).trim().replace(/,/g, "");
        const num = parseFloat(clean);
        return isNaN(num) ? 0 : num;
      }

      function parseSurfaceHa(value){
        if(value === null || value === undefined) return 0;
        const text = String(value).trim().toLowerCase().replace(/,/g, "");
        const match = text.match(/(\d+(\.\d+)?)/);
        return match ? parseFloat(match[1]) : 0;
      }

      function normalizeHeader(v){
        return String(v ?? "")
          .trim()
          .toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/\s+/g, " ");
      }

      function technicalScoreText(value){
        const txt = normalizeHeader(value);
        if(!txt) return 0;
        if(txt.includes("excel") || txt.includes("muy buena") || txt.includes("alta") || txt.includes(">91") || txt.includes("avance comercial") || txt.includes("escalar")) return 5;
        if(txt.includes("buena") || txt.includes("medio") || txt.includes("media")) return 4;
        if(txt.includes("regular") || txt.includes("intermedia") || txt.includes("volver") || txt.includes("repetir")) return 3;
        if(txt.includes("baja") || txt.includes("<84") || txt.includes("eliminar") || txt.includes("detener")) return 1;
        return 3;
      }

      function clampScore(n){
        n = Number(n || 0);
        if(!n) return 0;
        return Math.max(1, Math.min(5, n));
      }

      function todayISO(){
        return new Date().toISOString().slice(0,10);
      }

      let ensayos = getData("ensayos");
      let resultados = getData("resultados");
      let oportunidades = getData("oportunidades");
      let editId = null;
      let tmp = null;

      const metasROI = {
        "tomate": 0.25,
        "pimiento": 0.30,
        "chile": 0.30,
        "cebolla": 0.20,
        "pepino": 0.25,
        "calabaza": 0.22,
        "sandia": 0.20,
        "melón": 0.20
      };

      function getEnsayoById(id){
        return ensayos.find(e => String(e.id) === String(id)) || null;
      }

      function getMetaROI(cultivo){
        const key = String(cultivo || "").trim().toLowerCase();
        return metasROI[key] ?? 0.30;
      }

      function getPotentialSurface(ensayoId){
        const lista = oportunidades.filter(o => String(o.ensayo) === String(ensayoId));
        return lista.reduce((acc, o) => {
          return acc + Number(o.superficiePotencial || o.area || 0);
        }, 0);
      }

      function countEvaluacionesEnsayo(ensayoId){
        return resultados.filter(r => String(r.ensayo_id) === String(ensayoId)).length;
      }

      function cargarEnsayos(){
        ensayos = getData("ensayos");
        $("ensayoSelect").innerHTML = "";

        ensayos.forEach(e => {
          $("ensayoSelect").innerHTML += `<option value="${e.id}">${ensayoLabel(e)}</option>`;
        });

        if(ensayos.length){
          mostrarContextoEnsayo();
        } else {
          $("contextoEnsayo").innerHTML = `<p class="empty">No hay ensayos capturados todavía.</p>`;
        }
      }

      function mostrarContextoEnsayo(){
        const ensayo = getEnsayoById($("ensayoSelect").value);

        if(!ensayo){
          $("contextoEnsayo").innerHTML = `<p class="empty">Selecciona un ensayo.</p>`;
          return;
        }

        const superficieEnsayoHa = parseSurfaceHa(ensayo.superficie);
        const superficiePotencial = getPotentialSurface(ensayo.id);
        const metaROI = getMetaROI(ensayo.cultivo);
        const evaluaciones = countEvaluacionesEnsayo(ensayo.id);

        $("contextoEnsayo").innerHTML = `
          <div class="grid">
            <div class="mini">
              <div>Folio</div>
              <b>${ensayo.id}</b>
            </div>
            <div class="mini">
              <div>Objetivo del ensayo</div>
              <b style="font-size:16px;">${ensayo.objetivo || "Sin objetivo"}</b>
            </div>
            <div class="mini">
              <div>Superficie del ensayo</div>
              <b>${superficieEnsayoHa > 0 ? formatNum(superficieEnsayoHa) + " ha" : "No definida"}</b>
            </div>
            <div class="mini">
              <div>Superficie potencial productor</div>
              <b>${superficiePotencial > 0 ? formatNum(superficiePotencial) + " ha" : "N/D"}</b>
            </div>
            <div class="mini">
              <div>Meta ROI cultivo</div>
              <b>${formatPct(metaROI * 100)}</b>
            </div>
            <div class="mini">
              <div>Evaluaciones históricas</div>
              <b>${evaluaciones}</b>
            </div>
          </div>
        `;
      }

      function analyzeObjective(objetivo, porcentaje, rendTratado, calidadComercial){
        if(!objetivo || !String(objetivo).trim()){
          return {
            estado: "Sin objetivo definido",
            clase: "muted",
            detalle: "No existe objetivo capturado en la ficha del ensayo."
          };
        }

        const txt = String(objetivo).toLowerCase();
        const pctMatch = String(objetivo).match(/(\d+(?:[.,]\d+)?)\s*%/);
        const tonMatch = String(objetivo).match(/(\d+(?:[.,]\d+)?)\s*(?:ton\/ha|t\/ha)/i);

        if(pctMatch && (txt.includes("control") || txt.includes("mejor") || txt.includes("increment"))){
          const meta = parseFloat(String(pctMatch[1]).replace(",", "."));
          const cumplido = porcentaje >= meta;

          return {
            estado: cumplido ? "Cumplido" : "No cumplido",
            clase: cumplido ? "green" : "red",
            detalle: `Objetivo prometido: +${formatNum(meta)}% vs control | Resultado real: ${formatPct(porcentaje)}`
          };
        }

        if(tonMatch && txt.includes("rend")){
          const metaTon = parseFloat(String(tonMatch[1]).replace(",", "."));
          const cumplido = rendTratado >= metaTon;

          return {
            estado: cumplido ? "Cumplido" : "No cumplido",
            clase: cumplido ? "green" : "red",
            detalle: `Objetivo prometido: ${formatNum(metaTon)} ton/ha | Resultado real: ${formatNum(rendTratado)} ton/ha`
          };
        }

        if((txt.includes("calidad") || txt.includes("calibre")) && calidadComercial){
          return {
            estado: "Revisión cualitativa",
            clase: "yellow",
            detalle: `Objetivo prometido: ${objetivo} | Resultado capturado: ${calidadComercial}`
          };
        }

        return {
          estado: "Validación manual",
          clase: "yellow",
          detalle: `Objetivo prometido: ${objetivo} | Resultado real: ${formatPct(porcentaje)} de mejora`
        };
      }

      function evaluar(roi, diferencia, metaROI){
        if(diferencia < 0){
          return {
            evaluacion: "No exitoso",
            recomendacion: "Detener inmediatamente",
            repetir: "No"
          };
        }

        if(roi < 0){
          return {
            evaluacion: "No exitoso",
            recomendacion: "No escalar, revisar causa",
            repetir: "No"
          };
        }

        if(roi < metaROI){
          return {
            evaluacion: "Parcial",
            recomendacion: "Ajustar variables",
            repetir: "Sí"
          };
        }

        return {
          evaluacion: "Exitoso",
          recomendacion: "Escalar comercialmente",
          repetir: "Sí"
        };
      }

      function calcular(){
        const ensayo = getEnsayoById($("ensayoSelect").value);
        if(!ensayo){
          alert("Selecciona un ensayo válido.");
          return;
        }

        const superficieEnsayoHa = parseSurfaceHa(ensayo.superficie);
        if(superficieEnsayoHa <= 0){
          alert("La ficha del ensayo no tiene una superficie válida. Captura una superficie del ensayo en index.html para poder calcular el ROI real.");
          return;
        }

        const superficiePotencialHa = getPotentialSurface(ensayo.id);
        const metaROI = getMetaROI(ensayo.cultivo);

        const rc = parseNumber($("rendControl").value);
        const rt = parseNumber($("rendTratado").value);

        const semillasVal = parseNumber($("semillas").value);
        const ins = parseNumber($("insumos").value);
        const mat = parseNumber($("material").value);
        const hrs = parseNumber($("horas").value);
        const costoHr = parseNumber($("costoHora").value);
        const tras = parseNumber($("traslados").value);
        const otr = parseNumber($("otros").value);

        const precioVal = parseNumber($("precio").value);
        const costoProd = parseNumber($("costoProduccion").value);

        const calidadComercial = $("calidadComercial").value.trim();
        const incidenciaPlaga = parseNumber($("incidenciaPlaga").value);

        const variedadEvaluada = $("variedadEvaluada").value.trim();
        const tipoEnsayoGalera = $("tipoEnsayoGalera").value;
        const casaComercial = $("casaComercial").value.trim();
        const condicionCultivo = $("condicionCultivo").value.trim();
        const densidadPlantasHa = parseNumber($("densidadPlantasHa").value);
        const sanidadGeneral = $("sanidadGeneral").value.trim();
        const uniformidadPlanta = $("uniformidadPlanta").value.trim();
        const madurez = $("madurez").value.trim();
        const color = $("color").value.trim();
        const forma = $("forma").value.trim();
        const calibreTamano = $("calibreTamano").value.trim();
        const diametroProductoCm = parseNumber($("diametroProductoCm").value);
        const tamanoTalloCm = parseNumber($("tamanoTalloCm").value);
        const pesoProductoG = parseNumber($("pesoProductoG").value);
        let porcentajeCosecha = parseNumber($("porcentajeCosecha").value);
        if(porcentajeCosecha > 1) porcentajeCosecha = porcentajeCosecha / 100;
        const enfermedadObservada = $("enfermedadObservada").value.trim();
        const ventajaPrincipal = $("ventajaPrincipal").value.trim();
        const desventajaPrincipal = $("desventajaPrincipal").value.trim();
        const comparacionVsTestigo = $("comparacionVsTestigo").value.trim();
        const recomendacionComercial = $("recomendacionComercial").value;
        const estatusFinalGalera = $("estatusFinalGalera").value.trim();
        const conclusionDistribuidor = $("conclusionDistribuidor").value.trim();
        const notasFinalesResultado = $("notasFinalesResultado").value.trim();

        const scoreSanidad = technicalScoreText(sanidadGeneral);
        const scoreUniformidad = technicalScoreText(uniformidadPlanta);
        const scoreCosecha = porcentajeCosecha ? clampScore(porcentajeCosecha * 5) : 0;
        const scoreEstatus = technicalScoreText(estatusFinalGalera || recomendacionComercial);
        const scoreTecnicoComercial = [scoreSanidad, scoreUniformidad, scoreCosecha, scoreEstatus].filter(n => n > 0).reduce((a,b)=>a+b,0) / Math.max(1, [scoreSanidad, scoreUniformidad, scoreCosecha, scoreEstatus].filter(n => n > 0).length);

        const costoHoras = hrs * costoHr;
        const diferencia = rt - rc;
        const porcentaje = rc ? (diferencia / rc) * 100 : 0;
        const diferenciaKgHa = diferencia * 1000;
        const margenUnitario = precioVal - costoProd;

        const margenPorHa = diferenciaKgHa * margenUnitario;
        const margenEnsayo = margenPorHa * superficieEnsayoHa;
        const proyeccionPotencial = superficiePotencialHa > 0 ? margenPorHa * superficiePotencialHa : 0;

        const costoTotal = semillasVal + ins + mat + costoHoras + tras + otr;
        const roi = costoTotal ? (margenEnsayo - costoTotal) / costoTotal : 0;

        const analisisObjetivo = analyzeObjective(
          ensayo.objetivo,
          porcentaje,
          rt,
          calidadComercial
        );

        const decision = evaluar(roi, diferencia, metaROI);

        tmp = {
          objetivoEnsayo: ensayo.objetivo || "",
          superficieEnsayoHa,
          superficiePotencialHa,
          metaROICultivo: metaROI,
          rendControl: rc,
          rendTratado: rt,
          calidadComercial,
          incidenciaPlaga,
          variedad_evaluada: variedadEvaluada,
          tipo_ensayo_galera: tipoEnsayoGalera,
          es_control: normalizeHeader(tipoEnsayoGalera) === "comercial",
          casa_comercial: casaComercial,
          condicion_cultivo: condicionCultivo,
          densidad_plantas_ha: densidadPlantasHa,
          sanidad_general: sanidadGeneral,
          uniformidad_planta: uniformidadPlanta,
          madurez,
          color,
          forma,
          calibre_tamano: calibreTamano,
          diametro_producto_cm: diametroProductoCm,
          tamano_tallo_cm: tamanoTalloCm,
          peso_producto_g: pesoProductoG,
          porcentaje_cosecha: porcentajeCosecha,
          enfermedades_observadas: enfermedadObservada,
          enfermedad_observada: enfermedadObservada,
          ventaja_principal: ventajaPrincipal,
          desventaja_principal: desventajaPrincipal,
          comparacion_vs_testigo: comparacionVsTestigo,
          recomendacion_comercial: recomendacionComercial,
          estatus_final_galera: estatusFinalGalera,
          conclusion_distribuidor: conclusionDistribuidor,
          notas_finales_resultado: notasFinalesResultado,
          score_sanidad: scoreSanidad,
          score_uniformidad: scoreUniformidad,
          score_cosecha: scoreCosecha,
          score_estatus_final: scoreEstatus,
          score_tecnico_comercial: scoreTecnicoComercial,
          semillas: semillasVal,
          insumos: ins,
          material: mat,
          horas: hrs,
          costoHora: costoHr,
          costoHoras,
          traslados: tras,
          otros: otr,
          precio: precioVal,
          costoProduccion: costoProd,
          diferencia,
          diferenciaKgHa,
          porcentaje,
          margenUnitario,
          margenPorHa,
          margenEnsayo,
          proyeccionPotencial,
          costoTotal,
          roi,
          objetivoEstado: analisisObjetivo.estado,
          objetivoDetalle: analisisObjetivo.detalle,
          objetivoClase: analisisObjetivo.clase,
          ...decision
        };

        const roiClass = roi >= metaROI ? "green" : roi >= 0 ? "yellow" : "red";

        $("kpis").innerHTML = `
          <div class="kpi">🎯 Objetivo del ensayo: <b>${ensayo.objetivo || "Sin objetivo"}</b></div>
          <div class="kpi ${analisisObjetivo.clase}">Objetivo prometido vs resultado real: <b>${analisisObjetivo.estado}</b></div>
          <div class="kpi ${analisisObjetivo.clase}">${analisisObjetivo.detalle}</div>
          ${variedadEvaluada ? `<div class="kpi">🧬 Variedad evaluada: <b>${variedadEvaluada}</b> <span class="badge">${tipoEnsayoGalera || "Manual"}</span></div>` : ""}
          ${sanidadGeneral || uniformidadPlanta || pesoProductoG ? `<div class="kpi">🔬 Score técnico-comercial: <b>${formatNum(scoreTecnicoComercial)} / 5</b></div>` : ""}
          ${comparacionVsTestigo ? `<div class="kpi">⚖️ Comparación vs testigo: <b>${comparacionVsTestigo}</b></div>` : ""}
          <hr>
          <div class="kpi">📈 Diferencia: <b>${formatNum(diferencia)} ton/ha</b></div>
          <div class="kpi">📊 Mejora vs control: <b>${formatPct(porcentaje)}</b></div>
          <div class="kpi">🌾 Rendimiento tratado: <b>${formatNum(rt)} ton/ha</b></div>
          <div class="kpi">🌱 Rendimiento control: <b>${formatNum(rc)} ton/ha</b></div>
          <div class="kpi">📏 Superficie ensayo: <b>${formatNum(superficieEnsayoHa)} ha</b></div>
          <div class="kpi">📏 Superficie potencial productor: <b>${superficiePotencialHa > 0 ? formatNum(superficiePotencialHa) + " ha" : "N/D"}</b></div>
          <div class="kpi">💰 Margen incremental por ha: <b>${formatMoney(margenPorHa)}</b></div>
          <div class="kpi">💰 Margen incremental total del ensayo: <b>${formatMoney(margenEnsayo)}</b></div>
          <div class="kpi">🚀 Impacto potencial proyectado: <b>${superficiePotencialHa > 0 ? formatMoney(proyeccionPotencial) : "N/D"}</b></div>
          <div class="kpi">💸 Costo total ensayo: <b>${formatMoney(costoTotal)}</b></div>
          <div class="kpi ${roiClass}">ROI real del ensayo: <b>${formatPct(roi * 100)}</b> <span class="badge">Meta cultivo: ${formatPct(metaROI * 100)}</span></div>
          <hr>
          <div class="kpi">📊 Evaluación: <b>${decision.evaluacion}</b></div>
          <div class="kpi">🧠 Recomendación: <b>${decision.recomendacion}</b></div>
          <div class="kpi">🔁 Repetir ensayo: <b>${decision.repetir}</b></div>
        `;
      }
