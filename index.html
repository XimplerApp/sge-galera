<!DOCTYPE html>
<html>
<head>
  <title>Registro de Ensayos - Galera</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
    h1 {color:#38bdf8;}
    .container {max-width:1000px; margin:auto;}
    .card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}
    input, select {
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:6px;
      border:none;
    }
    button {
      padding:12px;
      background:#38bdf8;
      border:none;
      border-radius:6px;
      cursor:pointer;
      width:100%;
      font-size:16px;
    }
    table {
      width:100%;
      border-collapse: collapse;
      margin-top:20px;
    }
    th, td {
      padding:10px;
      border:1px solid #334155;
      text-align:left;
    }
    th {background:#1e293b;}
  </style>
</head>

<body>

<div class="container">

<h1>🚀 Registro de Ensayos - Galera</h1>

<div class="card">

<h2>Nuevo Ensayo</h2>

<input id="tecnico" placeholder="Técnico responsable">
<input id="region" placeholder="Región">
<input id="cultivo" placeholder="Cultivo (Tomate, Pimiento...)">
<input id="objetivo" placeholder="Objetivo del ensayo">

<input id="ciclo" placeholder="Ciclo agrícola">

<select id="sistema">
  <option>Campo abierto</option>
  <option>Invernadero</option>
</select>

<input id="suelo" placeholder="Tipo de suelo">
<input id="riego" placeholder="Sistema de riego">

<label>Fecha siembra</label>
<input type="date" id="siembra">

<label>Fecha cosecha estimada</label>
<input type="date" id="cosecha">

<input id="variedadTratada" placeholder="Variedad tratada (Galera)">
<input id="variedadControl" placeholder="Variedad control">
<input id="proveedor" placeholder="Proveedor control">

<input id="superficie" placeholder="Superficie (ha o m²)">
<input id="productor" placeholder="Productor">

<select id="estado">
  <option>Planeado</option>
  <option>Activo</option>
  <option>Terminado</option>
</select>

<button onclick="guardar()">Guardar Ensayo</button>

</div>

<div class="card">
<h2>Ensayos Registrados</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Cultivo</th>
<th>Variedad</th>
<th>Región</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>
</div>

</div>

<script>

let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];

function guardar(){

  let ensayo = {
    id: Date.now(),
    tecnico: tecnico.value,
    region: region.value,
    cultivo: cultivo.value,
    objetivo: objetivo.value,
    ciclo: ciclo.value,
    sistema: sistema.value,
    suelo: suelo.value,
    riego: riego.value,
    siembra: siembra.value,
    cosecha: cosecha.value,
    variedadTratada: variedadTratada.value,
    variedadControl: variedadControl.value,
    proveedor: proveedor.value,
    superficie: superficie.value,
    productor: productor.value,
    estado: estado.value
  };

  ensayos.push(ensayo);

  localStorage.setItem("ensayos", JSON.stringify(ensayos));

  render();
}

function render(){

  let tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  ensayos.forEach(e => {
    tabla.innerHTML += `
      <tr>
        <td>${e.id}</td>
        <td>${e.cultivo}</td>
        <td>${e.variedadTratada}</td>
        <td>${e.region}</td>
        <td>${e.estado}</td>
      </tr>
    `;
  });
}

render();

</script>

</body>
</html>
