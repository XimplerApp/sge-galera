<!DOCTYPE html>
<html>
<head>
<title>Innovación Varietal 3.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
h1 {color:#38bdf8;}

.card {
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

.kpi {font-size:18px; margin:5px 0;}

.green {color:#22c55e;}
.yellow {color:#facc15;}
.red {color:#ef4444;}

table {
  width:100%;
  border-collapse: collapse;
  text-align:center;
}

th, td {
  padding:10px;
  border-bottom:1px solid #334155;
}
</style>
</head>

<body>

<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
  <a href="resultados.html"><button>📊 Resultados</button></a>
  <a href="pipeline.html"><button>🌱 Pipeline</button></a>
  <a href="innovacion_v3.html"><button>🚀 Innovación 3.0</button></a>
</div>

<h1>🚀 Innovación Varietal 3.0</h1>

<!-- PANEL -->
<div class="card">
<h2>🧠 Panel Ejecutivo</h2>
<div id="panel"></div>
<hr>
<div id="insight"></div>
</div>

<!-- RANKING -->
<div class="card">
<h2>📊 Ranking Inteligente</h2>
<table id="tabla">
<tr>
<th>#</th>
<th>Variedad</th>
<th>ROI</th>
<th>Ventas</th>
<th>Leads</th>
<th>Conversión</th>
<th>Estado</th>
</tr>
</table>
</div>

<!-- RADAR -->
<div class="card">
<h2>🧠 Radar Varietal</h2>
<select id="selectorVariedad"></select>
<canvas id="radar"></canvas>
</div>

<!-- RICE -->
<div class="card">
<h2>🎯 Prioridad Estratégica (RICE)</h2>
<div id="rice"></div>
</div>

<script>

let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];
let resultados = JSON.parse(localStorage.getItem("resultados")) || [];
let oportunidades = JSON.parse(localStorage.getItem("oportunidades")) || [];

// ===== ESTADO INTELIGENTE =====
function estadoEnsayo(e){
  let tieneResultado = resultados.some(r => r.ensayo_id == e.id);
  let tienePipeline = oportunidades.some(o => o.ensayo == e.id);

  if(tieneResultado && tienePipeline) return "Activo";
  if(!tieneResultado) return "En desarrollo";
  return "Sin impacto";
}

// ===== PANEL =====
function panel(){

  let activos = ensayos.filter(e => estadoEnsayo(e) === "Activo").length;

  let roiProm = resultados.length
    ? resultados.reduce((a,b)=>a+b.roi,0)/resultados.length
    : 0;

  let ventas = oportunidades.reduce((a,b)=>a+b.ventaCerrada,0);
  let leads = oportunidades.reduce((a,b)=>a+b.leads,0);

  let conversion = oportunidades.reduce((a,b)=>a+b.ventaEstimada,0) > 0
    ? (ventas / oportunidades.reduce((a,b)=>a+b.ventaEstimada,0))*100
    : 0;

  document.getElementById("panel").innerHTML = `
    <div class="kpi">🟢 Ensayos Activos: ${activos}</div>
    <div class="kpi">💰 ROI Promedio: ${(roiProm*100).toFixed(2)}%</div>
    <div class="kpi">💵 Ventas: $${ventas.toLocaleString()}</div>
    <div class="kpi">📈 Conversión: ${conversion.toFixed(2)}%</div>
  `;

  generarInsight(roiProm, conversion);
}

// ===== INSIGHT GENERAL =====
function generarInsight(roi, conversion){

  let texto = "";

  if(roi > 0.3 && conversion < 20){
    texto = "⚠️ Buen rendimiento técnico, pero baja conversión comercial.";
  }
  else if(roi < 0.3 && conversion > 25){
    texto = "📈 Buena conversión, pero bajo ROI. Revisar costos.";
  }
  else if(roi > 0.5 && conversion > 25){
    texto = "🔥 Variedades con alto potencial de escalamiento inmediato.";
  }
  else{
    texto = "ℹ️ Portafolio en desarrollo.";
  }

  document.getElementById("insight").innerHTML = `<b>${texto}</b>`;
}

// ===== AGRUPAR =====
function agrupar(){

  let mapa = {};

  ensayos.forEach(e => {

    let v = (e.variedad_tratada || "N/A").toLowerCase().trim();

    if(!mapa[v]){
      mapa[v] = {ensayos:0, roi:0, ventas:0, leads:0, estimado:0};
    }

    mapa[v].ensayos++;

    resultados.filter(r=>r.ensayo_id==e.id).forEach(r=>{
      mapa[v].roi += r.roi;
    });

    oportunidades.filter(o=>o.ensayo==e.id).forEach(o=>{
      mapa[v].ventas += o.ventaCerrada;
      mapa[v].leads += o.leads;
      mapa[v].estimado += o.ventaEstimada;
    });

  });

  return mapa;
}

// ===== CLASIFICACIÓN =====
function clasificar(roi, conv){

  if(roi > 0.5 && conv > 25) return ["⭐ Escalar","green"];
  if(roi > 0.3) return ["🚀 Promesa","yellow"];
  if(roi >= 0) return ["⚠️ Experimental","yellow"];
  return ["❌ Descartar","red"];
}

// ===== RADAR =====
let radarChart;

function cargarSelector(data){

  let select = document.getElementById("selectorVariedad");
  select.innerHTML = "";

  Object.keys(data).forEach(v=>{
    select.innerHTML += `<option value="${v}">${v}</option>`;
  });

  select.onchange = ()=>dibujarRadar(data, select.value);

  dibujarRadar(data, select.value);
}

function dibujarRadar(data, variedad){

  let d = data[variedad];
  if(!d) return;

  let roi = d.ensayos ? d.roi / d.ensayos : 0;
  let conv = d.estimado ? (d.ventas/d.estimado)*100 : 0;

  let dataset = [
    Math.min(5, roi*10),
    Math.min(5, conv/10),
    Math.min(5, d.ventas/100000),
    Math.min(5, d.leads/10)
  ];

  let ctx = document.getElementById("radar");

  if(radarChart) radarChart.destroy();

  radarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ["ROI","Conversión","Adopción","Interés"],
      datasets: [{
        label: variedad,
        data: dataset
      }]
    },
    options: {
      scales: { r: {beginAtZero:true, max:5} }
    }
  });
}

// ===== RICE =====
function calcularRICE(data){

 let html = "";

  Object.keys(data).forEach(v=>{

    let d = data[v];

    // 🔥 SCORE MEJORADO
    let score = ((d.leads + 1) * (d.ventas + 1) * (d.ensayos + 1)) / ((d.estimado || 0) + 1);

    // ===== CLASIFICACIÓN INTELIGENTE =====
    let decision = "";
    let clase = "";

    if(score > 50000){
      decision = "🔥 Invertir fuerte (Escalar YA)";
      clase = "green";
    }
    else if(score > 10000){
      decision = "🟢 Apostar (Alta prioridad)";
      clase = "green";
    }
    else if(score > 1000){
      decision = "🟡 Explorar (Validar más)";
      clase = "yellow";
    }
    else if(score > 100){
      decision = "⚠️ Bajo potencial (Revisar)";
      clase = "yellow";
    }
    else{
      decision = "🔴 No invertir (Descartar o pausar)";
      clase = "red";
    }

    // ===== DIAGNÓSTICO =====
    let diagnostico = "";

    if(d.leads == 0){
      diagnostico = "Sin interés de mercado";
    }
    else if(d.ventas == 0){
      diagnostico = "Interés sin conversión";
    }
    else if(d.estimado > d.ventas){
      diagnostico = "Baja rentabilidad";
    }
    else{
      diagnostico = "Buen desempeño";
    }

    html += `
      <div class="card">
        <div class="kpi"><b>${v}</b></div>
        <div class="kpi">Score: ${score.toFixed(2)}</div>
        <div class="kpi ${clase}"><b>${decision}</b></div>
        <div class="kpi">🧠 ${diagnostico}</div>
      </div>
    `;
  });

  document.getElementById("rice").innerHTML = html;

}

// ===== INSIGHTS AVANZADOS =====
function insightsAvanzados(arr){

  let texto = "<b>Insights clave:</b><br>";

  arr.forEach(x=>{

    if(x.roi > 0.5 && x.conv < 20){
      texto += `⚠️ ${x.v}: buen ROI pero mala conversión<br>`;
    }

    if(x.roi < 0.3 && x.conv > 25){
      texto += `📈 ${x.v}: vende bien pero baja rentabilidad<br>`;
    }

    if(x.roi > 0.5 && x.conv > 30){
      texto += `🔥 ${x.v}: VARIEDAD ESTRELLA<br>`;
    }

  });

  document.getElementById("insight").innerHTML += `<hr>${texto}`;
}

// ===== RENDER =====
function render(){

  panel();

  let data = agrupar();

  let arr = Object.keys(data).map(v => {

    let d = data[v];
    let roi = d.ensayos ? d.roi / d.ensayos : 0;
    let conv = d.estimado ? (d.ventas/d.estimado)*100 : 0;

    return {v, roi, ventas:d.ventas, leads:d.leads, conv};
  });

  arr.sort((a,b)=>b.roi - a.roi);

  let tabla = document.getElementById("tabla");

  arr.forEach((x,i)=>{

    let [texto,clase] = clasificar(x.roi, x.conv);

    tabla.innerHTML += `
    <tr>
      <td>${i+1}</td>
      <td>${x.v}</td>
      <td>${(x.roi*100).toFixed(2)}%</td>
      <td>$${x.ventas.toLocaleString()}</td>
      <td>${x.leads}</td>
      <td>${x.conv.toFixed(2)}%</td>
      <td class="${clase}"><b>${texto}</b></td>
    </tr>
    `;
  });

  cargarSelector(data);
  calcularRICE(data);
  insightsAvanzados(arr);
}

render();

</script>

</body>
</html>
