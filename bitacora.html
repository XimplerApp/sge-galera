<!DOCTYPE html>
<html>
<head>
  <title>Bitácora de Ensayos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
    h1 {color:#38bdf8;}
    .card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}
    input, select {width:100%; padding:10px; margin:8px 0; border-radius:6px; border:none;}
    button {padding:8px; margin:3px; border:none; border-radius:6px; cursor:pointer;}
    .export {background:#22c55e;}
    .edit {background:#f59e0b;}
    .delete {background:#ef4444;}
    #map {height:300px; border-radius:10px; margin-top:10px;}
    img {max-width:100%; border-radius:10px; margin-top:10px;}
  </style>
</head>

<body>

<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
</div>

<h1>📸 Bitácora de Ensayos</h1>

<div class="card">

<h2 id="modo">Nuevo Registro</h2>

<select id="ensayoSelect"></select>
<input id="responsable" placeholder="Responsable">

<select id="etapa">
  <option>Siembra</option>
  <option>Desarrollo</option>
  <option>Cosecha</option>
</select>

<input id="comentario" placeholder="Observación">

<input type="file" id="foto">

<h3>Ubicación (opcional)</h3>
<div id="map"></div>
<p id="coords"></p>

<button onclick="guardarBitacora()">Guardar</button>

</div>

<div class="card">

<h2>Filtros</h2>

<input id="filtroId" placeholder="ID Ensayo">
<input id="filtroTecnico" placeholder="Técnico">
<input id="filtroCultivo" placeholder="Cultivo">
<input id="filtroVariedad" placeholder="Variedad">

<button onclick="render()">Aplicar Filtros</button>
<button onclick="limpiarFiltros()">Limpiar</button>

</div>

<div class="card">

<h2>Timeline</h2>
<button class="export" onclick="exportarExcel()">📊 Exportar</button>

<div id="timeline"></div>

</div>

<script>

let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];
let bitacora = JSON.parse(localStorage.getItem("bitacora")) || [];

let editId = null;
let lat=null, lng=null;
let marker;

// cargar ensayos
function cargarEnsayos(){
  ensayoSelect.innerHTML="";
  ensayos.forEach(e=>{
    ensayoSelect.innerHTML+=`<option value="${e.id}">
      ${e.cultivo} - ${e.variedad_tratada}
    </option>`;
  });
}

// mapa
let map = L.map('map').setView([23.6,-102.5],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('click', function(e){
  lat=e.latlng.lat;
  lng=e.latlng.lng;

  if(marker) map.removeLayer(marker);
  marker=L.marker([lat,lng]).addTo(map);

  coords.innerText=`Lat: ${lat.toFixed(4)} | Lng: ${lng.toFixed(4)}`;
});

// guardar
function guardarBitacora(){

  if(!responsable.value){
    alert("Responsable requerido");
    return;
  }

  let file = foto.files[0];

  if(file){
    let reader = new FileReader();
    reader.onload = ()=>guardarRegistro(reader.result);
    reader.readAsDataURL(file);
  } else {
    guardarRegistro(null);
  }
}

function guardarRegistro(fotoBase64){

  let registro = {
    id: editId || Date.now(),
    ensayo_id: ensayoSelect.value,
    responsable: responsable.value,
    etapa: etapa.value,
    comentario: comentario.value,
    foto: fotoBase64,
    lat, lng,
    fecha: new Date().toLocaleString()
  };

  if(editId){
    bitacora = bitacora.map(b=>b.id==editId?registro:b);
  } else {
    bitacora.push(registro);
  }

  localStorage.setItem("bitacora", JSON.stringify(bitacora));

  limpiarFormulario();
  render();
}

// editar
function editar(id){
  let b = bitacora.find(x=>x.id==id);

  editId=id;
  modo.innerText="Editar Registro";

  ensayoSelect.value=b.ensayo_id;
  responsable.value=b.responsable;
  etapa.value=b.etapa;
  comentario.value=b.comentario;

  lat=b.lat;
  lng=b.lng;

  if(lat){
    marker=L.marker([lat,lng]).addTo(map);
    coords.innerText=`Lat: ${lat} | Lng: ${lng}`;
  }
}

// eliminar
function eliminar(id){
  if(confirm("Eliminar registro?")){
    bitacora = bitacora.filter(b=>b.id!=id);
    localStorage.setItem("bitacora", JSON.stringify(bitacora));
    render();
  }
}

// filtros
function limpiarFiltros(){
  filtroId.value="";
  filtroTecnico.value="";
  filtroCultivo.value="";
  filtroVariedad.value="";
  render();
}

// render
function render(){

  let lista = bitacora;

  lista = lista.filter(b=>{
    let e = ensayos.find(x=>x.id==b.ensayo_id);

    return (!filtroId.value || b.ensayo_id==filtroId.value)
    && (!filtroTecnico.value || e?.tecnico?.includes(filtroTecnico.value))
    && (!filtroCultivo.value || e?.cultivo?.includes(filtroCultivo.value))
    && (!filtroVariedad.value || e?.variedad_tratada?.includes(filtroVariedad.value));
  });

  timeline.innerHTML="";

  lista.slice().reverse().forEach(b=>{
    let e=ensayos.find(x=>x.id==b.ensayo_id);

    timeline.innerHTML+=`
    <div class="card">
      <h3>${e?.cultivo || ""} - ${e?.variedad_tratada || ""}</h3>
      <p><b>Responsable:</b> ${b.responsable}</p>
      <p>${b.comentario}</p>
      <p>${b.fecha}</p>

      ${b.lat? `<p>${b.lat.toFixed(4)}, ${b.lng.toFixed(4)}</p>`:""}
      ${b.foto? `<img src="${b.foto}">`:""}

      <button class="edit" onclick="editar(${b.id})">✏️</button>
      <button class="delete" onclick="eliminar(${b.id})">🗑</button>
    </div>
    `;
  });
}

// export
function exportarExcel(){
  let data = bitacora.map(b=>({
    "Ensayo": b.ensayo_id,
    "Responsable": b.responsable,
    "Etapa": b.etapa,
    "Comentario": b.comentario,
    "Lat": b.lat || "",
    "Lng": b.lng || "",
    "Fecha": b.fecha
  }));

  let ws = XLSX.utils.json_to_sheet(data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bitacora");

  XLSX.writeFile(wb, "Bitacora.xlsx");
}

// limpiar
function limpiarFormulario(){
  editId=null;
  modo.innerText="Nuevo Registro";

  responsable.value="";
  comentario.value="";
  foto.value="";
  lat=null;
  lng=null;
  coords.innerText="";
  if(marker) map.removeLayer(marker);
}

cargarEnsayos();
render();

</script>

</body>
</html>
