<!DOCTYPE html>
<html>
<head>
  <title>Bitácora de Ensayos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
    h1 {color:#38bdf8;}
    .card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}
    input, select {
      width:100%; padding:10px; margin:8px 0; border-radius:6px; border:none;
    }
    button {
      padding:10px; background:#38bdf8; border:none; border-radius:6px; cursor:pointer;
    }
    .export {background:#22c55e;}
    #map {height:300px; border-radius:10px; margin-top:10px;}
    img {max-width:100%; border-radius:10px; margin-top:10px;}
  </style>
</head>

<body>

<!-- NAV -->
<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
</div>

<h1>📸 Bitácora de Ensayos</h1>

<div class="card">

<h2>Nuevo Registro</h2>

<select id="ensayoSelect"></select>

<input id="responsable" placeholder="Nombre del responsable">

<select id="etapa">
  <option>Siembra</option>
  <option>Desarrollo</option>
  <option>Cosecha</option>
</select>

<input id="comentario" placeholder="Observación técnica">

<label>Foto (opcional)</label>
<input type="file" id="foto">

<h3>Ubicación (opcional)</h3>
<div id="map"></div>
<p id="coords"></p>

<button onclick="guardarBitacora()">Guardar</button>

</div>

<div class="card">

<h2>Timeline</h2>
<button class="export" onclick="exportarExcel()">📊 Exportar a Excel</button>

<div id="timeline"></div>

</div>

<script>

// ====== DATA ======
let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];
let bitacora = JSON.parse(localStorage.getItem("bitacora")) || [];

let lat = null;
let lng = null;

// ====== CARGAR ENSAYOS ======
function cargarEnsayos(){
  let select = document.getElementById("ensayoSelect");
  select.innerHTML = "";

  ensayos.forEach(e=>{
    select.innerHTML += `<option value="${e.id}">
      ${e.cultivo} - ${e.variedad_tratada}
    </option>`;
  });
}

// ====== MAPA ======
let map = L.map('map').setView([23.6345, -102.5528], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker;

map.on('click', function(e){
  lat = e.latlng.lat;
  lng = e.latlng.lng;

  if(marker) map.removeLayer(marker);

  marker = L.marker([lat, lng]).addTo(map);

  document.getElementById("coords").innerText =
    "Lat: " + lat.toFixed(4) + " | Lng: " + lng.toFixed(4);
});

// ====== GUARDAR ======
function guardarBitacora(){

  if(!responsable.value){
    alert("Ingresa el responsable");
    return;
  }

  let file = document.getElementById("foto").files[0];

  if(file){
    let reader = new FileReader();

    reader.onload = function(){
      guardarRegistro(reader.result);
    };

    reader.readAsDataURL(file);

  } else {
    guardarRegistro(null);
  }
}

function guardarRegistro(fotoBase64){

  let registro = {
    id: Date.now(),
    ensayo_id: ensayoSelect.value,
    responsable: responsable.value,
    etapa: etapa.value,
    comentario: comentario.value,
    foto: fotoBase64, // opcional
    lat: lat, // opcional
    lng: lng, // opcional
    fecha: new Date().toLocaleString()
  };

  bitacora.push(registro);
  localStorage.setItem("bitacora", JSON.stringify(bitacora));

  limpiarFormulario();
  render();
}

// ====== LIMPIAR ======
function limpiarFormulario(){
  comentario.value = "";
  responsable.value = "";
  foto.value = "";
  lat = null;
  lng = null;
  coords.innerText = "";

  if(marker) map.removeLayer(marker);
}

// ====== RENDER ======
function render(){

  let div = document.getElementById("timeline");
  div.innerHTML = "";

  bitacora.slice().reverse().forEach(b=>{

    let ensayo = ensayos.find(e => e.id == b.ensayo_id);

    div.innerHTML += `
      <div class="card">
        <h3>${ensayo?.cultivo || ""} - ${ensayo?.variedad_tratada || ""}</h3>
        <p><b>Responsable:</b> ${b.responsable}</p>
        <p><b>Etapa:</b> ${b.etapa}</p>
        <p>${b.comentario}</p>

        ${b.lat ? `<p><b>Ubicación:</b> ${b.lat.toFixed(4)}, ${b.lng.toFixed(4)}</p>` : ""}

        <p><small>${b.fecha}</small></p>

        ${b.foto ? `<img src="${b.foto}">` : ""}
      </div>
    `;
  });
}

// ====== EXPORT ======
function exportarExcel(){

  let data = bitacora.map(b => ({
    "Ensayo ID": b.ensayo_id,
    "Responsable": b.responsable,
    "Etapa": b.etapa,
    "Comentario": b.comentario,
    "Latitud": b.lat || "",
    "Longitud": b.lng || "",
    "Fecha": b.fecha
  }));

  let ws = XLSX.utils.json_to_sheet(data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bitacora");

  XLSX.writeFile(wb, "Bitacora_Galera.xlsx");
}

// ====== INIT ======
cargarEnsayos();
render();

</script>

</body>
</html>
