<!DOCTYPE html>
<html>
<head>
<title>Pipeline Comercial</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
h1 {color:#38bdf8;}

.card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}

input, select {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:none;
}

button {
    padding:8px;
    margin:3px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.save {background:#22c55e;}
.delete {background:#ef4444;}

.kpi {font-size:18px; margin:5px 0;}
.green {color:#22c55e;}
.red {color:#ef4444;}

table {
    width:100%;
    border-collapse: collapse;
}

th, td {
    padding:8px;
    border-bottom:1px solid #334155;
}
</style>
</head>

<body>

<!-- MENU -->
<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
  <a href="resultados.html"><button>📊 Resultados</button></a>
  <a href="pipeline.html"><button>📈 Pipeline</button></a>
</div>

<h1>📈 Pipeline Comercial de Ensayos</h1>

<!-- DASHBOARD -->
<div class="card">
<h2>📊 Dashboard por Ensayo</h2>

<select id="filtroEnsayo"></select>

<div id="dashboard"></div>
</div>

<!-- OPORTUNIDADES -->
<div class="card">

<h2>📋 Oportunidades Comerciales</h2>

<select id="idEnsayo"></select>

<select id="interesado">
<option value="Sí">Productor interesado: Sí</option>
<option value="No">Productor interesado: No</option>
</select>

<input id="area" placeholder="Área potencial (ha)">
<input id="leads" placeholder="Leads generados">
<input id="ventaEstimada" placeholder="Venta estimada $">
<input id="ventaCerrada" placeholder="Venta cerrada $">

<button class="save" onclick="guardar()">Agregar</button>

<table id="tabla">
<tr>
<th>Ensayo</th>
<th>Interesado</th>
<th>Área</th>
<th>Leads</th>
<th>Venta Estimada</th>
<th>Venta Cerrada</th>
<th></th>
</tr>
</table>

</div>

<script>

// ===== DATA =====
let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];
let oportunidades = JSON.parse(localStorage.getItem("oportunidades")) || [];

// ===== CARGAR ENSAYOS =====
function cargarEnsayos(){

    idEnsayo.innerHTML="";
    filtroEnsayo.innerHTML='<option value="">Todos los ensayos</option>';

    ensayos.forEach(e=>{

        let texto = `${e.id} | ${e.cultivo} | ${e.variedad_tratada} | ${e.productor}`;

        idEnsayo.innerHTML += `<option value="${e.id}">${texto}</option>`;
        filtroEnsayo.innerHTML += `<option value="${e.id}">${texto}</option>`;
    });
}

// ===== GUARDAR =====
function guardar(){

    let data = {
        id: Date.now(),
        ensayo: idEnsayo.value,
        interesado: interesado.value,
        area: +area.value || 0,
        leads: +leads.value || 0,
        ventaEstimada: +ventaEstimada.value || 0,
        ventaCerrada: +ventaCerrada.value || 0
    };

    oportunidades.push(data);
    localStorage.setItem("oportunidades", JSON.stringify(oportunidades));

    render();
}

// ===== ELIMINAR =====
function eliminar(id){
    oportunidades = oportunidades.filter(o=>o.id!=id);
    localStorage.setItem("oportunidades", JSON.stringify(oportunidades));
    render();
}

// ===== DASHBOARD =====
function calcularDashboard(){

    let lista = oportunidades;

    if(filtroEnsayo.value){
        lista = lista.filter(o=>o.ensayo == filtroEnsayo.value);
    }

    let productores = lista.filter(o=>o.interesado=="Sí").length;
    let leadsTotal = lista.reduce((a,b)=>a+b.leads,0);
    let estimado = lista.reduce((a,b)=>a+b.ventaEstimada,0);
    let ventas = lista.reduce((a,b)=>a+b.ventaCerrada,0);

    let conversion = estimado > 0 ? (ventas/estimado)*100 : 0;

    let clase = conversion >= 25 ? "green" : "red";
    let texto = conversion >= 25 ? "Exitoso" : "Bajo desempeño";

    dashboard.innerHTML = `
    <div class="kpi">👨‍🌾 Productores interesados: ${productores}</div>
    <div class="kpi">📊 Leads generados: ${leadsTotal}</div>
    <div class="kpi">🌱 Área potencial: ${lista.reduce((a,b)=>a+b.area,0)} ha</div>
    <div class="kpi">💰 Venta estimada: $${estimado.toFixed(2)}</div>
    <div class="kpi">💵 Venta cerrada: $${ventas.toFixed(2)}</div>
    <div class="kpi">📈 Conversión: ${conversion.toFixed(2)}%</div>
    <div class="kpi ${clase}">Evaluación: ${texto}</div>
    `;
}

// ===== TABLA =====
function render(){

    tabla.innerHTML = `
    <tr>
    <th>Ensayo</th>
    <th>Interesado</th>
    <th>Área</th>
    <th>Leads</th>
    <th>Venta Estimada</th>
    <th>Venta Cerrada</th>
    <th></th>
    </tr>
    `;

    let lista = oportunidades;

    if(filtroEnsayo.value){
        lista = lista.filter(o=>o.ensayo == filtroEnsayo.value);
    }

    lista.forEach(o=>{
        tabla.innerHTML += `
        <tr>
        <td>${o.ensayo}</td>
        <td>${o.interesado}</td>
        <td>${o.area}</td>
        <td>${o.leads}</td>
        <td>$${o.ventaEstimada}</td>
        <td>$${o.ventaCerrada}</td>
        <td><button class="delete" onclick="eliminar(${o.id})">🗑</button></td>
        </tr>
        `;
    });

    calcularDashboard();
}

// ===== FILTRO =====
filtroEnsayo.addEventListener("change", render);

// ===== INIT =====
cargarEnsayos();
render();

</script>

</body>
</html>
