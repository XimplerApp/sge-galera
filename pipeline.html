<!DOCTYPE html>
<html>
<head>
<title>Pipeline Comercial</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
h1 {color:#38bdf8;}

.card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}

input, select {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:none;
}

button {
    padding:8px;
    margin:3px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.save {background:#22c55e;}
.delete {background:#ef4444;}
.export {background:#22c55e;}

.kpi {font-size:18px; margin:5px 0;}
.green {color:#22c55e;}
.red {color:#ef4444;}
.yellow {color:#facc15;}

table {
    width:100%;
    border-collapse: collapse;
}

th, td {
    padding:8px;
    border-bottom:1px solid #334155;
}
</style>
</head>

<body>

<!-- MENU -->
<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
  <a href="resultados.html"><button>📊 Resultados</button></a>
  <a href="pipeline.html"><button>📈 Pipeline</button></a>
</div>

<h1>📈 Pipeline Comercial de Ensayos</h1>

<!-- REGISTRO -->
<div class="card">

<h2>Nuevo Registro</h2>

<input id="idEnsayo" placeholder="ID Ensayo">

<input id="productores" placeholder="Productores interesados">
<input id="leads" placeholder="Leads generados">
<input id="area" placeholder="Área potencial (ha)">
<input id="ventaEstimada" placeholder="Venta estimada $">
<input id="ventaCerrada" placeholder="Venta cerrada $">

<select id="recompra">
<option value="No">Recompra: No</option>
<option value="Sí">Recompra: Sí</option>
</select>

<button class="save" onclick="guardarPipeline()">Guardar</button>

</div>

<!-- DASHBOARD -->
<div class="card">
<h2>📊 Dashboard Comercial</h2>
<div id="dashboard"></div>
</div>

<!-- OPORTUNIDADES -->
<div class="card">

<h2>📋 Oportunidades Comerciales</h2>

<input id="idEnsayoO" placeholder="ID Ensayo">

<select id="interesado">
<option value="Sí">Productor interesado: Sí</option>
<option value="No">Productor interesado: No</option>
</select>

<input id="areaO" placeholder="Área potencial">
<input id="leadsO" placeholder="Leads generados">
<input id="ventaEstimadaO" placeholder="Venta estimada">
<input id="ventaCerradaO" placeholder="Venta cerrada">

<button class="save" onclick="guardarOportunidad()">Agregar</button>

<table id="tablaOportunidades">
<tr>
<th>ID</th>
<th>Interesado</th>
<th>Área</th>
<th>Leads</th>
<th>Venta Estimada</th>
<th>Venta Cerrada</th>
</tr>
</table>

</div>

<script>

// ================= DATA =================
let pipeline = JSON.parse(localStorage.getItem("pipeline")) || [];
let oportunidades = JSON.parse(localStorage.getItem("oportunidades")) || [];

// ================= GUARDAR PIPELINE =================
function guardarPipeline(){

    let data = {
        id: Date.now(),
        ensayo: idEnsayo.value,
        productores: +productores.value || 0,
        leads: +leads.value || 0,
        area: +area.value || 0,
        ventaEstimada: +ventaEstimada.value || 0,
        ventaCerrada: +ventaCerrada.value || 0,
        recompra: recompra.value,
        fecha: new Date().toLocaleString()
    };

    pipeline.push(data);
    localStorage.setItem("pipeline", JSON.stringify(pipeline));

    calcularDashboard();
}

// ================= DASHBOARD =================
function calcularDashboard(){

    let totalEnsayos = pipeline.length;

    let totalEstimado = pipeline.reduce((a,b)=>a+b.ventaEstimada,0);
    let totalVentas = pipeline.reduce((a,b)=>a+b.ventaCerrada,0);

    let conversion = totalEstimado > 0 ? (totalVentas/totalEstimado)*100 : 0;

    let clase = conversion >= 25 ? "green" : "red";
    let texto = conversion >= 25 ? "Exitoso" : "Bajo desempeño";

    dashboard.innerHTML = `
    <div class="kpi">Ensayos: ${totalEnsayos}</div>
    <div class="kpi">Venta Estimada: $${totalEstimado.toFixed(2)}</div>
    <div class="kpi">Venta Cerrada: $${totalVentas.toFixed(2)}</div>
    <div class="kpi">Conversión: ${conversion.toFixed(2)}%</div>
    <div class="kpi ${clase}">Evaluación: ${texto}</div>
    `;
}

calcularDashboard();

// ================= OPORTUNIDADES =================
function guardarOportunidad(){

    let data = {
        id: idEnsayoO.value,
        interesado: interesado.value,
        area: areaO.value,
        leads: leadsO.value,
        ventaEstimada: ventaEstimadaO.value,
        ventaCerrada: ventaCerradaO.value
    };

    oportunidades.push(data);
    localStorage.setItem("oportunidades", JSON.stringify(oportunidades));

    cargarTabla();
}

function cargarTabla(){

    tablaOportunidades.innerHTML = `
    <tr>
    <th>ID</th>
    <th>Interesado</th>
    <th>Área</th>
    <th>Leads</th>
    <th>Venta Estimada</th>
    <th>Venta Cerrada</th>
    </tr>
    `;

    oportunidades.forEach(o=>{
        tablaOportunidades.innerHTML += `
        <tr>
        <td>${o.id}</td>
        <td>${o.interesado}</td>
        <td>${o.area}</td>
        <td>${o.leads}</td>
        <td>$${o.ventaEstimada}</td>
        <td>$${o.ventaCerrada}</td>
        </tr>
        `;
    });
}

cargarTabla();

</script>

</body>
</html>
