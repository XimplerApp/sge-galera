<!DOCTYPE html>
<html>
<head>
<title>🧠 Inteligencia de Mercado</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
h1 {color:#38bdf8;}
.card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}
.kpi {margin:5px 0;}
.green {color:#22c55e;}
.yellow {color:#facc15;}
.red {color:#ef4444;}
#map {height:400px; border-radius:10px;}
table {width:100%; margin-top:10px;}
td,th {padding:8px; border-bottom:1px solid #334155;}
</style>
</head>

<body>

<!-- HEADER -->
<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
  <a href="resultados.html"><button>📊 Resultados</button></a>
  <a href="pipeline.html"><button>🌱 Pipeline</button></a>
  <a href="tablero.html"><button>🧠 Tablero</button></a>
</div>

<h1>🧠 Inteligencia de Mercado</h1>

<!-- MAPA -->
<div class="card">
<h2>🗺 Mapa Estratégico de Ensayos</h2>
<div id="map"></div>
</div>

<!-- RANKING -->
<div class="card">
<h2>🏆 Ranking de Variedades</h2>
<table id="ranking"></table>
</div>

<!-- RICE -->
<div class="card">
<h2>⚡ Motor de Prioridad (RICE)</h2>
<div id="rice"></div>
</div>

<!-- ALERTAS -->
<div class="card">
<h2>🚨 Reglas de Control</h2>
<div id="alertas"></div>
</div>

<!-- INSIGHTS -->
<div class="card">
<h2>🧠 Insights Automáticos</h2>
<div id="insights"></div>
</div>

<script>

// ===== DATA =====
let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];
let resultados = JSON.parse(localStorage.getItem("resultados")) || [];
let oportunidades = JSON.parse(localStorage.getItem("oportunidades")) || [];
let bitacora = JSON.parse(localStorage.getItem("bitacora")) || [];

// ===== MAPA =====
let map = L.map('map').setView([23.6,-102.5],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// colocar puntos
bitacora.forEach(b=>{
  if(b.lat){
    let e = ensayos.find(x=>x.id==b.ensayo_id) || {};
    let r = resultados.find(x=>x.ensayo_id==b.ensayo_id) || {};
    let o = oportunidades.filter(x=>x.ensayo==b.ensayo_id);

    let leads = o.reduce((a,b)=>a+b.leads,0);

    L.marker([b.lat,b.lng]).addTo(map)
    .bindPopup(`
      <b>${e.variedad_tratada}</b><br>
      Cultivo: ${e.cultivo}<br>
      Estado: ${e.estado}<br>
      ROI: ${(r.roi*100||0).toFixed(2)}%<br>
      Leads: ${leads}
    `);
  }
});

// ===== RANKING =====
let variedades = {};

resultados.forEach(r=>{
  let e = ensayos.find(x=>x.id==r.ensayo_id);
  if(!e) return;

  let o = oportunidades.filter(x=>x.ensayo==r.ensayo_id);

  let ventas = o.reduce((a,b)=>a+b.ventaCerrada,0);

  if(!variedades[e.variedad_tratada]){
    variedades[e.variedad_tratada] = {
      ensayos:0,
      roi:0,
      ventas:0
    };
  }

  variedades[e.variedad_tratada].ensayos++;
  variedades[e.variedad_tratada].roi += r.roi;
  variedades[e.variedad_tratada].ventas += ventas;
});

let rankingHTML = `
<tr>
<th>Variedad</th>
<th>Ensayos</th>
<th>ROI</th>
<th>Ventas</th>
<th>Adopción</th>
</tr>
`;

Object.entries(variedades).forEach(([v,data])=>{
  let roiProm = data.roi / data.ensayos;

  let adopcion = data.ventas > 100000 ? "Alta" :
                 data.ventas > 30000 ? "Media" : "Baja";

  rankingHTML += `
  <tr>
    <td>${v}</td>
    <td>${data.ensayos}</td>
    <td>${(roiProm*100).toFixed(2)}%</td>
    <td>$${data.ventas}</td>
    <td>${adopcion}</td>
  </tr>`;
});

document.getElementById("ranking").innerHTML = rankingHTML;


// ===== RICE =====
let riceHTML = "";

ensayos.forEach(e=>{
  let reach = Math.random()*100;
  let impact = Math.random()*10;
  let confidence = Math.random();
  let effort = Math.random()*10;

  let score = (reach * impact * confidence) / (effort || 1);

  riceHTML += `
  <div class="kpi">
  ${e.variedad_tratada} → Score: ${score.toFixed(2)}
  </div>`;
});

document.getElementById("rice").innerHTML = riceHTML;


// ===== ALERTAS =====
let alertasHTML = "";

resultados.forEach(r=>{

  if(r.roi < 0){
    alertasHTML += `<div class="red">❌ ROI negativo → No repetir</div>`;
  }

});

oportunidades.forEach(o=>{
  if(o.leads == 0){
    alertasHTML += `<div class="yellow">⚠️ Sin leads → revisar zona</div>`;
  }
});

document.getElementById("alertas").innerHTML = alertasHTML;


// ===== INSIGHTS =====
let insightsHTML = "";

Object.entries(variedades).forEach(([v,data])=>{

  if(data.ventas > 100000){
    insightsHTML += `
    <div class="green">
    🚀 ${v} muestra alta adopción → ESCALAR
    </div>`;
  }

  if(data.ensayos > 3 && data.ventas < 20000){
    insightsHTML += `
    <div class="yellow">
    ⚠️ ${v} tiene evidencia pero baja venta → EXPANDIR
    </div>`;
  }

  if(data.ventas < 10000){
    insightsHTML += `
    <div class="red">
    ❌ ${v} bajo desempeño → DESCARTAR
    </div>`;
  }

});

document.getElementById("insights").innerHTML = insightsHTML;

</script>

</body>
</html>
