<!DOCTYPE html>
<html>
<head>
<title>🧠 Inteligencia de Mercado</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {font-family: Arial; background:#0f172a; color:white; padding:20px;}
h1 {color:#38bdf8;}
.card {background:#1e293b; padding:20px; border-radius:10px; margin-bottom:20px;}
#map {height:400px; border-radius:10px;}

table {
  width:100%;
  border-collapse:collapse;
  text-align:center;
}

td,th {
  padding:10px;
  border-bottom:1px solid #334155;
}

th {background:#020617;}

.green {color:#22c55e;}
.yellow {color:#facc15;}
.red {color:#ef4444;}
</style>
</head>

<body>

<!-- HEADER -->
<div style="display:flex; gap:10px; margin-bottom:20px;">
  <a href="index.html"><button>📋 Ensayos</button></a>
  <a href="bitacora.html"><button>📸 Bitácora</button></a>
  <a href="resultados.html"><button>📊 Resultados</button></a>
  <a href="pipeline.html"><button>🌱 Pipeline</button></a>
  <a href="tablero.html"><button>🧠 Tablero</button></a>
  <a href="inteligencia.html"><button>🧠 Inteligencia</button></a>
  <a href="innovacion.html"><button>🚀 Innovación</button></a>
</div>

<h1>🧠 Inteligencia de Mercado</h1>

<!-- MAPA -->
<div class="card">
<h2>🗺 Mapa Estratégico de Ensayos</h2>
<div id="map"></div>
</div>

<!-- RANKING -->
<div class="card">
<h2>🏆 Ranking de Variedades</h2>
<table id="ranking"></table>
</div>

<!-- TABLA REGION -->
<div class="card">
<h2>🌍 Mapa de Ensayos por Región</h2>
<table id="tablaRegion"></table>
</div>

<!-- RICE -->
<div class="card">
<h2>⚡ Motor de Prioridad (RICE)</h2>
<div id="rice"></div>
</div>

<script>

// ===== DATA =====
let ensayos = JSON.parse(localStorage.getItem("ensayos")) || [];
let resultados = JSON.parse(localStorage.getItem("resultados")) || [];
let oportunidades = JSON.parse(localStorage.getItem("oportunidades")) || [];
let bitacora = JSON.parse(localStorage.getItem("bitacora")) || [];


// ===== MAPA =====
let map = L.map('map').setView([23.6,-102.5],5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

bitacora.forEach(b=>{
  if(b.lat){
    let e = ensayos.find(x=>x.id==b.ensayo_id) || {};
    let r = resultados.find(x=>x.ensayo_id==b.ensayo_id) || {};
    let o = oportunidades.filter(x=>x.ensayo==b.ensayo_id);

    let leads = o.reduce((a,b)=>a+b.leads,0);

    L.marker([b.lat,b.lng]).addTo(map)
    .bindPopup(`
      <b>${e.cultivo}</b><br>
      Región: ${e.region}<br>
      Estado: ${e.estado}<br>
      ROI: ${(r?.roi*100||0).toFixed(2)}%<br>
      Leads: ${leads}
    `);
  }
});


// ===== TABLA REGION =====
function renderTablaRegion(){

  let html = `
  <tr>
  <th>ID</th>
  <th>Región</th>
  <th>Estado</th>
  <th>Variedad</th>
  <th>ROI</th>
  <th>Status</th>
  </tr>
  `;

  ensayos.forEach(e=>{
    let r = resultados.find(x=>x.ensayo_id==e.id);
    let roi = r ? (r.roi*100).toFixed(2)+"%" : "0%";

    html += `
    <tr>
      <td>${e.id}</td>
      <td>${e.region}</td>
      <td>${e.region}</td>
      <td>${e.cultivo}</td>
      <td>${roi}</td>
      <td>${e.estado}</td>
    </tr>
    `;
  });

  document.getElementById("tablaRegion").innerHTML = html;
}


// ===== RANKING CON ADOPCIÓN REAL =====
function renderRanking(){

  let variedades = {};

  ensayos.forEach(e=>{

    let r = resultados.find(x=>x.ensayo_id==e.id);
    let ops = oportunidades.filter(x=>x.ensayo==e.id);

    let ventas = ops.reduce((a,b)=>a+(b.ventaCerrada||0),0);
    let tieneVenta = ventas > 0 ? 1 : 0;

    if(!variedades[e.cultivo]){
      variedades[e.cultivo] = {
        ensayos:0,
        roi:0,
        ventas:0,
        adopcionCount:0
      };
    }

    variedades[e.cultivo].ensayos++;
    variedades[e.cultivo].roi += (r ? r.roi : 0);
    variedades[e.cultivo].ventas += ventas;
    variedades[e.cultivo].adopcionCount += tieneVenta;
  });

  let html = `
  <tr>
  <th>Variedad</th>
  <th>Ensayos</th>
  <th>ROI Promedio</th>
  <th>Ventas</th>
  <th>Adopción</th>
  </tr>
  `;

  Object.entries(variedades).forEach(([v,data])=>{

    let roiProm = data.roi / data.ensayos;
    let adopcionReal = data.adopcionCount / data.ensayos;

    let nivel = adopcionReal > 0.6 ? "Alta" :
                adopcionReal > 0.3 ? "Media" : "Baja";

    html += `
    <tr>
      <td>${v}</td>
      <td>${data.ensayos}</td>
      <td>${(roiProm*100).toFixed(2)}%</td>
      <td>$${data.ventas.toFixed(2)}</td>
      <td>${nivel} (${(adopcionReal*100).toFixed(0)}%)</td>
    </tr>`;
  });

  document.getElementById("ranking").innerHTML = html;
}


// ===== RICE CON INTERPRETACIÓN =====
function renderRICE(){

  let variedades = {};

  ensayos.forEach(e=>{

    let r = resultados.find(x=>x.ensayo_id==e.id);
    let ops = oportunidades.filter(x=>x.ensayo==e.id);

    let leads = ops.reduce((a,b)=>a+(b.leads||0),0);
    let ventas = ops.reduce((a,b)=>a+(b.ventaCerrada||0),0);

    let roi = r ? r.roi : 0;
    let costo = r ? r.costo : 1;

    if(!variedades[e.cultivo]){
      variedades[e.cultivo] = {
        reach:0,
        impact:0,
        confidence:0,
        effort:0,
        ensayos:0
      };
    }

    variedades[e.cultivo].reach += leads;
    variedades[e.cultivo].impact += ventas;
    variedades[e.cultivo].confidence += roi;
    variedades[e.cultivo].effort += costo;
    variedades[e.cultivo].ensayos++;
  });

  let html = "";

  Object.entries(variedades).forEach(([v,data])=>{

    let reach = data.reach || 1;
    let impact = data.impact || 1;
    let confidence = (data.confidence / data.ensayos);
    let effort = data.effort || 1;

    let score = (reach * impact * confidence) / effort;

    let decision = "";
    let texto = "";
    let color = "";

    if(score > 70){
      decision = "🚀 ESCALAR";
      texto = "Alta oportunidad comercial. Incrementar inversión, ensayos y empuje técnico.";
      color = "green";
    } else if(score > 30){
      decision = "⚙️ OPTIMIZAR";
      texto = "Buen potencial, pero requiere ajustes en ejecución o conversión.";
      color = "yellow";
    } else {
      decision = "⛔ REVISAR";
      texto = "Bajo rendimiento actual. Evaluar continuidad o rediseñar estrategia.";
      color = "red";
    }

    html += `
    <div style="margin-bottom:15px; color:${color}">
      <b>🌱 ${v}</b><br>
      Score: ${score.toFixed(2)} | ${decision}<br>
      <small>${texto}</small>
    </div>`;
  });

  document.getElementById("rice").innerHTML = html;
}


// INIT
renderTablaRegion();
renderRanking();
renderRICE();

</script>

</body>
</html>
